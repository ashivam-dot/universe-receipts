      url: https://commons.wikimedia.org/wiki/File:LasCampanasObservatory.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2011'
      small: Ground-Based Survey
- text: This background star is located approximately 20,000 light-years away from Earth.
  emphasis:
  - 20,000 light-years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/M24%2C_the_Small_Sagittarius_Star_Cloud_%28Giuseppe_Donatiello%29.jpg/1920px-M24%2C_the_Small_Sagittarius_Star_Cloud_%28Giuseppe_Donatiello%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
