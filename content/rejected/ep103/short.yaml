    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: By verifying the lensing object emitted no light, they confirmed it was a black hole weighing about 7.1 times the
    mass of our Sun.
  emphasis:
  - emitted no light
  - 7.1 times the mass
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Computer_simulation_of_colliding_black_holes_%28ann16008a%29.tif/lossy-page1-3840px-Computer_simulation_of_colliding_black_holes_%28ann16008a%29.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
