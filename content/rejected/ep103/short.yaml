      credit: NASA/CXC/M.Weiss
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Illustration_of_a_Stellar-Mass_Black_Hole.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: In 2011, ground-based surveys detected a sudden spike in the brightness of a distant star.
  emphasis:
  - sudden spike
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/LasCampanasObservatory.jpg/1920px-LasCampanasObservatory.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
