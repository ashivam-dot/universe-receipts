- text: Astronomers realized the event occurred when an unseen object bent and magnified the star's light.
  emphasis:
  - unseen object
  - bent and magnified
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/05/Gravitational_microlensing_by_black_hole_%28Illustration%29_%28opo0003e%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
