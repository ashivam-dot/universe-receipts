- text: Back in 1860, astronomers at the Bonn Observatory cataloged a faint star in the constellation [Scutum](/skˈIOˌOtˈʌm/).
  emphasis:
  - Bonn Observatory
  - constellation Scutum
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Bad_Godesberg_P%C3%A4dagogium_Architektenzeichnung_Neubau_1899.jpg/1280px-Bad_Godesberg_P%C3%A4dagogium_Architektenzeichnung_Neubau_1899.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Bad Godesberg Pädagogium Architektenzeichnung Neubau 1899.jpg
      credit: Friedrich Schutte, Barmen (architect)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Bad_Godesberg_P%C3%A4dagogium_Architektenzeichnung_Neubau_1899.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1860'
      small: Bonn Observatory
- text: Originally designated as BD-12 degrees 5055, its flickering brightness revealed a pulsating variable star.
  emphasis:
  - variable star
  - flickering brightness
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/cb/Three_Steps_to_the_Hubble_Constant_%282019-25-4489%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Three Steps to the Hubble Constant (2019-25-4489).jpg
      credit: NASA, ESA, and A. Feild (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Three_Steps_to_the_Hubble_Constant_(2019-25-4489).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: In 2012, Very Large Telescope [interferometry](/ɪntˈɜɹfˈɜɹˈOmˈAtɹˈi/) in Chile calculated a staggering radius of 1,708
    solar radii.
  emphasis:
  - Very Large Telescope
  - 1,708 solar radii
  sfx: riser
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 1,708 Solar Radii
      small: Old radius estimate
    motion: zoom_in
- text: This massive size crowned UY [Scuti](/skˈIOˌOtˈI/) the largest known star, with a volume swallowing Jupiter's orbit.
  emphasis:
  - largest known star
  - Jupiter's orbit
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/6_Hebe_orbit.jpg/1280px-6_Hebe_orbit.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 6 Hebe orbit.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:6_Hebe_orbit.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: However, newer Gaia space telescope data revised its distance closer to Earth.
  emphasis:
  - Gaia space telescope
  - revised its distance
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Artist%27s_impression_of_the_Gaia-ESO_Survey_%28mpa-eso%29.tiff/lossy-page1-1920px-Artist%27s_impression_of_the_Gaia-ESO_Survey_%28mpa-eso%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist's impression of the Gaia-ESO Survey (mpa-eso).tiff
      credit: ESA/ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%27s_impression_of_the_Gaia-ESO_Survey_(mpa-eso).tiff
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: The updated measurements shrank its official radius down to approximately 909 solar radii.
  emphasis:
  - updated measurements
  - 909 solar radii
  sfx: pop
  pause_after: 0.4
