    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/84/A_bubbling_Betelgeuse_%28potw2634a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
