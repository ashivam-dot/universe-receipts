id: ep277
title: Why Black Holes Are Not Completely Black
series: Space Myths, Busted
format: v3
description: Physicist Stephen Hawking proved that black holes slowly leak energy until they explode. Quantum fluctuations
  at the event horizon cause even cosmic giants to evaporate.
