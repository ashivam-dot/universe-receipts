  - Moon
  - over 50 years
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/NASA%E2%80%99s_Space_Launch_System_%28SLS%29_rocket_with_the_Orion_spacecraft_aboard_is_seen_atop_a_mobile_launcher_at_Launch_Complex_39B.jpg/1920px-NASA%E2%80%99s_Space_Launch_System_%28SLS%29_rocket_with_the_Orion_spacecraft_aboard_is_seen_atop_a_mobile_launcher_at_Launch_Complex_39B.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
