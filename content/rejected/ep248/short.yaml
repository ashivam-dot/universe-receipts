id: ep248
title: The 31-Month Deep Space Alarm Clock
series: Mission Files
description: The solar-powered Rosetta probe survived thirty-one months of radio-silent hibernation before a pre-programmed
  alarm clock woke it up near a comet.
sources:
- https://en.wikipedia.org/wiki/Rosetta_(spacecraft)
