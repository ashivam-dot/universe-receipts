id: ep408
title: Why Neptune Only Finished One Orbit Since 1846
series: Scale Breaker
format: v3
description: Humanity discovered Neptune in 1846, but the ice giant travels so far out that it takes 165 Earth years to circle
  the Sun. It completed its very first observed orbit in July 2011.
