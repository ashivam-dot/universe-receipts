id: ep453
title: The Star Big Enough to SWALLOW Jupiter
series: Scale Breaker
format: v3
description: Betelgeuse is so immense that swapping it with our Sun would engulf Jupiter. In 2019, this colossal red supergiant
  shocked astronomers by blowing off part of its own surface.
sources:
- https://en.wikipedia.org/wiki/Betelgeuse
- https://science.nasa.gov/missions/hubble/hubble-sees-red-supergiant-star-betelgeuse-slowly-recovering-after-blowing-its-top/
- https://www.theguardian.com/science/2023/dec/08/eclipse-betelgeuse-star-asteroid
- http://www.berkeley.edu/news/media/releases/2009/06/09_betelim.shtml
- https://www.npr.org/2023/12/10/1218448190/a-massive-star-called-betelgeuse-will-be-briefly-obscured-by-an-asteroid-monday-
- https://web.archive.org/web/20191226131847/https://www.nationalgeographic.com/science/2019/12/betelgeuse-is-acting-strange-astronomers-are-buzzing-about-supernova/
- https://www.stsci.edu/contents/news-releases/2022/news-2022-037
hashtags:
- '#space'
- '#betelgeuse'
- '#astronomy'
tags:
- space
- betelgeuse
- astronomy
- supernova
- sun
- jupiter
