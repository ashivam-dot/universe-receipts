      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Edge-On_View_of_Saturn%27s_Rings_(1996-16-415).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Christiaan Huygens proved they were detached rings in 1659.
  emphasis:
  - '1659'
  - detached rings
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e4/Saturn_by_Christiaan_Huygens_%285192802002%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
