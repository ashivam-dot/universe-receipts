id: ep370
title: The Impossible Thinness of Saturn's Rings
series: Scale Breaker
format: v3
description: Saturn's rings span over 170,000 miles yet are as thin as a modern house, a mystery that baffled astronomers
  for centuries.
sources:
- https://en.wikipedia.org/wiki/Rings_of_Saturn
- http://www.space.com/scienceastronomy/090921-new-saturn-ring-images.html
- https://library.si.edu/digital-library/book/cristianihugeni00huyga-0
- https://web.archive.org/web/20090321071339/http://www2.jpl.nasa.gov/saturn/back.html
- https://www.planetary.org/blogs/emily-lakdawalla/2009/2084.html
- https://web.archive.org/web/20101215155552/http://news.nationalgeographic.com/news/2010/12/101213-saturn-rings-moon-ice-jupiter-science-space/
- http://www.astronomy.com/news/2019/01/saturns-rings-are-surprisingly-young
hashtags:
- '#space'
- '#saturn'
- '#astronomy'
tags:
- Saturn
- rings
- Galileo
- Huygens
- water ice
- space facts
- astronomy
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
  say:
    Huygens: hoi genz
beats:
- text: Saturn’s rings are wider than twenty Earths but razor-thin.
  emphasis:
  - twenty Earths
  - razor-thin
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg/3840px-PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA17172 Saturn eclipse mosaic bright crop.jpg
      credit: NASA / JPL-Caltech / Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: They span 170,000 miles, averaging just 30 feet thick.
  emphasis:
  - 170,000 miles
  - 30 feet thick
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Titan_-_May_16_2012_%2829974021423%29.jpg/960px-Titan_-_May_16_2012_%2829974021423%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Titan - May 16 2012 (29974021423).jpg
      credit: Kevin Gill from Los Angeles, CA, United States
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Titan_-_May_16_2012_(29974021423).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 30 feet
      small: Average thickness
- text: If scaled down to a city's width, the disk would be thinner than paper.
  emphasis:
  - city's width
  - thinner than paper
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Planetary_Rings_and_Northeast_US_%284078016411%29.jpg/1920px-Planetary_Rings_and_Northeast_US_%284078016411%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Planetary Rings and Northeast US (4078016411).jpg
      credit: Lunar and Planetary Institute from Houston, TX, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Planetary_Rings_and_Northeast_US_(4078016411).jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Galileo saw them in 1610 and thought they were ears.
  emphasis:
  - '1610'
  - ears
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/b8/Drawings_Saturn_Huyguens.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Drawings Saturn Huyguens.png
      credit: Christian Huygens (1629-1695).
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Drawings_Saturn_Huyguens.png
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1610'
      small: Galileo Galilei
