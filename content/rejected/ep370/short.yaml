  emphasis:
  - 100 million years
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Cassini%27s_Grand_Finale_%2836357287974%29.jpg/1280px-Cassini%27s_Grand_Finale_%2836357287974%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
