beats:
- text: A giant star will explode in our galaxy every year.
  emphasis:
  - every year
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/30/NASA%27s_Chandra_Examines_Milky_Way_at_Arms%27_Length_%28Illustration_Showing_Updated_Spiral_Arm_Positions%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: NASA's Chandra Examines Milky Way at Arms' Length (Illustration Showing Updated Spiral Arm Positions).jpg
      credit: NASA/CXC/SAO/M.Weiss
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA%27s_Chandra_Examines_Milky_Way_at_Arms%27_Length_(Illustration_Showing_Updated_Spiral_Arm_Positions).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Usually, our galaxy sees a supernova only once a century.
  emphasis:
  - once a century
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Crab_Nebula_imaged_using_James_Webb_Space_Telescope.png/3840px-Crab_Nebula_imaged_using_James_Webb_Space_Telescope.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Crab Nebula imaged using James Webb Space Telescope.png
      credit: NASA, ESA, CSA, STScI, T. Temim (Princeton University)
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Crab_Nebula_imaged_using_James_Webb_Space_Telescope.png
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1 PER CENTURY
      small: CURRENT SUPERNOVA RATE
- text: But 25,000 light-years away, the Milky Way’s heart is charging up.
  emphasis:
  - charging up
  sfx: whoosh
  visual:
    reuse: 2
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: NASA’s Chandra telescope caught a flare 400 times brighter than normal.
  emphasis:
  - 400 times
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/X-RayFlare-BlackHole-MilkyWay-20140105.jpg/960px-X-RayFlare-BlackHole-MilkyWay-20140105.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
