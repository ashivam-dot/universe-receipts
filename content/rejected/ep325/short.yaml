id: ep325
title: The Sun Isn't Yellow
series: Space Myths, Busted
format: v3
description: 'Childhood drawings get it wrong: the Sun is actually pure white, and our atmosphere plays tricks on our eyes.'
sources:
- https://en.wikipedia.org/wiki/Sun
- https://math.ucr.edu/home/baez/physics/General/BlueSky/blue_sky.html
- https://nibble-app.com/blog/is-the-sun-yellow-or-white
- https://biologyinsights.com/the-sun-is-white-not-yellow-the-science-explained/
- https://en.wikipedia.org/wiki/Rayleigh_scattering
hashtags:
- '#space'
- '#sun'
- '#nasa'
tags:
- Sun
- astronomy
- space myths
- Rayleigh scattering
- light
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
- text: The Sun isn't actually yellow.
  emphasis:
  - isn't actually yellow
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/3840px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Sun by the Atmospheric Imaging Assembly of NASA's Solar Dynamics Observatory - 20100819.jpg
      credit: NASA/SDO (AIA)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In space, unfiltered sunlight shines in pure white across the cosmos.
  emphasis:
  - pure white
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/ISS-46_Sun_rises_slowly.jpg/3840px-ISS-46_Sun_rises_slowly.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-46 Sun rises slowly.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-46_Sun_rises_slowly.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Its surface temperature sits near 5,800 Kelvin.
  emphasis:
  - 5,800 Kelvin
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/02_Sun_Structure_%282819311727%29.jpg/960px-02_Sun_Structure_%282819311727%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 02 Sun Structure (2819311727).jpg
      credit: Image Editor
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:02_Sun_Structure_(2819311727).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 5,800 K
      small: Surface temperature
- text: It emits a full rainbow spectrum of visible colors.
  emphasis:
  - rainbow spectrum
  visual:
    source: url
    url: https://live.staticflickr.com/7208/6931116587_5c22323e11_b.jpg
    credit:
      source: Flickr via Openverse
      title: Призма
      credit: iwannt
      license: CC BY 2.0
      url: https://www.flickr.com/photos/24241183@N08/6931116587
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Earth's protective atmosphere changes everything.
  emphasis:
  - protective atmosphere
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/ISS043-E-184471_-_View_of_Earth.jpg/3840px-ISS043-E-184471_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS043-E-184471 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS043-E-184471_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Gas molecules scatter short blue wavelengths completely away.
  emphasis:
  - blue wavelengths
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/ISS043-E-58549_-_View_of_Earth.jpg/3840px-ISS043-E-58549_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS043-E-58549 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS043-E-58549_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: This atmospheric scattering makes the direct solar disk appear yellow to us.
  emphasis:
  - appear yellow
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/97/Sunset_over_the_sea_with_a_small_boat.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Sunset over the sea with a small boat.jpg
      credit: Mehedi Hasan Rafu
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Sunset_over_the_sea_with_a_small_boat.jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.6
- text: That is precisely why the Sun isn't actually yellow.
  emphasis:
  - isn't actually yellow
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
