  voice: af_heart
  speed: 1.05
beats:
- text: Astronauts don't float in space because gravity is gone.
  emphasis:
  - don't float
  - gravity is gone
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/47/Iss017e011910.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Iss017e011910.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iss017e011910.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.53
    focus_y: 0.58
    box:
    - 0.44
    - 0.43
    - 0.65
    - 0.81
- text: At the altitude of the International Space Station, Earth's gravity is still roughly ninety percent as strong as it
    is on the ground.
  emphasis:
  - altitude
  - ninety percent
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/STS-134_International_Space_Station_after_undocking.jpg/3840px-STS-134_International_Space_Station_after_undocking.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: STS-134 International Space Station after undocking.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS-134_International_Space_Station_after_undocking.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90%
      small: Gravity strength at ISS
- text: Yet, the crew members inside experience the constant, daily sensation of total weightlessness.
  emphasis:
  - sensation
  - total weightlessness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/ISS-65_NASA_astronauts_work_in_the_U.S._Destiny_laboratory_module.jpg/3840px-ISS-65_NASA_astronauts_work_in_the_U.S._Destiny_laboratory_module.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-65 NASA astronauts work in the U.S. Destiny laboratory module.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-65_NASA_astronauts_work_in_the_U.S._Destiny_laboratory_module.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.32
    focus_y: 0.44
    box:
    - 0.22
    - 0.28
    - 0.45
    - 0.9
- text: This cosmic puzzle is solved by understanding that both the astronauts and their ship are in continuous free fall.
  emphasis:
  - continuous free fall
  sfx: riser
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/1993-03-21_Tandemsprong_Yolanda_Lippens_parachute_vrije_val.jpg/3840px-1993-03-21_Tandemsprong_Yolanda_Lippens_parachute_vrije_val.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 1993-03-21 Tandemsprong Yolanda Lippens parachute vrije val.jpg
      credit: Yolanl
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:1993-03-21_Tandemsprong_Yolanda_Lippens_parachute_vrije_val.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.65
    focus_y: 0.45
- text: The station travels sideways so fast that as gravity pulls it down, the planet's surface curves away below.
  emphasis:
  - travels sideways
  - curves away below
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/da/NISAR_satellite_orbit_%28SVS5615_-_2415%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: NISAR satellite orbit (SVS5615 - 2415).jpg
      credit: NASA's Scientific Visualization Studio - Science and Technology Corporation/Kel Elkins
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NISAR_satellite_orbit_(SVS5615_-_2415).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Completing one full orbit approximately every ninety minutes, the spacecraft is essentially falling around the world
    nonstop.
  emphasis:
  - full orbit
  - falling around the world
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/2c/Earth_and_international_space_station.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Earth and international space station.jpg
      credit: NASA / pingnews.com
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Earth_and_international_space_station.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90 minutes
      small: One full orbit
- text: Because everything falls together, there is no floor pushing back.
  emphasis:
  - falls together
  - no floor pushing back
  sfx: pop
  pause_after: 0.4
