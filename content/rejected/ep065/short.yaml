id: ep065
title: Why astronauts float in space
series: Space Myths, Busted
description: Discover the surprising truth about why astronauts float on the International Space Station.
sources:
- https://www.spaceunpacked.com/explainers/why-astronauts-float-real-reason-weightlessness
- https://sentinelmission.org/blog/why-do-astronauts-float-if-there-is-gravity/
- https://en.wikipedia.org/wiki/Weightlessness
- https://www.space.com/23017-weightlessness.html
- https://www.ebsco.com/research-starters/physics/understanding-weightless-flight
hashtags:
- '#space'
- '#nasa'
- '#physics'
tags:
- astronauts
- gravity
- International Space Station
- physics
- free fall
