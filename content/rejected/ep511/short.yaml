id: ep511
title: Pluto's Sky Is Freezing Solid Right Now
series: Space Got Weird
format: v3
description: As Pluto moves farther from the Sun in its 248-year orbit, its nitrogen atmosphere is finally collapsing into
  frost on its surface.
