- https://www.space.com/astronomy/pluto/plutos-atmosphere-is-collapsing-as-it-drifts-away-from-the-sun-into-a-deep-freeze
- https://www.universetoday.com/articles/scientists-watch-as-a-distant-worlds-atmosphere-shrinks-and-thins
- https://en.wikipedia.org/wiki/Pluto
- https://web.archive.org/web/20151128162358/http://nssdc.gsfc.nasa.gov/planetary/factsheet/plutofact.html
