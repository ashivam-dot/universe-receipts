id: ep101
title: The Comet That Sold Gas Masks and Fake Pills
series: Space Myths, Busted
description: In 1910, the detection of cyanogen gas in Halley's Comet sent Earth into a panic, sparking massive sales of gas
  masks and quack remedies.
sources:
- https://en.wikipedia.org/wiki/Halley%27s_Comet
- https://www.astronomy.com/science/halleys-comet-covid-19-and-the-history-of-miracle-anti-comet-remedies/
