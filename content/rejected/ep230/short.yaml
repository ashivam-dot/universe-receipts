id: ep230
title: The Billion Light-Year Hole Draining Space's Energy
series: Scale Breaker
description: Astronomers discovered the Eridanus Supervoid, a gargantuan chasm nearly two billion light-years wide that actively
  chills light from the early universe.
sources:
- https://en.wikipedia.org/wiki/CMB_cold_spot
- https://www.space.com/scienceastronomy/070823_huge_hole.html
- https://www.iac.es/en/outreach/news/astronomers-confirm-existence-cosmic-supervoid-challenges-our-understanding-dark-energy
- https://scaleofuniverse.com/universe/eridanus-supervoid
- https://spacefed.com/astronomy/eridanus-supervoid-may-explain-cosmic-microwave-background-anomalous-cold-spot/
- https://facts.net/nature/universe/27-facts-about-eridanus-supervoid/
- https://arxiv.org/abs/2112.07699
hashtags:
- '#space'
- '#eridanussupervoid'
- '#astronomy'
tags:
- eridanus supervoid
- cold spot
- cosmic microwave background
- dark energy
- astronomy
- space void
- cosmology
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A cosmic abyss two billion light-years wide is stealing light's energy.
  emphasis:
  - stealing light's energy
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/39/Axis_od_evil.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
