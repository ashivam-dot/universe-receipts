      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Axis_od_evil.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.79
    focus_y: 0.84
- text: Spanning nearly two billion light-years across, the Eridanus Supervoid holds the record as space's most massive emptiness.
  emphasis:
  - Eridanus Supervoid
  - massive emptiness
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Eridanus_%28Annotated%29_%28eridanus-ann%29.jpg/3840px-Eridanus_%28Annotated%29_%28eridanus-ann%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Eridanus (Annotated) (eridanus-ann).jpg
      credit: E. Slawik/NOIRLab/NSF/AURA/M. Zamani
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Eridanus_(Annotated)_(eridanus-ann).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.55
    focus_y: 0.32
    box:
    - 0.36
    - 0.23
    - 0.68
    - 0.44
- text: Inside this gargantuan cosmic chasm, vast amounts of galaxies, gas, and dark matter are missing.
  emphasis:
  - dark matter
  - missing
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Observable_Universe_not_in_the_Cosmic_Microwave_Background.png/960px-Observable_Universe_not_in_the_Cosmic_Microwave_Background.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Observable Universe not in the Cosmic Microwave Background.png
      credit: UniViki
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Observable_Universe_not_in_the_Cosmic_Microwave_Background.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: As light from the Big Bang enters the void, dark energy accelerates space's expansion.
  emphasis:
  - dark energy
  - accelerates space's expansion
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/CMB_universe_expansion.png/1920px-CMB_universe_expansion.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: CMB universe expansion.png
      credit: NASA/WMAP Science Team/ Art by Dana Berry
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_universe_expansion.png
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: 380,000 YEARS
      small: after the Big Bang
- text: The stretched gravitational landscape drains energy from passing photons, cooling them as they exit.
  emphasis:
  - drains energy
  - cooling them
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/WMAP_2012.png/3840px-WMAP_2012.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: WMAP 2012.png
      credit: NASA / WMAP Science Team
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:WMAP_2012.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    box:
    - 0.1
    - 0.1
    - 0.9
    - 0.9
- text: This leaves a region significantly colder than the universe's background radiation, encircled by a warm ring.
  emphasis:
  - significantly colder
  - warm ring
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/da/CMB_Axis_of_Evil_and_bruises.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
