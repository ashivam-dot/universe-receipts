    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.75
    box:
    - 0.0
    - 0.5
    - 1.0
    - 1.0
- text: The dots aren't traveling across the rubber.
  emphasis:
  - aren't traveling
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Rubin_The_Expanding_Universe_Investigation_Icon_%28rubin-The-Expanding-Universe-investigation%29.jpg/960px-Rubin_The_Expanding_Universe_Investigation_Icon_%28rubin-The-Expanding-Universe-investigation%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Rubin The Expanding Universe Investigation Icon (rubin-The-Expanding-Universe-investigation).jpg
      credit: RubinObs/NOIRLab/SLAC/NSF/DOE/AURA
      license: CC BY 4.0
