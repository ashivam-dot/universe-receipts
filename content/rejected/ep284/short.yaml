      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Expanding_Our_View_(2022_STScI_presentation)_(SVS14175_-_Slide13).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.7
    focus_y: 0.5
