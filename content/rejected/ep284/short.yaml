beats:
- text: The Big Bang never actually exploded.
  emphasis:
  - never actually exploded
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/00/NASA%E2%80%99s_Webb_Will_Use_Quasars_to_Unlock_the_Secrets_of_the_Early_Universe_%2851656393132%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: NASA’s Webb Will Use Quasars to Unlock the Secrets of the Early Universe (51656393132).png
      credit: NASA's James Webb Space Telescope from Greenbelt, MD, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:NASA%E2%80%99s_Webb_Will_Use_Quasars_to_Unlock_the_Secrets_of_the_Early_Universe_(51656393132).png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: It was actually space itself stretching everywhere at once.
  emphasis:
  - stretching everywhere
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Rubin_Expanding_Universe_Investigation_Assets_%28rubin-p10%29.jpg/960px-Rubin_Expanding_Universe_Investigation_Assets_%28rubin-p10%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Rubin Expanding Universe Investigation Assets (rubin-p10).jpg
      credit: RubinObs/NOIRLab/SLAC/NSF/DOE/AURA
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Rubin_Expanding_Universe_Investigation_Assets_(rubin-p10).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Imagine an inflating balloon covered in hundreds of dots.
  emphasis:
  - inflating balloon
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/25/Big_Bang_and_Steady-State_Theory.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Big Bang and Steady-State Theory.png
      credit: Artistosteles
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Big_Bang_and_Steady-State_Theory.png
