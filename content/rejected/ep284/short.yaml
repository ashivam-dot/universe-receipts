    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: The rubber between them is simply getting larger.
  emphasis:
  - simply getting larger
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/46/Expanding_Our_View_%282022_STScI_presentation%29_%28SVS14175_-_Slide13%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
