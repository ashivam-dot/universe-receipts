- https://www.space.com/19027-universe-baby-picture-wmap.html
- https://www.pbs.org/wgbh/aso/databank/entries/dp27bi.html
- https://www.scientificamerican.com/article/astronomers-grapple-with-jwsts-discovery-of-early-galaxies1/
