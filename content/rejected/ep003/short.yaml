- text: It completed one orbit every 96 minutes, broadcasting a distinct beep-beep-beep signal across the globe.
  emphasis:
  - beep-beep-beep
  visual:
    source: card
    card:
      kind: fact
      big: 96 minutes
      small: per orbital lap
    motion: zoom_in
- text: Yet the tiny, 184-pound spacecraft remained practically impossible to spot with the naked eye.
  emphasis:
  - impossible to spot
  sfx: riser
  visual:
    reuse: 3
    motion: zoom_out
    focus_x: 0.75
    focus_y: 0.35
- text: The bright light people actually saw was Sputnik's massive, 85-foot-long discarded rocket booster.
  emphasis:
  - rocket booster
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 3
    motion: zoom_in
    focus_x: 0.75
    focus_y: 0.35
- text: Tracking this cosmic chase eventually helped modern researchers develop satellite navigation systems like GPS.
  emphasis:
  - GPS
  sfx: whoosh
  visual:
