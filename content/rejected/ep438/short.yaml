    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Objects orbit a shared balancing point called a barycenter.
  emphasis:
  - barycenter
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Solar_System_Illustration_%28rubin-20220314-Solar-System-hero%29.tiff/lossy-page1-3840px-Solar_System_Illustration_%28rubin-20220314-Solar-System-hero%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
