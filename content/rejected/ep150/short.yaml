    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1,300 AU
      small: event horizon radius
- text: That is 40 times Pluto’s distance from the Sun, all swallowed into one dark sphere.
  emphasis:
  - 40 times Pluto
  - dark sphere
  visual:
    source: card
    card:
      kind: fact
      big: 40X Pluto
      small: size of the orbit
    motion: zoom_in
