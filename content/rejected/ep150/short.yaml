- text: That point of light is an ultramassive black hole spanning 1,300 astronomical units across.
  emphasis:
  - ultramassive black hole
  - 1,300 astronomical units
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/f2/Artist%E2%80%99s_impression_of_quasar_J0313-1806.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
