id: ep481
title: The Martian Volcano That Freezes Air Without Dust
series: Space Got Weird
format: v3
description: Every morning on Mars, a 1,100-mile water-ice cloud forms over the giant volcano Arsia Mons. Scientists discovered
  it freezes spontaneously out of thin air without any dust particles.
