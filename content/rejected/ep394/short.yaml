id: ep394
title: The Milky Way is Hiding Huge Radiation Bubbles
series: Scale Breaker
format: v3
description: NASA discovered two gargantuan bubbles of radiation hiding in the Milky Way. These Fermi bubbles span half the
  galaxy's diameter and suggest a violent past.
