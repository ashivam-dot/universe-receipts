id: ep330
title: Hubble Discovers Missing Oxygen in Nearby Galaxies
series: Scale Breaker
format: v3
description: Astronomers using NASA's Hubble Space Telescope discovered that dwarf galaxies are missing massive amounts of
  expected oxygen. Supernova explosions trigger violent galactic winds that blast the element out into intergalactic space.
