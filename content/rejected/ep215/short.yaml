id: ep215
title: The 10,000-Year Moon Shadow Myth
series: Space Myths, Busted
description: Discover why the changing phases of the Moon are actually a trick of perspective rather than Earth's shadow.
sources:
- https://en.wikipedia.org/wiki/Lunar_phase
- https://discoverwildscience.com/what-causes-the-moons-phases-hint-not-earths-shadow-4-335112/
- https://scienceinsights.org/why-does-the-moons-appearance-change/
- https://www.sciencenewstoday.org/lunar-phases-the-28-day-cycle-of-light-and-shadow
- https://web.archive.org/web/20130809125949/http://phys.org/news/2013-07-scotland-lunar-calendar-stone-age-rethink.html
- https://www.skyatnightmagazine.com/space-science/why-does-the-moons-appearance-change
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- Moon
- lunar phases
- astronomy
- space myths
- Warren Field
- NASA
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Earth's shadow almost never touches the Moon.
  emphasis:
  - shadow
  - almost never
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/83/Moon_nearside_LRO_color_mosaic.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Moon nearside LRO color mosaic.png
      credit: NASA/GSFC/Arizona State University
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moon_nearside_LRO_color_mosaic.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: For 10,000 years since Warren Field in Scotland, humans tracked this cycle while misunderstanding it.
  emphasis:
  - 10,000 years
  - Warren Field
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: 10,000 Years Ago
      small: Warren Field, Scotland
    motion: zoom_in
- text: This site beat every other ancient calendar to become the world's oldest formal record of time.
  emphasis:
  - oldest formal record
  - world's oldest
  visual:
    source: card
    card:
      kind: fact
      big: World Record
      small: Oldest Formal Calendar
    motion: zoom_in
- text: That ancient pit calendar recorded the phases, but Earth was never blocking the Sun.
  emphasis:
  - recorded the phases
  - blocking the Sun
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/37._Production_of_phases_of_the_moon_%2822126908233%29.jpg/1280px-37._Production_of_phases_of_the_moon_%2822126908233%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 37. Production of phases of the moon (22126908233).jpg
      credit: Community Archives
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:37._Production_of_phases_of_the_moon_(22126908233).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In reality, the Sun constantly illuminates exactly half of the Moon's rocky surface.
  emphasis:
  - constantly illuminates
  - half
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Moon_Orbit_%28PSF%29.png/1920px-Moon_Orbit_%28PSF%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon Orbit (PSF).png
      credit: Pearson Scott Foresman
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moon_Orbit_(PSF).png
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: As the Moon orbits every 29.5 days, our perspective of that sunlit side constantly shifts.
  emphasis:
  - 29.5 days
  - perspective
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/First_Quarter_%2815982765351%29.jpg/960px-First_Quarter_%2815982765351%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: First Quarter (15982765351).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:First_Quarter_(15982765351).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 29.5 Days
      small: Phase Cycle
- text: Our planet's massive shadow only touches the lunar surface during rare eclipses twice a year.
  emphasis:
  - massive shadow
  - twice a year
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Total_Lunar_Eclipse_2026_%E2%80%93_New_Orleans_%28MAF_20260303_LunarEclipse_01%29.jpg/3840px-Total_Lunar_Eclipse_2026_%E2%80%93_New_Orleans_%28MAF_20260303_LunarEclipse_01%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Total Lunar Eclipse 2026 – New Orleans (MAF 20260303 LunarEclipse 01).jpg
      credit: NASA Michoud Assembly Facility / NASA/Michael DeMocker
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Total_Lunar_Eclipse_2026_%E2%80%93_New_Orleans_(MAF_20260303_LunarEclipse_01).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Twice a Year
      small: Lunar Eclipses
- text: Yet despite millennia of human record-keeping, millions still believe that Earth creates these shadows.
  emphasis:
  - record-keeping
  - millions
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/2017_Eclipse-_Earth%2C_Moon_and_Sun_%2836035244880%29.jpg/960px-2017_Eclipse-_Earth%2C_Moon_and_Sun_%2836035244880%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 2017 Eclipse- Earth, Moon and Sun (36035244880).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:2017_Eclipse-_Earth,_Moon_and_Sun_(36035244880).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: This explains why Earth's shadow almost never touches the Moon.
  emphasis:
  - explains why
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: SHADOWS ALMOST NEVER TOUCH
