id: ep075
title: The Moon Rock That Broke Lunar History
series: Space Got Weird
description: Apollo 16 returned with bright lunar rocks that challenged everything we thought we knew about the Moon's ancient
  magma ocean.
sources:
- https://en.wikipedia.org/wiki/Anorthosite
- https://science.nasa.gov/earth/earth-observatory/moon-like-madagascar/
- https://en.wikipedia.org/wiki/Ferroan_anorthosite
- https://www.nature.com/articles/nature10328
- http://www.psrd.hawaii.edu/April04/lunarAnorthosites.html
hashtags:
- '#space'
- '#apollo'
- '#geology'
tags:
- anorthosite
- moon rock
- apollo 16
- lunar highlands
- magma ocean
- sample 60025
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The Moon's brightest rocks are too young to exist.
  emphasis:
  - brightest rocks
  - too young
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Back_side_of_the_Moon_AS16-3021.jpg/1920px-Back_side_of_the_Moon_AS16-3021.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Back side of the Moon AS16-3021.jpg
      credit: Apollo 16 astronauts
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Back_side_of_the_Moon_AS16-3021.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In 1972, Apollo 16 astronauts returned stunningly bright stones called anorthosite from the lunar highlands.
  emphasis:
  - anorthosite
  - lunar highlands
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/John_W._Young_on_the_Moon.jpg/3840px-John_W._Young_on_the_Moon.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: John W. Young on the Moon.jpg
      credit: Charlie Duke
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:John_W._Young_on_the_Moon.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.65
    focus_y: 0.45
- text: For decades, experts believed these rocks floated like icebergs atop a primordial magma ocean.
  emphasis:
  - magma ocean
  - floated
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1920px-NASA-Apollo8-Dec24-Earthrise.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-Apollo8-Dec24-Earthrise.jpg
      credit: NASA/Bill Anders
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-Apollo8-Dec24-Earthrise.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This coarse-grained crust is 90 percent plagioclase feldspar, a mineral that is less dense than liquid magma.
  emphasis:
  - 90 percent
  - plagioclase feldspar
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Lunar_anorthosite_descartes_highlands_%2836131355931%29.jpg/1280px-Lunar_anorthosite_descartes_highlands_%2836131355931%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Lunar anorthosite descartes highlands (36131355931).jpg
      credit: the paleobear from Lontananza, Loreto, Peru
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Lunar_anorthosite_descartes_highlands_(36131355931).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.6
- text: But in 2011, researchers used precise chemical dating on lunar Sample 60025 and found it was only 4.36 billion years
    old.
  emphasis:
  - Sample 60025
  - 4.36 billion
  sfx: riser
  visual:
    source: card
    card:
      kind: dateline
      big: '2011'
      small: Sample 60025 Dated
    motion: zoom_in
- text: This age is over 100 million years too young for a crust formed at the Moon's birth.
  emphasis:
  - too young
  - Moon's birth
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 4.36 Billion
      small: Years Old
    motion: zoom_in
- text: This discovery suggests the Moon was volcanically active much later than scientists ever imagined.
  emphasis:
  - volcanically active
  - later
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/PIA18821-LunarGrailMission-OceanusProcellarum-Rifts-Closeup-20141001.jpg/1280px-PIA18821-LunarGrailMission-OceanusProcellarum-Rifts-Closeup-20141001.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA18821-LunarGrailMission-OceanusProcellarum-Rifts-Closeup-20141001.jpg
      credit: NASA/Colorado School of Mines/MIT/JPL/GSFC
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA18821-LunarGrailMission-OceanusProcellarum-Rifts-Closeup-20141001.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Geologists are now forced to rewrite the entire ancient history of our closest neighbor.
  emphasis:
  - rewrite
  - closest neighbor
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: IMPOSSIBLE LUNAR AGES
