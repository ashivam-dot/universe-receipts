id: ep122
title: The Blue Planet That Rains Sideways Glass
series: The Universe Is Terrifying
description: HD 189733 b looks like a peaceful blue marble from afar, but its atmosphere is a scorching inferno. Powerful
  winds whip molten silicate particles sideways through toxic clouds.
sources:
- https://en.wikipedia.org/wiki/HD_189733_b
