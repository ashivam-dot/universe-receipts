  emphasis:
  - mechanical drill
  - cooled chamber
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/52/Vega_model_-_Udvar-Hazy_Center.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
