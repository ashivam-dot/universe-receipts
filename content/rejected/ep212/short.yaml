id: ep212
title: Surviving Venus for 127 Minutes
series: Mission Files
description: In 1982, Soviet lander Venera 13 touched down in a lead-melting furnace and transmitted for nearly four times
  its intended lifespan.
sources:
- https://en.wikipedia.org/wiki/Venera_13
- https://www.space.com/18551-venera-13.html
- https://www.spacedaily.com/in-1982-the-soviet-union-landed-a-probe-on-the-surface-of-venus-that-survived-127-minutes-in-heat-that-melts-lead-and-pressure-dense-enough-to-crush-a-submarine-long-enough-to-scan-back-two/
- https://en.wikipedia.org/wiki/Venera_program
- http://www.livescience.com/18083-life-venus-russian-claim.html
- https://web.archive.org/web/20120825000825/http://www.telegraph.co.uk/science/space/9034433/Russian-scientist-claims-1982-pictures-shows-life-on-Venus.html
