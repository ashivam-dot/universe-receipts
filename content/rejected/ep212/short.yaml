- text: Yet it kept talking, capturing the first acoustic sound recordings ever made on another world.
  emphasis:
  - acoustic sound recordings
  - another world
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: First Audio
      small: From Another Planet
    motion: zoom_in
