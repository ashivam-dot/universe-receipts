  emphasis:
  - first color panoramas
  - alien creatures
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/PIA00259_Venus_-_False_Color_of_Bereghinya_Planitia.jpg/1920px-PIA00259_Venus_-_False_Color_of_Bereghinya_Planitia.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
