id: ep011
title: The Escape of Orion's Giant Star
series: Space Got Weird
description: Betelgeuse was ejected from Orion's Belt and now plows through space at thirty kilometers per second with a massive
  bow shock.
sources:
- https://en.wikipedia.org/wiki/Betelgeuse
- https://www.nasa.gov/blogs/watch-the-skies/2024/09/06/betelgeuse-betelgeuse-betelgeuse-stargazers-wont-see-ghosts-but-supergiant-star-for-spooky-season/
