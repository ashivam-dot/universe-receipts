voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Betelgeuse is secretly an escaped runaway star barreling across the galaxy.
  emphasis:
  - escaped runaway star
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Betelgeuse_captured_by_ALMA.jpg/3840px-Betelgeuse_captured_by_ALMA.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Betelgeuse captured by ALMA.jpg
      credit: ALMA (ESO/NAOJ/NRAO)/E. O’Gorman/P. Kervella
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse_captured_by_ALMA.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This red supergiant sits in the constellation Orion, normally ranking among the ten brightest stars in our night sky.
  emphasis:
  - red supergiant
  - ten brightest stars
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Orion_%28Annotated%29_%28orion-ann%29.tiff/lossy-page1-3840px-Orion_%28Annotated%29_%28orion-ann%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Orion (Annotated) (orion-ann).tiff
      credit: E. Slawik/NOIRLab/NSF/AURA/M. Zamani
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Orion_(Annotated)_(orion-ann).tiff
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: If placed at the center of our solar system, its massive body would swallow Earth and stretch all the way out to Mars.
  emphasis:
  - swallow Earth
  - out to Mars
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Betelgeuse_Plume_eso0927d.jpg/960px-Betelgeuse_Plume_eso0927d.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Betelgeuse Plume eso0927d.jpg
      credit: ESO/L. Calçada
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse_Plume_eso0927d.jpg
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.3
    box:
    - 0.35
    - 0.0
    - 0.65
    - 0.35
    card:
      kind: fact
      big: Past Mars
      small: Stellar radius
- text: Millions of years ago, violent gravitational forces flung this giant out of its birthplace near Orion's Belt.
  emphasis:
  - birthplace
  - Orion's Belt
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Orion%27s_Belt_-_Flickr_-_gjdonatiello.jpg/3840px-Orion%27s_Belt_-_Flickr_-_gjdonatiello.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Orion's Belt - Flickr - gjdonatiello.jpg
      credit: Giuseppe Donatiello from Oria (Brindisi), Italy
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Orion%27s_Belt_-_Flickr_-_gjdonatiello.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Now, the ten-million-year-old star plows through the interstellar medium at thirty kilometers per second.
  emphasis:
  - thirty kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Betelgeuse%E2%80%99s_dust_plumes_seen_by_VISIR_image_%28eso2003d%29.tiff/lossy-page1-1280px-Betelgeuse%E2%80%99s_dust_plumes_seen_by_VISIR_image_%28eso2003d%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Betelgeuse’s dust plumes seen by VISIR image (eso2003d).tiff
      credit: 'ESO/P. Kervella/M. Montargès et al., Acknowledgement: Eric Pantin'
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse%E2%80%99s_dust_plumes_seen_by_VISIR_image_(eso2003d).tiff
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 30 km/s
      small: Speed through space
- text: As its powerful stellar wind slams into surrounding gas, it forms a gargantuan cosmic shockwave.
  emphasis:
  - cosmic shockwave
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d4/Orion%27s_Big_Head_Revealed_in_Infrared.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Orion's Big Head Revealed in Infrared.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Orion%27s_Big_Head_Revealed_in_Infrared.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Its collision with interstellar dust creates a glowing shield four light-years wide.
  emphasis:
  - four light-years wide
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 6
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: That is how a giant star became a celestial runaway.
  emphasis:
  - celestial runaway
  visual:
    reuse: 1
    motion: zoom_in
