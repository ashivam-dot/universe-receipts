id: ep298
title: Why Uranus Orbits the Sun on Its Side
series: Space Got Weird
format: v3
description: Uranus has an extreme axial tilt of nearly 98 degrees, subjecting its poles to 42 years of continuous daylight
  followed by 42 years of total darkness.
sources:
- https://en.wikipedia.org/wiki/Uranus
- https://science.nasa.gov/uranus/facts/
- https://web.archive.org/web/20200327215013/https://www.nytimes.com/2020/03/27/science/uranus-bubble-voyager.html
- https://www.theguardian.com/science/2022/jul/16/uranus-mission-space-exploration-nasa
hashtags:
- '#space'
- '#uranus'
- '#astronomy'
tags:
- uranus
