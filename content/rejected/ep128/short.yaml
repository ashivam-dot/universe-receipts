- text: In 1916, astronomer Edward Emerson Barnard found this star crosses the width of the full Moon every 180 years.
  emphasis:
  - '1916'
  - 180 years
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/The_story_of_the_sun%2C_moon%2C_and_stars_%281898%29_%2814778585372%29.jpg/1280px-The_story_of_the_sun%2C_moon%2C_and_stars_%281898%29_%2814778585372%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
