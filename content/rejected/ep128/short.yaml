    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 110 KM/S
      small: speed toward the Sun
- text: For over half a century, astronomers announced giant planets around it, only to debunk them as telescope errors.
  emphasis:
  - telescope errors
  - debunk them
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Swarthmore_College_Observatory.jpg/3840px-Swarthmore_College_Observatory.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Swarthmore College Observatory.jpg
      credit: Smallbones
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Swarthmore_College_Observatory.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.45
    focus_y: 0.45
