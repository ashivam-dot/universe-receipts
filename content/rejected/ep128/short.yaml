      credit: 'NASA''s Goddard Space Flight Center. Chris Smith (USRA): Lead Producer'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:AU_MIc_M-dwarf_artist%27s_conception.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: It is blueshifted and racing straight toward our Sun at roughly 110 kilometers per second.
  emphasis:
  - 110 kilometers per second
  - Sun
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Artist%E2%80%99s_impression_of_super-Earth_orbiting_Barnard%E2%80%99s_Star_%28eso1837b%29.tiff/lossy-page1-3840px-Artist%E2%80%99s_impression_of_super-Earth_orbiting_Barnard%E2%80%99s_Star_%28eso1837b%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
