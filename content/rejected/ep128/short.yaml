    - color
    motion: zoom_in
    focus_x: 0.48
    focus_y: 0.38
    box:
    - 0.25
    - 0.1
    - 0.67
    - 0.55
    card:
      kind: dateline
      big: '1916'
      small: Edward Emerson Barnard
- text: Located roughly six light-years away, it is our closest neighbor after the Alpha Centauri system.
  emphasis:
  - six light-years
  - closest neighbor
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Orbital_plot_of_Proxima_Centauri.jpg/960px-Orbital_plot_of_Proxima_Centauri.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Orbital plot of Proxima Centauri.jpg
      credit: P. Kervella (CNRS/U. of Chile/Observatoire de Paris/LESIA), ESO/Digitized Sky Survey 2, D. De Martin/M. Zamani
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Orbital_plot_of_Proxima_Centauri.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Yet despite its proximity, this red dwarf is too dim to see with the unaided eye.
  emphasis:
  - red dwarf
  - unaided eye
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/AU_MIc_M-dwarf_artist%27s_conception.jpg/1280px-AU_MIc_M-dwarf_artist%27s_conception.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
