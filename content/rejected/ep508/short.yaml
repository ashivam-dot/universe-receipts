  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: died in seconds
      small: ''
    motion: zoom_in
- text: It made history as the first successful soft landing.
  emphasis:
  - first successful soft landing
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/FP2A3620_%2823497688248%29_%28cropped%29.jpg/1280px-FP2A3620_%2823497688248%29_%28cropped%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
