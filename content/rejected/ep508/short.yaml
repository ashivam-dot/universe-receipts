  - partial gray image
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Delta_on_Mars.jpg/1920px-Delta_on_Mars.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
