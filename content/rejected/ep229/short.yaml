- https://grokipedia.com/page/1972_Great_Daylight_Fireball
- https://web.archive.org/web/20161019155203/http://www.phys.ncku.edu.tw/~astrolab/mirrors/apod_e/ap090302.html
- https://web.archive.org/web/20071020025037/http://www.astrosociety.org/pubs/mercury/9806/impact.html
