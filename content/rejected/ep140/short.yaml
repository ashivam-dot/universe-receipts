id: ep140
title: The Bizarre Walnut Moon of Saturn
series: Space Got Weird
description: Saturn's moon Iapetus has a 12-mile-high equatorial ridge and two vastly different faces. Here is why Giovanni
  Cassini watched it vanish in 1671.
sources:
- https://en.wikipedia.org/wiki/Iapetus_(moon)
- https://science.nasa.gov/saturn/moons/iapetus/
- https://www.astronomy.com/science/weird-object-iapetus/
- https://web.archive.org/web/20060808065916/http://planetary.org/explore/topics/saturn/iapetus.html
- https://www.bbc.co.uk/news/science-environment-19011011
hashtags:
- '#space'
- '#saturn'
- '#iapetus'
tags:
- space
- astronomy
- saturn
- iapetus
- cassini
- moons
- planetary science
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A giant moon of Saturn vanished every time it orbited east.
  emphasis:
  - vanished
  - orbited east
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Iapetus_colorized.jpg/960px-Iapetus_colorized.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Iapetus colorized.jpg
      credit: Unknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iapetus_colorized.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.34
    focus_y: 0.5
- text: In 1671, astronomer Giovanni Domenico Cassini tracked [Iapetus](/ˈIˈæpˈAtˈʌs/) on Saturn's western side, but lost
    it entirely on the east.
  emphasis:
  - '1671'
  - lost it entirely
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Giovanni_Domenico_Cassini%2C_Biblioteca_Aprosiana.jpg/1280px-Giovanni_Domenico_Cassini%2C_Biblioteca_Aprosiana.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Giovanni Domenico Cassini, Biblioteca Aprosiana.jpg
      credit: Unknown authorUnknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Giovanni_Domenico_Cassini,_Biblioteca_Aprosiana.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.65
    focus_y: 0.4
    box:
    - 0.1
    - 0.05
    - 0.85
    - 0.95
    card:
      kind: dateline
      big: '1671'
      small: Paris Observatory
- text: Cassini deduced that [Iapetus](/ˈIˈæpˈAtˈʌs/) was tidally locked, with one bright hemisphere and one dark hemisphere.
  emphasis:
  - tidally locked
  - dark hemisphere
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Global_View_of_Iapetus%27_Dichotomy.jpg/1920px-Global_View_of_Iapetus%27_Dichotomy.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Global View of Iapetus' Dichotomy.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Global_View_of_Iapetus%27_Dichotomy.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: 'Modern spacecraft proved him right: its trailing side gleams bright ice, while its leading face is coal-black.'
  emphasis:
  - bright ice
  - coal-black
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Iapetusnorth.jpg/1920px-Iapetusnorth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Iapetusnorth.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iapetusnorth.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Because [Iapetus](/ˈIˈæpˈAtˈʌs/) takes 79 days to rotate, thermal runaway strips ice into colder zones, leaving dark
    soot just one foot thick.
  emphasis:
  - 79 days
  - one foot thick
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Inky_stains_on_a_frozen_moon.jpg/960px-Inky_stains_on_a_frozen_moon.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Inky stains on a frozen moon.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Inky_stains_on_a_frozen_moon.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Then, in 2004, the Cassini probe revealed an equatorial mountain ridge towering 12 miles high.
  emphasis:
  - equatorial mountain ridge
  - 12 miles high
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Iapetus_mountains_Larger.jpg/960px-Iapetus_mountains_Larger.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Iapetus mountains Larger.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iapetus_mountains_Larger.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 12 MILES HIGH
      small: equatorial mountain ridge
- text: This colossal mountain wall and bulging waistline give the two-toned moon the bizarre shape of a walnut.
  emphasis:
  - bulging waistline
  - shape of a walnut
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/73/Iapetus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Iapetus.jpg
      credit: NASA / JPL-Caltech / Space Science Institute / Cassini Orbiter
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iapetus.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: How would you explain a world that goes completely invisible on one side of its orbit?
  emphasis:
  - completely invisible
  - one side
  visual:
    reuse: 1
    motion: zoom_in
