id: ep498
title: Why NASA Traded Two Planets for One Moon
series: Scale Breaker
format: v3
description: Voyager 1 sacrificed flybys of Uranus and Neptune to examine Saturn's moon Titan. The trajectory change launched
  Earth's most distant spacecraft into interstellar space.
