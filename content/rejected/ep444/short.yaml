id: ep444
title: Why the Apollo 11 Flag Looked Like It Was Waving
series: Space Myths, Busted
format: v3
description: NASA designed a horizontal rod to hold the Apollo flag extended, but vacuum physics kept the fabric swinging
  after astronauts planted it.
sources:
