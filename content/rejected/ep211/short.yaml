    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Deep inside the Sun's core, nuclear fusion converts hydrogen protons into helium, unleashing radiant energy alongside
    neutrinos.
  emphasis:
  - nuclear fusion
  - radiant energy
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Released_to_Public_Arist%27s_Concept_of_the_Layers_of_the_Sun_%28NASA%29_%28450837342%29.jpg/960px-Released_to_Public_Arist%27s_Concept_of_the_Layers_of_the_Sun_%28NASA%29_%28450837342%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Released to Public Arist's Concept of the Layers of the Sun (NASA) (450837342).jpg
      credit: pingnews.com
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Released_to_Public_Arist%27s_Concept_of_the_Layers_of_the_Sun_(NASA)_(450837342).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Because neutrinos interact extremely weakly with matter, they shoot through the dense interior and reach the surface
    in approximately two seconds.
  emphasis:
  - extremely weakly
  - two seconds
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 2
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Light energy faces an endless maze. Trapped in the crushing interior, that energy repeatedly scatters, absorbs, and
    re-emits.
  emphasis:
  - endless maze
  - scatters, absorbs, and re-emits
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: endless maze
      small: ''
    motion: zoom_in
- text: That sluggish journey traps the energy for thousands to hundreds of thousands of years before it finally escapes.
  emphasis:
  - sluggish journey
  - hundreds of thousands of years
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Photosphere.jpg/960px-Photosphere.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Photosphere.jpg
      credit: PetrusQ
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Photosphere.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: By detecting both signals, the [Borexino](/bˈOɹˈɛksˈinˈO/) experiment proved the Sun releases the same amount of energy
    today as it did 100,000 years ago.
  emphasis:
  - Borexino experiment
  - 100,000 years ago
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/5f/Laboratori_Nazionali_del_Gran_Sasso%2C_Borexino_detector.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Laboratori Nazionali del Gran Sasso, Borexino detector.png
      credit: Borexino Collaboration
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Laboratori_Nazionali_del_Gran_Sasso,_Borexino_detector.png
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: BOREXINO
      small: Gran Sasso, Italy
- text: While neutrinos deliver live updates from the core, the light warming your skin is an ancient relic.
  emphasis:
  - live updates
  - ancient relic
