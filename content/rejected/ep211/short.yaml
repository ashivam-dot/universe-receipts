id: ep211
title: The Sunlight Warming Your Face Is Prehistoric
series: Space Myths, Busted
description: While neutrinos flee the Sun's core in two seconds, radiant light takes tens of thousands of years to escape.
  The Borexino experiment proved our Sun's core produces the same energy today as it did during the Ice Age.
sources:
- https://en.wikipedia.org/wiki/Solar_neutrino
- http://math.ucr.edu/home/baez/physics/ParticleAndNuclear/solar_neutrino.html
- https://neutrinos.fnal.gov/sources/solar-neutrinos/
- https://www.spacedaily.com/t-sun-core-neutrinos-photon-energy-170000-years/
- https://en.wikipedia.org/wiki/Solar_neutrino_problem
- https://www.nature.com/articles/s41586-018-0624-y
hashtags:
- '#space'
- '#astronomy'
- '#physics'
tags:
- sun
- sunlight
- neutrinos
- borexino
- solar core
- fusion
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Sunlight and neutrinos born together escape the Sun thousands of years apart.
  emphasis:
  - born together
  - thousands of years apart
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/The_100_millionth_image_of_the_sun%2C_captured_by_an_instrument_on_Solar_Dynamics_Observatory_%28SDO%29%2C_NASA%2C_U.S.A.jpg/1920px-The_100_millionth_image_of_the_sun%2C_captured_by_an_instrument_on_Solar_Dynamics_Observatory_%28SDO%29%2C_NASA%2C_U.S.A.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
