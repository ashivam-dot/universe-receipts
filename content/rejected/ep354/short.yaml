    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Philae finally wedged itself sideways inside a freezing cliff shadow.
  emphasis:
  - wedged itself sideways
  - cliff shadow
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/PIA21565_-_Rosetta%27s_Moving_Cometary_Boulder.jpg/1920px-PIA21565_-_Rosetta%27s_Moving_Cometary_Boulder.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
