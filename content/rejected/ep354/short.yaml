- text: Both its anchoring harpoons and its downward thrusters failed.
  emphasis:
  - harpoons
  - failed
  pause_after: 0.4
  visual:
    reuse: 2
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Instead of grabbing the ice, the craft shot 1 kilometer high.
  emphasis:
  - 1 kilometer high
  sfx: pop
  visual:
    source: card
    card:
      kind: fact
      big: 1 KILOMETER
      small: rebound altitude
    motion: zoom_in
- text: It tumbled for two hours before hitting the comet a second time.
  emphasis:
  - tumbled
  - two hours
  sfx: riser
  visual:
    source: url
