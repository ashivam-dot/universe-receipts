    focus_x: 0.5
    focus_y: 0.5
- text: The lander Philae tried to stick humanity's first-ever comet landing.
  emphasis:
  - Philae
  - first-ever comet landing
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Rosetta_and_philae.jpg/1280px-Rosetta_and_philae.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
