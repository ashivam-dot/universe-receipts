id: ep231
title: The Moon Is Not Frozen in Space
series: Space Myths, Busted
description: The Moon isn't stationary; Earth's gravity braked its rotation until its day matched its orbital period.
sources:
- https://en.wikipedia.org/wiki/Tidal_locking
- https://scienceinsights.org/is-the-moon-tidally-locked-the-science-explained/
- https://www.earth-site.co.uk/Education/tidal-locking-moon-rotation/
- https://science.nasa.gov/moon/tidal-locking/
- http://www.universetoday.com/128350/will-earth-lock-moon/
- https://www.planetary.org/articles/1017-rapidly-rotating-regular-satellites-and-tides
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- tidal locking
- moon rotation
- gravity
- lunar orbit
- space myths
- astronomy facts
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The Moon is not frozen; it is actively spinning right now.
  emphasis:
  - actively spinning
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/A_VLT_Unit_Telescope_and_the_Moon_%28eso-paranal-15%29.jpg/3840px-A_VLT_Unit_Telescope_and_the_Moon_%28eso-paranal-15%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A VLT Unit Telescope and the Moon (eso-paranal-15).jpg
      credit: ESO/G.Hüdepohl (atacamaphoto.com)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:A_VLT_Unit_Telescope_and_the_Moon_(eso-paranal-15).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.76
    focus_y: 0.64
    box:
    - 0.61
    - 0.46
    - 0.91
    - 0.82
- text: Because we always see the same face, many people assume it never rotates.
  emphasis:
  - same face
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/NASA_Goddard_Photo_and_Video_-_First_Quarter_%28by%29.jpg/1920px-NASA_Goddard_Photo_and_Video_-_First_Quarter_%28by%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA Goddard Photo and Video - First Quarter (by).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:NASA_Goddard_Photo_and_Video_-_First_Quarter_(by).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But to hide its far side, the Moon rotates once every twenty-seven point three days.
  emphasis:
  - twenty-seven point three days
  sfx: whoosh
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Moon_apsidal_precession.png/1280px-Moon_apsidal_precession.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon apsidal precession.png
      credit: Rfassbind
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moon_apsidal_precession.png
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 27.3 days
      small: Rotation period
- text: Early in solar system history, it spun much faster before Earth's gravity grabbed hold.
  emphasis:
  - spun much faster
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c0/Giant_impact.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Giant impact.jpg
      credit: H.Seldon
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Giant_impact.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Tidal friction created massive rock bulges, slowing its spin over millions of years.
  emphasis:
  - rock bulges
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/cd/PSM_V74_D533_Bengal_bay_tide_affected_by_the_indian_ocean.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: PSM V74 D533 Bengal bay tide affected by the indian ocean.png
      credit: Unknown authorUnknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PSM_V74_D533_Bengal_bay_tide_affected_by_the_indian_ocean.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: That orbital brake is so powerful it even lengthens Earth's day by two milliseconds per century.
  emphasis:
  - two milliseconds
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/AS08-16-2593_remastered.jpg/3840px-AS08-16-2593_remastered.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: AS08-16-2593 remastered.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:AS08-16-2593_remastered.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 2 milliseconds
      small: Day lengthening
- text: Meanwhile, that transferred energy pushes the Moon roughly four centimeters further away each year.
  emphasis:
  - four centimeters
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Apollo_11_Lunar_Laser_Ranging_Experiment.jpg/1920px-Apollo_11_Lunar_Laser_Ranging_Experiment.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo 11 Lunar Laser Ranging Experiment.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Apollo_11_Lunar_Laser_Ranging_Experiment.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.45
    box:
    - 0.36
    - 0.32
    - 0.62
    - 0.5
    card:
      kind: fact
      big: 4 centimeters
      small: Annual recession
- text: Every large moon in our solar system is locked in this same gravitational dance.
  emphasis:
  - every large moon
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/68/Moons_of_the_Solar_System.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Moons of the Solar System.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moons_of_the_Solar_System.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: This gravitational deadlock permanently hides a world that never stops turning.
  emphasis:
  - never stops turning
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.76
    focus_y: 0.64
