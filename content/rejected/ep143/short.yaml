id: ep143
title: NASA smashed a copper bullet into a comet
series: Mission Files
description: NASA's Deep Impact mission intentionally smashed an 820-pound copper probe into a comet to see what was inside.
  The results changed our understanding of where life's ingredients come from.
sources:
- https://en.wikipedia.org/wiki/Deep_Impact_(spacecraft)
- https://svs.gsfc.nasa.gov/11892
- http://www.esa.int/esaCP/SEMCOZ1DU8E_index_0.html
