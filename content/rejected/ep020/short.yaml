id: ep020
title: The Galaxy with One Giant Arm
series: Space Got Weird
description: Deep in the constellation Aries, spiral galaxy NGC 772 defies cosmic symmetry. Its lopsided shape is the result
  of a violent gravitational tug-of-war.
