id: ep001
title: When Apollo 13 Lost Oxygen in Deep Space
series: Mission Files
description: On April eleventh, 1970, Apollo thirteen launched toward the Moon, commanded by Jim Lovell, with Fred Haise and
  Jack Swigert. Two days in, at two hundred thousand miles from Earth, an oxygen tank exploded.
