    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: It fired a particle jet at nearly light speed toward us.
  emphasis:
  - particle jet
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/ab/Black_hole_jet_diagram.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
