id: ep342
title: The Explosion That Warped Earth's Atmosphere
series: The Universe Is Terrifying
format: v3
description: In 2022, a gamma-ray burst from a collapsing star was so powerful it physically altered our atmosphere from two
  billion light-years away.
sources:
