id: ep074
title: How Dead Stars Can Spawn New Planets
series: Space Got Weird
description: Archival Hubble and TESS data show a dead white dwarf star stripping the atmosphere of a second-generation planet
  born from its own ruins.
sources:
- https://en.wikipedia.org/wiki/White_dwarf
- https://science.nasa.gov/missions/hubble/suspected-second-generation-planet-solves-nasa-hubble-cold-case/
- https://esahubble.org/news/heic2613/?lang
- https://www.cnn.com/2026/10/05/science/second-generation-planet-discovery-white-dwarf
- https://www.sciencenews.org/article/baby-planet-from-dead-star-phoenix
hashtags:
- '#space'
- '#whitedwarf'
- '#astronomy'
tags:
- white dwarf
- exoplanets
- hubble
- tess
- astronomy
- jamie williams
- space discovery
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Dead stars are supposed to destroy worlds, not build new ones.
  emphasis:
  - destroy worlds
  - build new ones
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Artist%E2%80%99s_impression_of_the_WDJ0914%2B1914_system.tif/lossy-page1-3840px-Artist%E2%80%99s_impression_of_the_WDJ0914%2B1914_system.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist’s impression of the WDJ0914+1914 system.tif
      credit: ESO/M. Kornmesser
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_the_WDJ0914%2B1914_system.tif
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Most astronomers believed a white dwarf, the dense remnant core of a star, was a planetary graveyard.
  emphasis:
  - planetary graveyard
  - dense remnant core
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Hubble_reveals_the_Ring_Nebula%E2%80%99s_true_shape.jpg/3840px-Hubble_reveals_the_Ring_Nebula%E2%80%99s_true_shape.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble reveals the Ring Nebula’s true shape.jpg
      credit: 'NASA, ESA, C.R. Robert O’Dell (Vanderbilt University), G.J. Ferland (University of Kentucky), W.J. Henney and
        M. Peimbert (National Autonomous University of Mexico)

        Credit for Large Binocular Telescop'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_reveals_the_Ring_Nebula%E2%80%99s_true_shape.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But in 1999, Hubble recorded one hundred mystery chemical signatures around the white dwarf HS 0209+0832.
  emphasis:
  - mystery chemical signatures
  - '1999'
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_%2827512134324%29.jpg/3840px-Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_%2827512134324%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble Space Telescope Grappled by Shuttle Arm (27512134324).jpg
      credit: NASA Hubble Space Telescope
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_(27512134324).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.4
    focus_y: 0.35
    card:
      kind: dateline
      big: '1999'
      small: White Dwarf HS 0209+0832
- text: Recently, University of Warwick researcher Jamie Williams reexamined the archival Hubble data with an updated database.
  emphasis:
  - Jamie Williams
  - archival Hubble data
  visual:
    source: url
    url: https://live.staticflickr.com/7222/7400981134_7d78735c90_b.jpg
    credit:
      source: Flickr via Openverse
      title: Warwick Digital Laboratory
      credit: Daniel I Scully
      license: CC BY 2.0
      url: https://www.flickr.com/photos/64192957@N04/7400981134
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: He found high levels of niobium, a heavy metal forged only during a star's violent death throes.
  emphasis:
  - niobium
  - death throes
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Element_Origins.jpg/960px-Element_Origins.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Element Origins.jpg
      credit: JENNIFER JOHNSON
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Element_Origins.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.28
    focus_y: 0.53
    card:
      kind: fact
      big: Niobium
      small: Heavy Element Detected
- text: NASA's TESS telescope then spotted a Jupiter-sized candidate planet orbiting this dead core every 4.4 days.
  emphasis:
  - Jupiter-sized
  - 4.4 days
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Transiting_Exoplanet_Survey_Satellite_artist_concept_%28transparent_background%29.png/960px-Transiting_Exoplanet_Survey_Satellite_artist_concept_%28transparent_background%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Transiting Exoplanet Survey Satellite artist concept (transparent background).png
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Transiting_Exoplanet_Survey_Satellite_artist_concept_(transparent_background).png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 4.4 Days
      small: Orbital Period
- text: Extreme radiation is stripping that candidate planet's atmosphere and raining the niobium back onto the star.
  emphasis:
  - stripping
  - raining
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/European_astronomers_observe_first_evaporating_planet_%28artist%27s_impression%29_%28heic0303b%29.tiff/lossless-page1-1920px-European_astronomers_observe_first_evaporating_planet_%28artist%27s_impression%29_%28heic0303b%29.tiff.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: European astronomers observe first evaporating planet (artist's impression) (heic0303b).tiff
      credit: European Space Agency, Alfred Vidal-Madjar (Institut d'Astrophysique de Paris, CNRS, France) and NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:European_astronomers_observe_first_evaporating_planet_(artist%27s_impression)_(heic0303b).tiff
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.35
    focus_y: 0.5
- text: This cosmic recycling reveals why we question if dead stars are only meant to destroy worlds.
  emphasis:
  - cosmic recycling
  - destroy worlds
