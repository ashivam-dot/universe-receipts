id: ep093
title: The Myth of the Moon's Dark Side
series: Space Myths, Busted
description: Discover how tidal locking synchronizes the Moon's rotation and why we didn't see the far side until 1959.
sources:
- https://en.wikipedia.org/wiki/Tidal_locking
- https://science.nasa.gov/moon/tidal-locking/
- https://www.astronomy.com/science/why-does-the-same-side-of-the-moon-always-face-earth/
- https://www.lunarprobe.com/guides/tidal-locking/
- http://www.universetoday.com/128350/will-earth-lock-moon/
- https://www.planetary.org/articles/1017-rapidly-rotating-regular-satellites-and-tides
hashtags:
- '#space'
- '#moon'
- '#luna3'
tags:
- Moon
- tidal locking
- astronomy
- Luna 3
- Soviet Union
- space myths
- planetary science
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Think the Moon doesn't spin? That is a total myth.
  emphasis:
  - doesn't spin
  - total myth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1920px-NASA-Apollo8-Dec24-Earthrise.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-Apollo8-Dec24-Earthrise.jpg
      credit: NASA/Bill Anders
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-Apollo8-Dec24-Earthrise.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Our Moon actually rotates on its axis at the exact same speed it orbits Earth.
  emphasis:
  - rotates
  - exact same speed
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Moon_phases_fr.jpg/1920px-Moon_phases_fr.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon phases fr.jpg
      credit: 'Original work : Orion 8


        French translation : Charlestpt'
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Moon_phases_fr.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.3
- text: This synchronous tidal locking is caused by Earth's gravity stretching the lunar body into physical bulges.
  emphasis:
  - tidal locking
  - physical bulges
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/71/Tidal_bulge.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Tidal bulge.png
      credit: Orion 8
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Tidal_bulge.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Gravity pulls on these bulges like a brake, forcing the spin to match the orbit.
  emphasis:
  - like a brake
  - match the orbit
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Naiad-Thalassa_73-69_orbital_resonance.jpg/960px-Naiad-Thalassa_73-69_orbital_resonance.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Naiad-Thalassa 73-69 orbital resonance.jpg
      credit: NASA / JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Naiad-Thalassa_73-69_orbital_resonance.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: This constant friction slows the rotation and pushes the Moon away by four centimeters every year.
  emphasis:
  - slows the rotation
  - four centimeters
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 4 centimeters
      small: annual lunar drift
    motion: zoom_in
- text: We finally saw the far side when the Soviet Luna 3 photographed it in 1959.
  emphasis:
  - Soviet Luna 3
  - '1959'
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/86/Luna-3_%28Memorial_Museum_of_Astronautics%29.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Luna-3 (Memorial Museum of Astronautics).JPG
      credit: Armael
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Luna-3_(Memorial_Museum_of_Astronautics).JPG
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1959'
      small: Luna 3 Mission
- text: Even Pluto and its moon Charon are mutually caught in this same gravitational grip.
  emphasis:
  - Pluto
  - Charon
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/23/Pluto-Charon-v2-10-1-15.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Pluto-Charon-v2-10-1-15.jpg
      credit: NASA / Johns Hopkins University Applied Physics Laboratory / Southwest Research Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Pluto-Charon-v2-10-1-15.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This synchronization hides the far side forever, which is why people still believe the Moon doesn't spin.
  emphasis:
  - hides the far side
  - doesn't spin
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: THE MOON ACTUALLY SPINS
