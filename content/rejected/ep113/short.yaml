id: ep113
title: The Asteroid Impact That Nearly Blasted Phobos Apart
series: The Universe Is Terrifying
description: Stickney crater spans nine kilometers across a moon only twenty-seven kilometers wide. Here is why the ancient
  cataclysm failed to destroy Phobos.
sources:
- https://en.wikipedia.org/wiki/Stickney_(crater)
