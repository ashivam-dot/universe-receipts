beats:
- text: A violent cosmic impact nearly blasted the Martian moon [Phobos](/fˈObˈOz/) into rubble.
  emphasis:
  - cosmic impact
  - into rubble
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/f4/Phobos_edit_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Phobos edit 2.jpg
      credit: NASA/JPL-Caltech/University of Arizona
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Phobos_edit_2.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Phobos is an irregular, potato-shaped moon measuring just twenty-seven kilometers across at its widest point.
  emphasis:
  - potato-shaped moon
  - twenty-seven kilometers
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/54/Phobos_Full.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Phobos Full.png
      credit: NASA / Viking 1 Orbiter
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Phobos_Full.png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 27 kilometers
      small: widest dimension of Phobos
- text: Carved deep into its fragile face is [Stickney](/stˈɪknˈi/) crater, measuring approximately nine kilometers in diameter.
  emphasis:
  - Stickney crater
  - nine kilometers
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Phobos_-_ESA_Mars_Express_%2854357869102%29.png/3840px-Phobos_-_ESA_Mars_Express_%2854357869102%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Phobos - ESA Mars Express (54357869102).png
      credit: Andrea Luck
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Phobos_-_ESA_Mars_Express_(54357869102).png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 9 kilometers
      small: Stickney crater diameter
- text: That single crater covers fully one-third of the tiny moon's entire width.
  emphasis:
  - one-third
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/f7/Stickney_PIA01333.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Stickney PIA01333.jpg
      credit: NASA/JPL/Malin Space Science Systems
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Stickney_PIA01333.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: An impact of that scale should have completely shattered Phobos into a cloud of debris.
  emphasis:
  - completely shattered
  - cloud of debris
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/11/Mariner09.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Mariner09.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Mariner09.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: The moon survived only because its interior is a porous, low-density rubble pile that cushioned the catastrophic shock
    like a sponge.
  emphasis:
  - rubble pile
  - like a sponge
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Stickney_mro.jpg/1280px-Stickney_mro.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Stickney mro.jpg
      credit: NASA/JPL-Caltech/University of Arizona
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Stickney_mro.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Rubble pile
      small: sponge-like interior porosity
- text: Under Phobos's weak gravity, simulations show boulders blasted from Stickney rolled entirely around the moon to carve
    vast surface grooves.
  emphasis:
  - rolled entirely around
  - vast surface grooves
  sfx: whoosh
  visual:
    reuse: 6
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Today, Mars is pulling Phobos inward, where tidal forces will finish destroying what survived the blast.
  emphasis:
  - pulling Phobos inward
  - finish destroying
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
