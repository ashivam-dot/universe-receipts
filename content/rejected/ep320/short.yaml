id: ep320
title: Why Stars Actually Twinkle
series: Space Myths, Busted
format: v3
description: Discover why stars appear to flicker and flash, and how Earth's turbulent atmosphere creates the illusion of
  stellar scintillation.
sources:
- https://www.scientificamerican.com/article.cfm?id=why-do-stars-twinkle
- https://biologyinsights.com/do-stars-blink-in-the-sky-the-science-of-twinkling/
- https://physicsoptics.com/blog/stars-twinkle/why-do-stars-twinkle-atmospheric-scintillation/
- https://en.wikipedia.org/wiki/Twinkling
- https://scienceprojectideasforkids.com/2010/stellar-scintillation-twinkling-stars/
- https://web.archive.org/web/20131004215902/http://www.isa.org/InTechTemplate.cfm?Section=Article_Index1&template=/ContentManagement/ContentDisplay.cfm&ContentID=44354
hashtags:
- '#space'
- '#astronomy'
- '#stars'
tags:
- scintillation
- stars
- atmosphere
- astronomy
- space myths
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
- text: Every star in the night sky is actually completely still.
  emphasis:
  - completely still
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Milky_way_in_Elbrus.jpg/1920px-Milky_way_in_Elbrus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Milky way in Elbrus.jpg
      credit: oliwok
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Milky_way_in_Elbrus.jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.3
- text: Out in space, their light travels as a perfectly steady stream.
  emphasis:
  - steady stream
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/10/View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_%2828223588012%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: View of Hubble after Being Released from the Shuttle Atlantis (28223588012).jpg
      credit: NASA Hubble Space Telescope
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_(28223588012).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: They don't flicker or flash until that light hits Earth.
  emphasis:
  - hits Earth
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/df/Full_moon_partially_obscured_by_atmosphere.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Full moon partially obscured by atmosphere.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Full_moon_partially_obscured_by_atmosphere.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Our atmosphere is a churning soup of turbulent air layers.
  emphasis:
  - turbulent air layers
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/ISS065-E-448458_-_View_of_Earth.jpg/3840px-ISS065-E-448458_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS065-E-448458 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS065-E-448458_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: These pockets act like moving lenses that bend the starlight.
  emphasis:
  - moving lenses
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Yepun%27s_Laser_Guide_Star_%28towardthezenith%29.jpg/1920px-Yepun%27s_Laser_Guide_Star_%28towardthezenith%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Yepun's Laser Guide Star (towardthezenith).jpg
      credit: ESO/F. Char
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Yepun%27s_Laser_Guide_Star_(towardthezenith).jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Planets don't twinkle because they are wide enough to average out.
  emphasis:
  - average out
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Full_disc_of_Jupiter_%28December_2023_to_March_2024%29_%28heic2412b%29.jpg/3840px-Full_disc_of_Jupiter_%28December_2023_to_March_2024%29_%28heic2412b%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Full disc of Jupiter (December 2023 to March 2024) (heic2412b).jpg
      credit: NASA, ESA, A. Simon (GSFC)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Full_disc_of_Jupiter_(December_2023_to_March_2024)_(heic2412b).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: That is why distant suns appear to dance in the night sky.
  emphasis:
  - appear to dance
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.3
look: bold
music:
  path: bed:chase
  gain_db: -17.0
  fade_out: 1.0
captions:
  hook_size: 150
hook_text: STARS DO NOT FLICKER IN SPACE
