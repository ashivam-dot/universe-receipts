id: ep296
title: The Giant Star That Blocked Its Own Light
series: The Universe Is Terrifying
format: v3
description: In 2019, the famous red supergiant Betelgeuse rapidly dimmed, leading many to believe a supernova was imminent.
  NASA's Hubble Space Telescope revealed the star had actually blown out a massive cloud of starlight-blocking dust.
