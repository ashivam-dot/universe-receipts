- https://orbitalradar.com/events/kosmos-1408-2021
- https://www.space.com/russia-asat-launch-test-space-debris-field
- https://www.independent.co.uk/space/chinese-satellite-russian-explosion-debris-b1997077.html
- https://www.nasa.gov/press-release/nasa-administrator-statement-on-russian-asat-test
hashtags:
- '#space'
- '#iss'
- '#nasa'
tags:
- Kosmos 1408
- anti-satellite missile
- space debris
- International Space Station
- NASA
- Roscosmos
