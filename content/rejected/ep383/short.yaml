id: ep383
title: The Missile Strike That Trapped Cosmonauts
series: Near Misses
format: v3
description: When an anti-satellite missile obliterated Kosmos 1408, it generated over 1,500 trackable fragments. The debris
  cloud forced the ISS crew into emergency escape pods.
