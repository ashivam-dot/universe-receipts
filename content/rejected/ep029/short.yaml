  voice: af_heart
  speed: 1.05
beats:
- text: The [whitest](/wʈɤtʈɤst/) world in our solar system is a giant snow machine.
  emphasis:
  - whitest world
  - snow machine
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/PIA17202_-_Approaching_Enceladus.jpg/960px-PIA17202_-_Approaching_Enceladus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA17202 - Approaching Enceladus.jpg
      credit: National Aeronautics and Space Administration (NASA) / Jet Propulsion Laboratory (JPL)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA17202_-_Approaching_Enceladus.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This moon, Enceladus, is just 500 kilometers across and reflects nearly all sunlight.
  emphasis:
  - 500 kilometers
  - nearly all sunlight
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Enceladus_Tiger_Stripes_Up_Close_PIA06247.jpg/960px-Enceladus_Tiger_Stripes_Up_Close_PIA06247.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Enceladus Tiger Stripes Up Close PIA06247.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Enceladus_Tiger_Stripes_Up_Close_PIA06247.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500 kilometers
      small: diameter
- text: In 2005, the Cassini spacecraft discovered massive geysers erupting from its south pole.
  emphasis:
  - massive geysers
  - '2005'
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/86/False_color_Cassini_image_of_jets_in_the_southern_hemisphere_of_Enceladus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: False color Cassini image of jets in the southern hemisphere of Enceladus.jpg
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:False_color_Cassini_image_of_jets_in_the_southern_hemisphere_of_Enceladus.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2005'
      small: Cassini mission
- text: These jets of water and organic molecules blast through warm fractures nicknamed tiger stripes.
  emphasis:
  - organic molecules
  - tiger stripes
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Jet_Spots_in_Tiger_Stripes_PIA10361.jpg/1920px-Jet_Spots_in_Tiger_Stripes_PIA10361.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Jet Spots in Tiger Stripes PIA10361.jpg
      credit: NASA/JPL/GSFC/SwRI/SSI
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Jet_Spots_in_Tiger_Stripes_PIA10361.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Tidal flexing from Saturn and the moon Dione melts a global ocean under the ice.
  emphasis:
  - Tidal flexing
  - global ocean
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Moons-_Active_Worlds.png/3840px-Moons-_Active_Worlds.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moons- Active Worlds.png
      credit: James Webb Space Telescope
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Moons-_Active_Worlds.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Most of the erupting water ice falls back to the surface as fresh snow.
  emphasis:
  - fresh snow
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Fictional_moon_system_4.png/1920px-Fictional_moon_system_4.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Fictional moon system 4.png
      credit: Merikanto
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Fictional_moon_system_4.png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: The rest escapes into orbit to supply most of the material in Saturn's E ring.
  emphasis:
  - Saturn's E ring
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/PIA08321_-_Ghostly_Fingers_of_Enceladus.tif/lossy-page1-960px-PIA08321_-_Ghostly_Fingers_of_Enceladus.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA08321 - Ghostly Fingers of Enceladus.tif
      credit: NASA/JPL/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA08321_-_Ghostly_Fingers_of_Enceladus.tif
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: E ring
      small: Saturn's ring
- text: This process continually recoats the moon in a fresh layer of blindingly white ice.
  emphasis:
  - recoats
  - white ice
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Color_hemisphere_maps_of_Enceladus_PIA18435_Nov._2014_full_size.jpg/3840px-Color_hemisphere_maps_of_Enceladus_PIA18435_Nov._2014_full_size.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Color hemisphere maps of Enceladus PIA18435 Nov. 2014 full size.jpg
      credit: NASA / JPL-Caltech / Space Science Institute / Lunar and Planetary Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Color_hemisphere_maps_of_Enceladus_PIA18435_Nov._2014_full_size.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: That is why the [whitest](/wʈɤtʈɤst/) world in the solar system is a giant snow machine.
  emphasis:
  - whitest world
  - snow machine
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
