    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg/3840px-ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-47 Earth Sunset From the International Space Station.jpg
      credit: NASA/Jeff Williams
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: For generations, children's drawings and even professional astronomers have classified our star as a yellow dwarf.
  emphasis:
  - yellow dwarf
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Vincent_van_Gogh_-_Olive_Trees_with_Yellow_Sky_and_Sun.jpg/960px-Vincent_van_Gogh_-_Olive_Trees_with_Yellow_Sky_and_Sun.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
