      title: Vincent van Gogh - Olive Trees with Yellow Sky and Sun.jpg
      credit: Vincent van Gogh
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Olive_Trees_with_Yellow_Sky_and_Sun.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Yellow Dwarf
      small: Historical classification
- text: But astronauts aboard the International Space Station observe a brilliant, blindingly white disk set against black
    space.
  emphasis:
  - blindingly white disk
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/AS14-66-9344_-_Apollo_14_-_Apollo_14_Mission_image_-_The_Apollo_Command_and_Service_Modules_%28CSM%29_are_photographed_against_a_black_sky_background_from_the_Lunar_Module_%28LM%29_above_the_Moon._-_NARA_-_16697786.jpg/3840px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
