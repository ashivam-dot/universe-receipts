      title: AS14-66-9344 - Apollo 14 - Apollo 14 Mission image - The Apollo Command and Service Modules (CSM) are photographed
        against a black sky background from the Lunar Module (LM) above the Moon. - NARA - 16697786.jpg
      credit: Unknown authorUnknown author or not provided
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:AS14-66-9344_-_Apollo_14_-_Apollo_14_Mission_image_-_The_Apollo_Command_and_Service_Modules_(CSM)_are_photographed_against_a_black_sky_background_from_the_Lunar_Module_(LM)_above_the_Moon._-_NARA_-_16697786.jpg
