    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Surprisingly, the Sun’s actual peak emission is in the green portion of the visible spectrum.
  emphasis:
  - green portion
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Celoria_-_Atlante_Astronomico%2C_1890_%28page_XXXVII_-_fig_2%29.jpg/1920px-Celoria_-_Atlante_Astronomico%2C_1890_%28page_XXXVII_-_fig_2%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Celoria - Atlante Astronomico, 1890 (page XXXVII - fig 2).jpg
      credit: Giovanni Celoria
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Celoria_-_Atlante_Astronomico,_1890_(page_XXXVII_-_fig_2).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500 nm
      small: Peak solar wavelength
- text: Human eyes perceive this broad mixture of wavelengths as white because it stimulates all our color receptors simultaneously.
  emphasis:
  - perceive
  - all our color receptors
  visual:
    source: url
    url: https://live.staticflickr.com/7397/9543521907_9dfa97de4d_b.jpg
    credit:
      source: Flickr via Openverse
      title: Untitled
      credit: Han Cheng Yeh
      license: CC BY 2.0
      url: https://www.flickr.com/photos/26719227@N00/9543521907
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This yellow star we see from Earth is actually an atmospheric illusion called Rayleigh scattering.
  emphasis:
  - atmospheric illusion
  - Rayleigh scattering
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Baron_Rayleigh%2C_PB00682.jpg/1280px-Baron_Rayleigh%2C_PB00682.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Baron Rayleigh, PB00682.jpg
      credit: Walker (artist) (graphic artist)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Baron_Rayleigh,_PB00682.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Rayleigh Scattering
      small: Atmospheric illusion
- text: Nitrogen and oxygen molecules deflect blue light away, leaving the remaining direct sunlight appearing yellow to our
    eyes.
  emphasis:
  - deflect blue light
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/ISS066-E-25494_-_View_of_Earth.jpg/3840px-ISS066-E-25494_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS066-E-25494 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS066-E-25494_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This stolen blue light paints our sky, while the leftover rays make us believe our white star is golden.
  emphasis:
  - stolen blue light
  - white star is golden
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: OUR WHITE SUN
