id: ep490
title: The Sun is the most perfect sphere in nature
series: Scale Breaker
format: v3
description: NASA satellite measurements revealed that the Sun holds a virtually unyielding round shape despite violent solar
  magnetic cycles. From core fusion to the outer heliosphere, its disk remains locked.
sources:
- https://en.wikipedia.org/wiki/Sun
- https://web.archive.org/web/20250711074917/https://www.science.org/doi/10.1126/science.1223231
- https://www.nature.com/articles/s41586-020-2934-0
- https://sci.esa.int/web/soho/-/36805-the-distortion-of-the-heliosphere
hashtags:
- '#space'
- '#sun'
- '#nasa'
tags:
- sun
- solar system
- nasa
- heliosphere
- fusion
- voyager
