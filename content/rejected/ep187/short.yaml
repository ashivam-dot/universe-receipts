    motion: pan_right
    focus_x: 0.43
    focus_y: 0.48
    box:
    - 0.27
    - 0.2
    - 0.58
    - 0.75
- text: Astronomers identified ten Jupiter-mass candidates in 2011 by measuring gravitational microlensing with telescopes
    in New Zealand and Chile.
  emphasis:
  - ten Jupiter-mass candidates
  - '2011'
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg/3840px-PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA21077 Brown Dwarf Microlensing Diagram.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg
    fallbacks:
