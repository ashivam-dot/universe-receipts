    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2011'
      small: Microlensing Discovery
- text: Whenever an unseen world glides past a distant star, its gravity warps space-time and briefly magnifies the background
    starlight.
  emphasis:
  - warps space-time
  - magnifies
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Microlensing_in_M22_%28heic0107f%29.tiff/lossy-page1-1920px-Microlensing_in_M22_%28heic0107f%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Microlensing in M22 (heic0107f).tiff
      credit: 'ESA & Hubble European Space Agency Information Centre (M. Kornmesser & L. L. Christensen). Background star
        map: ESA (Jos de Bruijne & Hubble European Space Agency Information Centre),'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Microlensing_in_M22_(heic0107f).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Recent research reveals that these lonely wanderers actually outnumber star-bound planets by roughly six to one.
  emphasis:
  - six to one
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Locations_of_the_rogue_planets.tif/lossy-page1-3840px-Locations_of_the_rogue_planets.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Locations of the rogue planets.tif
      credit: ESO/N. Risinger (skysurvey.org)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Locations_of_the_rogue_planets.tif
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Which is why across the vast galaxy,
  emphasis:
  - vast galaxy
