id: ep187
title: The Trillions of Starless Planets Drifting in the Dark
series: The Universe Is Terrifying
description: Billions of rogue planets wander the Milky Way in total darkness, and recent research suggests they outnumber
  star-bound worlds by six to one.
sources:
- https://en.wikipedia.org/wiki/Rogue_planet
- https://science.nasa.gov/mission/roman-space-telescope/rogue-planets/
- https://www.eso.org/public/news/eso2120/
- https://www.nature.com/articles/s41550-021-01513-x
- http://www.astronomy.com/news/2018/11/rogue-one-and-two
- https://www.space.com/11699-rogue-alien-planets-milky-common.html
- https://www.scientificamerican.com/article/rogue-rocky-planet-found-adrift-in-the-milky-way/
hashtags:
- '#space'
- '#astronomy'
- '#planets'
tags:
- rogue planets
- milky way
- free-floating planets
- microlensing
- space
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Billions of planets drift through total darkness without any star at all.
  emphasis:
  - total darkness
  - any star at all
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/92/Alone_in_Space_-_Astronomers_Find_New_Kind_of_Planet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Alone in Space - Astronomers Find New Kind of Planet.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Alone_in_Space_-_Astronomers_Find_New_Kind_of_Planet.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.45
    focus_y: 0.5
- text: Most people assume every planet in the universe belongs to a solar system, tethered to a shining sun.
  emphasis:
  - every planet
  - shining sun
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Solar_system_Painting.jpg/3840px-Solar_system_Painting.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Solar system Painting.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Solar_system_Painting.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.55
    focus_y: 0.5
- text: In reality, vast populations of nomadic rogue planets wander through interstellar space in absolute, freezing darkness.
  emphasis:
  - rogue planets
  - freezing darkness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Artist%E2%80%99s_impression_of_a_rogue_planet_in_Rho_Ophiuchi_%28eso2120a%29.jpg/3840px-Artist%E2%80%99s_impression_of_a_rogue_planet_in_Rho_Ophiuchi_%28eso2120a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist’s impression of a rogue planet in Rho Ophiuchi (eso2120a).jpg
      credit: ESO/M. Kornmesser/S. Guisard (www.eso.org/~sguisard)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_a_rogue_planet_in_Rho_Ophiuchi_(eso2120a).jpg
