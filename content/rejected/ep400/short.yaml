id: ep400
title: Why Most of the Universe Is Invisible
series: Scale Breaker
format: v3
description: Space feels empty, but invisible dark matter and dark energy shape the cosmos. Everything we can see makes up
  just 5% of reality.
sources:
- https://en.wikipedia.org/wiki/Outer_space
- https://science.nasa.gov/astrophysics/focus-areas/what-is-dark-energy/
hashtags:
- '#space'
- '#darkmatter'
- '#astronomy'
tags:
- dark matter
- dark energy
- cosmos
- universe
- astrophysics
- Scale Breaker
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
- text: Ninety-five percent of the entire universe is completely invisible.
  emphasis:
  - completely invisible
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Large_scale_structure_of_dark_matter.tif/lossy-page1-500px-Large_scale_structure_of_dark_matter.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Large scale structure of dark matter.tif
      credit: NASA, ESA, and R. Massey (California Institute of Technology)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Large_scale_structure_of_dark_matter.tif
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Most people picture outer space as a vast, empty vacuum.
  emphasis:
  - empty vacuum
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c1/Large-scale_structures_%28eso0804a%29.tiff/lossy-page1-1280px-Large-scale_structures_%28eso0804a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Large-scale structures (eso0804a).tiff
      credit: Klaus Dolag and equipment VIMOS-VLT Deep Survey
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Large-scale_structures_(eso0804a).tiff
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: In reality, it is packed with dark matter and dark energy.
  emphasis:
  - dark matter
  - dark energy
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Hubble_image_of_the_galaxy_cluster_Abell_3827.jpg/3840px-Hubble_image_of_the_galaxy_cluster_Abell_3827.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble image of the galaxy cluster Abell 3827.jpg
      credit: ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Hubble_image_of_the_galaxy_cluster_Abell_3827.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.58
    focus_y: 0.52
    box:
    - 0.42
    - 0.38
    - 0.74
    - 0.66
- text: Dark matter acts like invisible glue, holding massive galaxies together.
  emphasis:
  - invisible glue
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Bullet_Cluster_%28Webb_and_Chandra_Compass_Image%29_%282025-128%29.png/3840px-Bullet_Cluster_%28Webb_and_Chandra_Compass_Image%29_%282025-128%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Bullet Cluster (Webb and Chandra Compass Image) (2025-128).png
      credit: 'Image: NASA, ESA, CSA, STScI, CXC Science James Jee (Yonsei University, UC Davis), Sangjun Cha (Yonsei University),
        Kyle Finner (Caltech/IPAC)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Bullet_Cluster_(Webb_and_Chandra_Compass_Image)_(2025-128).png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: At the same time, dark energy accelerates the cosmos apart.
  emphasis:
  - accelerates
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/CMB_universe_expansion.png/1920px-CMB_universe_expansion.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: CMB universe expansion.png
      credit: NASA/WMAP Science Team/ Art by Dana Berry
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_universe_expansion.png
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: That invisible 95% actively controls how our cosmos evolves.
  emphasis:
  - actively controls
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/Three-dimensional_distribution_of_dark_matter_in_the_Universe_%28artist%27s_impression%29_%28heic0701a%29.tiff/lossy-page1-1920px-Three-dimensional_distribution_of_dark_matter_in_the_Universe_%28artist%27s_impression%29_%28heic0701a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Three-dimensional distribution of dark matter in the Universe (artist's impression) (heic0701a).tiff
      credit: NASA, ESA and R. Massey (California Institute of Technology)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Three-dimensional_distribution_of_dark_matter_in_the_Universe_(artist%27s_impression)_(heic0701a).tiff
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 95%
      small: controls cosmic evolution
- text: All we can see is a tiny fragment of reality.
  emphasis:
  - tiny fragment
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/53/Deployment_of_the_Hubble_Space_Telescope_%2828248653761%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
