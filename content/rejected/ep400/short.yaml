      title: Deployment of the Hubble Space Telescope (28248653761).jpg
      credit: NASA Hubble Space Telescope
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Deployment_of_the_Hubble_Space_Telescope_(28248653761).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.55
    box:
    - 0.32
    - 0.38
    - 0.66
    - 0.76
- text: Every star, planet, and moon makes up only 5%.
  emphasis:
  - only 5%
