- text: In 2004, astronomers tracking the Kuiper Belt noticed a distant point of light flashing wildly.
  emphasis:
  - Kuiper Belt
  - flashing wildly
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: '2004'
      small: Kuiper Belt Discovery
    motion: zoom_in
- text: That rapidly flickering brightness revealed a dwarf planet completing a full rotation every 3.9 hours.
  emphasis:
  - flickering brightness
  - 3.9 hours
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/MPMusLightCurve.png/1280px-MPMusLightCurve.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
