id: ep239
title: The Dwarf Planet Shaped Like an Egg
series: Space Got Weird
format: v2
description: Deep in the Kuiper Belt, dwarf planet Haumea spins so fast that centrifugal force stretched it into an egg shape
  with its own ring system.
sources:
- https://en.wikipedia.org/wiki/Haumea
- https://science.nasa.gov/dwarf-planets/haumea/
