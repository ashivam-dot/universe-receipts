      license: CC0
      url: https://commons.wikimedia.org/wiki/File:MPMusLightCurve.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 3.9 HOURS
      small: Full Rotation Time
- text: Massive centrifugal force from the fastest spin in the solar system stretched its rocky body completely out of round.
