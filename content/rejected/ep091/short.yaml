id: ep091
title: The Invisible Particle With the Energy of a Baseball
series: The Universe Is Terrifying
description: The Oh-My-God particle hit Earth in 1991 with 47 million times the energy of our best accelerators, yet its source
  remains a complete mystery.
sources:
- https://en.wikipedia.org/wiki/Oh-My-God_particle
- https://web.archive.org/web/20190630191829/https://phys.org/news/2011-06-oh-my-god-particles.html
- https://www.sciencenews.org/article/rare-energetic-cosmic-ray-mysterious-origins
- https://www.scientificamerican.com/article/where-did-the-oh-my-god-particle-come-from/
- https://www.theguardian.com/science/2023/nov/24/amaterasu-extremely-high-energy-particle-detected-falling-to-earth
- https://www.spacedaily.com/t-in-1991-a-single-subatomic-particle-struck-earth-carrying-the-kinetic-energy-of-a-fast-bowled-cricket-ball-tens-of-millions-of-times-more-than-any-human-accelerator-can-give-one-proton/
- https://www.quantamagazine.org/the-particle-that-broke-a-cosmic-speed-limit-20150514/
