id: ep038
title: Why the Universe is Too Big
series: Scale Breaker
description: See why cosmic expansion makes our 13.8-billion-year-old universe span 93 billion light-years across.
sources:
- https://en.wikipedia.org/wiki/Observable_universe
- https://www.space.com/25303-how-many-galaxies-are-in-the-universe.html
- https://www.livescience.com/how-many-atoms-in-universe.html
- https://www.spacedaily.com/t-universe-13-8-billion-years-93-billion-light-years-46-5/
- https://newspaceeconomy.ca/2026/09/14/how-can-the-observable-universe-be-93-billion-light-years-wide-if-it-is-only-13-8-billion-years-old/
hashtags:
- '#space'
- '#astronomy'
- '#cosmology'
tags:
- observable universe
- cosmic expansion
- big bang
- light speed
- cosmology
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A 13.8-billion-year-old universe should not be 93 billion light-years wide.
  emphasis:
  - 93 billion
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Dark_Flow_%284423361836%29.jpg/960px-Dark_Flow_%284423361836%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Dark Flow (4423361836).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Dark_Flow_(4423361836).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.45
    card:
      kind: fact
      big: 93 Billion
      small: Light-years wide
- text: We expect the visible cosmos to reach at most 13.8 billion light-years in any direction.
  emphasis:
  - 13.8 billion
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/6f/CMB_Timeline300_no_WMAP.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: CMB Timeline300 no WMAP.jpg
      credit: NASA/WMAP Science Team
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_Timeline300_no_WMAP.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: In a static universe, light traveling since the beginning would span only 27.6 billion light-years.
  emphasis:
  - 27.6 billion
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/ce/The_expanding_Universe_%28opo0109e%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: The expanding Universe (opo0109e).jpg
      credit: Ann Feild (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_expanding_Universe_(opo0109e).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 27.6 Billion
      small: Static cosmic span
- text: Instead, the observable universe is a sphere roughly 93 billion light-years wide.
  emphasis:
  - roughly 93 billion
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg/1920px-NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg
      credit: NASA, ESA, H. Teplitz and M. Rafelski (IPAC/Caltech), A. Koekemoer (STScI), R. Windhorst (Arizona State University),
        and Z. Levay (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: This massive scale is possible because space itself expanded while light was in flight.
  emphasis:
  - space itself expanded
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Animation_Stills-_Effects_of_Dark_Energy_%282004-darkenergy-more-12_-_accel_expanding_univ_still_8%29.tiff/lossy-page1-500px-Animation_Stills-_Effects_of_Dark_Energy_%282004-darkenergy-more-12_-_accel_expanding_univ_still_8%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Animation Stills- Effects of Dark Energy (2004-darkenergy-more-12 - accel expanding univ still 8).tiff
      credit: '(Credit: NASA/STScI/G. Bacon)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Animation_Stills-_Effects_of_Dark_Energy_(2004-darkenergy-more-12_-_accel_expanding_univ_still_8).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Distant regions can even recede from us faster than the speed of light.
  emphasis:
  - faster than
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9e/Redshifted_Light_From_Distant_Galaxies_%284195-Image%29.png/1920px-Redshifted_Light_From_Distant_Galaxies_%284195-Image%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Redshifted Light From Distant Galaxies (4195-Image).png
      credit: and A. Feild ()
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Redshifted_Light_From_Distant_Galaxies_(4195-Image).png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.6
    focus_y: 0.5
- text: The matter that emitted the oldest visible light was about 40 million light-years away when it shone.
  emphasis:
  - 40 million
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Oldest_Light_in_the_Universe_%28SVS30133%29.jpg/3840px-Oldest_Light_in_the_Universe_%28SVS30133%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Oldest Light in the Universe (SVS30133).jpg
      credit: NASA's Scientific Visualization Studio - Marit Jentoft-Nilsen, Global Science and Technology, Inc./Mark Malanoski
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Oldest_Light_in_the_Universe_(SVS30133).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 40 Million
      small: Light-years at emission
- text: Expansion has since dragged that matter 46.5 billion light-years from Earth.
  emphasis:
  - 46.5 billion
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/WMAP_2010.png/3840px-WMAP_2010.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: WMAP 2010.png
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:WMAP_2010.png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 46.5 Billion
      small: Current radius
- text: This expansion explains why a 13.8-billion-year-old universe should not be 93 billion light-years wide.
  emphasis:
  - expansion
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.45
