beats:
- text: Decades of data prove the full moon does not trigger human madness.
  emphasis:
  - human madness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Full_moon_by_Ram_Samudrala.jpg/1920px-Full_moon_by_Ram_Samudrala.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Full moon by Ram Samudrala.jpg
      credit: Ram samudrala
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Full_moon_by_Ram_Samudrala.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Police officers and medical staff often blame lunar phases for sudden spikes in emergency room chaos.
  emphasis:
  - emergency room chaos
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/MarkhamStouffvilleHospital23.jpg/3840px-MarkhamStouffvilleHospital23.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: MarkhamStouffvilleHospital23.jpg
      credit: Raysonho @ Open Grid Scheduler / Grid Engine
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:MarkhamStouffvilleHospital23.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.45
    focus_y: 0.25
    box:
    - 0.08
    - 0.07
    - 0.82
    - 0.38
- text: Yet meta-analyses of over one hundred studies show zero correlation between the moon and human behavior.
  emphasis:
  - one hundred studies
  - zero correlation
  visual:
    source: card
    card:
      kind: fact
      big: 100 species
      small: Studies analyzed
    motion: zoom_in
- text: Statistical data shows no link to homicide rates, hospital admissions, or human birth rates.
  emphasis:
  - no link
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Car_crash_leaves_5_dead%2C_June_17%2C_2023_%2852982337859%29.jpg/3840px-Car_crash_leaves_5_dead%2C_June_17%2C_2023_%2852982337859%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Car crash leaves 5 dead, June 17, 2023 (52982337859).jpg
      credit: Chad Davis from Minneapolis, United States
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Car_crash_leaves_5_dead,_June_17,_2023_(52982337859).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.45
    focus_y: 0.45
- text: The average twenty-eight day human cycle is actually a mathematical mismatch for the twenty-nine point five day lunar
    month.
  emphasis:
  - mathematical mismatch
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d5/Hormones_in_menstrual_cycle.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Hormones in menstrual cycle.png
      credit: Mikael Häggström
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hormones_in_menstrual_cycle.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 29.5 days
      small: Lunar cycle length
- text: Lunar gravity is far too weak to affect human biology.
  emphasis:
  - far too weak
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Morocco_-_Essaouira_Part_2_%2831680297025%29.jpg/1920px-Morocco_-_Essaouira_Part_2_%2831680297025%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Morocco - Essaouira Part 2 (31680297025).jpg
      credit: Visions of Domino
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Morocco_-_Essaouira_Part_2_(31680297025).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.65
    focus_y: 0.5
- text: High tides happen during full moons because the Sun, Earth, and Moon align in space.
  emphasis:
  - align in space
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Earth_From_the_Perspective_of_Artemis_II.jpg/3840px-Earth_From_the_Perspective_of_Artemis_II.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Earth From the Perspective of Artemis II.jpg
      credit: Reid Wiseman/NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Earth_From_the_Perspective_of_Artemis_II.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Certain marine species like coral really do sync their spawning cycles with moonlight.
  emphasis:
  - sync their spawning
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Coral_polyps_out_at_night_at_Fanous_East_Reef%2C_Red_Sea%2C_Egypt_-SCUBA_-UNDERWATER_-PICTURES_%286522133421%29.jpg/960px-Coral_polyps_out_at_night_at_Fanous_East_Reef%2C_Red_Sea%2C_Egypt_-SCUBA_-UNDERWATER_-PICTURES_%286522133421%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Coral polyps out at night at Fanous East Reef, Red Sea, Egypt -SCUBA -UNDERWATER -PICTURES (6522133421).jpg
      credit: Derek Keats from Johannesburg, South Africa
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Coral_polyps_out_at_night_at_Fanous_East_Reef,_Red_Sea,_Egypt_-SCUBA_-UNDERWATER_-PICTURES_(6522133421).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: While moonlight syncs coral and pulls tides, for human chaos...
  emphasis:
  - human chaos
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: ZERO LUNAR EVIDENCE
