id: ep238
title: The Full Moon Myth Busted
series: Space Myths, Busted
format: v2
description: Decades of data prove the full moon has no effect on human behavior, crime, or emergency room visits.
sources:
- https://en.wikipedia.org/wiki/Lunar_effect
- http://www.skepdic.com/fullmoon.html
hashtags:
- '#space'
- '#spaceib'
- '#moon'
tags:
- lunar effect
- full moon myth
- space science
- astronomy
- moon facts
- myth busted
