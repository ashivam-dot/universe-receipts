        Rhemann and M. Jager'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Provides_Spectacular_Detail_of_a_Comet%27s_Breakup_(2006-18-1902).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.48
    focus_y: 0.48
- text: This broken traveler will now spend hundreds of thousands of years drifting through the darkness of deep space.
  emphasis:
  - hundreds of thousands
  - darkness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Rubin_Oort_Cloud_and_Kuiper_Belt_Illustration_%28rubin-Oort-Cloud-and-Kuiper-Belt%29.tiff/lossy-page1-960px-Rubin_Oort_Cloud_and_Kuiper_Belt_Illustration_%28rubin-Oort-Cloud-and-Kuiper-Belt%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
