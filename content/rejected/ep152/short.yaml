    focus_x: 0.8
    focus_y: 0.8
- text: On August tenth, 1975, astronomer Richard M. West discovered the icy visitor plunging toward the Sun.
  emphasis:
  - Richard M. West
  - plunging
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/The_ESO_1-metre_Schmidt_telescope_%28lasilla-construction%29.jpg/3840px-The_ESO_1-metre_Schmidt_telescope_%28lasilla-construction%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
