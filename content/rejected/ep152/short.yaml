- text: In February 1976, the comet reached perihelion, racing within thirty million kilometers of the solar surface.
  emphasis:
  - thirty million kilometers
  - perihelion
  visual:
    source: card
    card:
      kind: fact
      big: 30 million km
      small: Distance to Sun
    motion: zoom_in
- text: Solar heat and forward scattering pushed its brightness to magnitude minus three, making it as bright as Venus.
  emphasis:
  - minus three
  - Venus
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/C-west-mar1976-ps.jpg/1920px-C-west-mar1976-ps.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: C-west-mar1976-ps.jpg
      credit: P. Stättmayer/ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:C-west-mar1976-ps.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.84
    card:
      kind: fact
      big: Magnitude -3
      small: Brightness of Venus
- text: From February twenty-fifth to the twenty-seventh, observers tracked the dazzling object in the middle of the day.
  emphasis:
  - middle of the day
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Comet_West_1975n.jpg/1280px-Comet_West_1975n.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Comet West 1975n.jpg
      credit: coniferconifer
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Comet_West_1975n.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.68
    focus_y: 0.83
- text: But the sun's gravity was a hammer, shattering the comet's nucleus into four distinct, glowing fragments.
  emphasis:
  - shattering
  - four distinct
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/Hubble_Provides_Spectacular_Detail_of_a_Comet%27s_Breakup_%282006-18-1902%29.jpg/1920px-Hubble_Provides_Spectacular_Detail_of_a_Comet%27s_Breakup_%282006-18-1902%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
