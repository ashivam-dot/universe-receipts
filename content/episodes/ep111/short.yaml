      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:SDSS2020.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: In 2021, student Alexia Lopez was mapping distant light in the constellation Boötes.
  emphasis:
  - Alexia Lopez
  - Boötes
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Bo%C3%B6tes_%28boo%29.tif/lossy-page1-1920px-Bo%C3%B6tes_%28boo%29.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Boötes (boo).tif
      credit: IAU and Sky & Telescope
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Bo%C3%B6tes_(boo).tif
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    box:
    - 0.35
    - 0.18
    - 0.68
    - 0.78
    card:
      kind: dateline
      big: '2021'
      small: Boötes
- text: She used the light from ultra-bright quasars like giant flashlights to map out hidden matter in deep space.
  emphasis:
  - quasars
  - giant flashlights
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Artist%27s_rendering_ULAS_J1120%2B0641.jpg/3840px-Artist%27s_rendering_ULAS_J1120%2B0641.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist's rendering ULAS J1120+0641.jpg
      credit: ESO/M. Kornmesser
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%27s_rendering_ULAS_J1120%2B0641.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Using the Sloan Digital Sky Survey, Lopez found a colossal crescent of galaxies stretching 3.3 billion light-years
    across.
  emphasis:
  - 3.3 billion
  - crescent
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 3.3 Billion LY
      small: The Giant Arc
    motion: zoom_in
- text: This Giant Arc is so massive it spans one-fifteenth the radius of the entire observable universe.
  emphasis:
  - one-fifteenth
  - observable universe
  visual:
    source: card
    card:
      kind: fact
      big: 1/15th
      small: Observable Universe
    motion: zoom_in
- text: Standard cosmology says gravity cannot form structures larger than 1.2 billion light-years.
  emphasis:
  - gravity cannot
  - 1.2 billion
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/38/Full_sky_maps_of_the_thermal_Sunyaev%E2%80%93Zel%27dovich_effect_as_quantified_by_the_Compton_y_parameter_%28equation_8%29_for_different_redshift_intervals.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Full sky maps of the thermal Sunyaev–Zel'dovich effect as quantified by the Compton y parameter (equation 8)
        for different redshift intervals.jpg
      credit: 'Authors of the study: Schaye, Joop ; Kugel, Roi ; Schaller, Matthieu ; Helly, John C. ; Braspenning, Joey ;
        Elbers, Willem ; McCarthy, Ian G. ; van Daalen, Marcel P. ; Vandenbroucke, Bert ; Frenk, Car'
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Full_sky_maps_of_the_thermal_Sunyaev%E2%80%93Zel%27dovich_effect_as_quantified_by_the_Compton_y_parameter_(equation_8)_for_different_redshift_intervals.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1.2 Billion LY
      small: Theoretical Limit
- text: There simply hasn't been enough time since the Big Bang for something this big to clump together.
  emphasis:
  - Big Bang
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/6f/CMB_Timeline300_no_WMAP.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: CMB Timeline300 no WMAP.jpg
      credit: NASA/WMAP Science Team
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_Timeline300_no_WMAP.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This gargantuan structure suggests that our basic understanding of the universe is actually broken.
  emphasis:
  - actually broken
  - basic understanding
  sfx: whoosh
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
