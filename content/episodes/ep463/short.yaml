    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Schwarzschild.radius.redshift.png/1280px-Schwarzschild.radius.redshift.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
