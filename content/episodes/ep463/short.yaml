id: ep463
title: Why You Wouldn't Feel a Black Hole's Edge
series: Space Myths, Busted
format: v3
description: You might expect to be crushed at the edge of a black hole, but for a giant one, the crossing is surprisingly
  calm.
sources:
- https://en.wikipedia.org/wiki/Event_horizon
- https://en.wikipedia.org/wiki/Black_hole
- https://www.scientificamerican.com/article/the-reluctant-father-of-black-holes-2007-04/
- https://science.nasa.gov/universe/black-holes/anatomy/
- https://www.nature.com/articles/s42254-021-00364-9
hashtags:
- '#space'
- '#blackhole'
- '#physics'
tags:
- black hole
- event horizon
- general relativity
- physics
- science
- space
- einstein
- astronomy
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
