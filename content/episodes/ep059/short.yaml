    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90%
      small: Gravity at ISS altitude
- text: Normal gravity on Earth's surface pulls at approximately nine point eight meters per second squared.
  emphasis:
  - nine point eight
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 9.8 m/s²
      small: Earth surface gravity
    motion: zoom_in
- text: In orbit, gravity is still highly active, but spacecraft are in constant free fall.
  emphasis:
  - constant free fall
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Astronaut_Nichole_Ayers_poses_for_a_portrait_inside_the_seven_window_cupola_%28iss072e978930%29.jpg/1920px-Astronaut_Nichole_Ayers_poses_for_a_portrait_inside_the_seven_window_cupola_%28iss072e978930%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
