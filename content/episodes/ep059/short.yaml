- text: At the altitude of the space station, Earth's gravity is nearly ninety percent as strong as on the ground.
  emphasis:
  - nearly ninety percent
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Earth_vs_Mars_gravity_at_elevation.webp/1280px-Earth_vs_Mars_gravity_at_elevation.webp?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
