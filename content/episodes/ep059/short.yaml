id: ep059
title: Why Astronauts Never Escape Earth's Gravity
series: Space Myths, Busted
description: Think astronauts in orbit are completely weightless? Discover why Earth's gravity is actually nearly 90 percent
  as strong on the space station.
sources:
- https://en.wikipedia.org/wiki/Gravity_of_Earth
- https://www.nasa.gov/centers-and-facilities/glenn/what-is-microgravity/
- https://www.space.com/23017-weightlessness.html
- https://en.wikipedia.org/wiki/Weightlessness
hashtags:
- '#space'
- '#iss'
- '#gravity'
tags:
- gravity
- space station
- orbit
- space science
- astronauts
- free fall
voice:
  voice: af_heart
  speed: 1.05
beats:
