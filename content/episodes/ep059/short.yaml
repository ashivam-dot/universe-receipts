- text: This sickness occurs even though space is actually not a gravity-free vacuum.
  emphasis:
  - not a gravity-free vacuum
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Solar_sys.jpg/1280px-Solar_sys.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
