id: ep059
title: Gravity in Space Is Stronger Than You Think
series: Space Myths, Busted
description: Discover why astronauts float in orbit even though Earth's gravity is still nearly 90 percent as strong at the
  space station.
sources:
- https://en.wikipedia.org/wiki/Gravity_of_Earth
- https://www.nasa.gov/centers-and-facilities/glenn/what-is-microgravity/
- https://en.wikipedia.org/wiki/Weightlessness
- https://www.space.com/23017-weightlessness.html
hashtags:
- '#space'
- '#nasa'
- '#iss'
tags:
- gravity
- astronauts
- international space station
- orbit
- physics
- microgravity
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Astronauts floating in orbit are actually not beyond Earth's gravity.
  emphasis:
  - not beyond Earth's gravity
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/STS-134_International_Space_Station_after_undocking.jpg/3840px-STS-134_International_Space_Station_after_undocking.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: STS-134 International Space Station after undocking.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS-134_International_Space_Station_after_undocking.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: While many believe space is a complete zero gravity vacuum, the everyday reality is quite different.
  emphasis:
  - zero gravity vacuum
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/A_Horseshoe_Einstein_Ring_from_Hubble.JPG/960px-A_Horseshoe_Einstein_Ring_from_Hubble.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A Horseshoe Einstein Ring from Hubble.JPG
      credit: 'Lensshoe_hubble.jpg: ESA/Hubble & NASA

        derivative work: Bulwersator (talk)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:A_Horseshoe_Einstein_Ring_from_Hubble.JPG
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: At the soaring altitude of the space station, Earth's gravitational field is still nearly 90 percent as strong as
    on the ground.
  emphasis:
  - nearly 90 percent
  - as strong
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 90 percent
      small: Gravity at station altitude
    motion: zoom_in
- text: Human space travellers do not float because gravity has vanished entirely from their location.
  emphasis:
  - gravity has vanished
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/NASA_astronaut_Nichole_Ayers_conducts_research_operations_inside_the_Life_Science_Glovebox_%28iss073e0118821%29.jpg/3840px-NASA_astronaut_Nichole_Ayers_conducts_research_operations_inside_the_Life_Science_Glovebox_%28iss073e0118821%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA astronaut Nichole Ayers conducts research operations inside the Life Science Glovebox (iss073e0118821).jpg
      credit: NASA Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA_astronaut_Nichole_Ayers_conducts_research_operations_inside_the_Life_Science_Glovebox_(iss073e0118821).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Instead, they stay up because they are caught in a continuous state of perpetual free fall.
  emphasis:
  - perpetual free fall
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Newton%27s_cannonball_cropped.png/1920px-Newton%27s_cannonball_cropped.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Newton's cannonball cropped.png
      credit: Isaac Newton
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Newton%27s_cannonball_cropped.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Their immense horizontal speed continually carries them around the curving horizon of our home planet.
  emphasis:
  - immense horizontal speed
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Lucy_Earth_Gravity_Assist_2_Trajectory_Visualizations_%28SVS5429_-_lucy_ega2_pov-full_02400_print%29.jpg/960px-Lucy_Earth_Gravity_Assist_2_Trajectory_Visualizations_%28SVS5429_-_lucy_ega2_pov-full_02400_print%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Lucy Earth Gravity Assist 2 Trajectory Visualizations (SVS5429 - lucy ega2 pov-full 02400 print).jpg
      credit: NASA's Scientific Visualization Studio - USRA/Kel Elkins, KBR Wyle Services, LLC/Dan Gallagher, SwRI/Katherine
        Kretke
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Lucy_Earth_Gravity_Assist_2_Trajectory_Visualizations_(SVS5429_-_lucy_ega2_pov-full_02400_print).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: That precise physics mechanism is why astronauts floating in orbit are actually not beyond Earth's gravity.
  emphasis:
  - not beyond Earth's gravity
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: 90 PERCENT GRAVITY IN ORBIT
