- https://www.armscontrol.org/factsheets/outer-space-treaty-glance
- https://legal.un.org/avl/ha/tos/tos.html
- https://orbitalradar.com/regulatory/outer-space-treaty
hashtags:
- '#space'
- '#spacetreaty'
- '#coldwar'
tags:
- Outer Space Treaty
- Cold War
- Moon ownership
- space law
- nuclear weapons
- NASA history
