id: ep033
title: The Cold War Treaty That Banned Nuclear Weapons in Space
series: Space Got Weird
description: Discover the 1967 Outer Space Treaty that banned nuclear weapons in orbit and kept the Moon free of sovereign
  claims.
sources:
- https://en.wikipedia.org/wiki/Outer_Space_Treaty
- https://www.nasa.gov/history/SP-4225/documentation/cooperation/treaty.htm
- https://www.theguardian.com/business/2016/feb/06/asteroid-mining-space-minerals-legal-issues
