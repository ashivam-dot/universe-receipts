- text: During the height of the Cold War, the United States and the Soviet Union faced a dangerous new frontier.
  emphasis:
  - dangerous new frontier
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/87/Atlas-B_ICBM.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Atlas-B ICBM.jpg
      credit: USAF
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Atlas-B_ICBM.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.35
- text: In 1967, rivals signed this treaty across three global capitals to prevent the space race from turning nuclear.
  emphasis:
  - three global capitals
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Signing_Outer_Space_Treaty.jpg/960px-Signing_Outer_Space_Treaty.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Signing Outer Space Treaty.jpg
      credit: ITU
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Signing_Outer_Space_Treaty.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.6
    card:
      kind: dateline
      big: '1967'
      small: Washington, London, Moscow
- text: This agreement strictly bans countries from placing nuclear weapons or weapons of mass destruction in Earth orbit.
  emphasis:
  - weapons of mass destruction
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Sputnik_1.jpg/1280px-Sputnik_1.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Sputnik 1.jpg
      credit: U.S. Air Force photo
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Sputnik_1.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.3
    card:
      kind: fact
      big: Nuclear Ban
      small: Orbiting WMDs
- text: It forbids nations from claiming any celestial bodies.
  emphasis:
  - celestial bodies
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/6b/Buzz_Aldrin_and_the_U.S._Flag_on_the_Moon_%289460188482%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Buzz Aldrin and the U.S. Flag on the Moon (9460188482).jpg
      credit: NASA/Apollo 11
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Buzz_Aldrin_and_the_U.S._Flag_on_the_Moon_(9460188482).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.65
    focus_y: 0.45
- text: The treaty only bans nukes, not conventional weapons.
  emphasis:
  - only bans nukes
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: Conventional Weapons
      small: Still permitted
    motion: zoom_in
- text: While the Moon remains a zone of peace, the legality of commercial asteroid mining is still fiercely debated.
  emphasis:
  - asteroid mining
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7a/S78_27139.2.jpg/3840px-S78_27139.2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: S78 27139.2.jpg
      credit: NASA/ Denise Watt
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:S78_27139.2.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Today, this legal shield ensures that no nation can ever own the Moon.
  emphasis:
  - no nation
