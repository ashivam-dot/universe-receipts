  emphasis:
  - own the Moon
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Aldrin_Apollo_11_%283x5_crop%29.jpg/960px-Aldrin_Apollo_11_%283x5_crop%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
