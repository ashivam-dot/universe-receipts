- text: At a closest approach of 10,520 astronomical units, it becomes the brightest object in our night sky besides the Sun,
    Moon, and Venus.
  emphasis:
  - 10,520 astronomical units
  - brightest object
  sfx: pop
  pause_after: 0.4
