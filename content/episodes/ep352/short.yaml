beats:
- text: A space probe slammed into the crushing skies of Venus.
  emphasis:
  - crushing skies
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/18/Venus_-_May_18_2016_%2839575655862%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Venus - May 18 2016 (39575655862).jpg
      credit: Kevin Gill from Los Angeles, CA, United States
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Venus_-_May_18_2016_(39575655862).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: During atmospheric entry, cabin deceleration reached 300 Gs.
  emphasis:
  - 300 Gs
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Venera_4_%28MMA_2011%29_%281%29.JPG/1920px-Venera_4_%28MMA_2011%29_%281%29.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Venera 4 (MMA 2011) (1).JPG
      credit: Armael
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Venera_4_(MMA_2011)_(1).JPG
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 300 Gs
      small: Cabin deceleration
- text: Its heat shield endured temperatures soaring up to 11,000 degrees Celsius.
  emphasis:
  - 11,000 degrees Celsius
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Artemis_I_Orion_heat_shield.jpg/3840px-Artemis_I_Orion_heat_shield.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artemis I Orion heat shield.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Artemis_I_Orion_heat_shield.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 11,000 C
      small: Heat shield temperature
- text: The probe deployed its parachute at an altitude of about 52 kilometers.
  emphasis:
  - 52 kilometers
  visual:
    source: card
    card:
      kind: fact
      big: 52 km
      small: Parachute deployment altitude
    motion: zoom_in
- text: It became the first successful spacecraft to transmit data from inside another planet's atmosphere.
  emphasis:
  - first successful spacecraft
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://live.staticflickr.com/3619/3614254573_c78d17ae22_b.jpg
    credit:
      source: Flickr via Openverse
      title: Lovell Radio Telescope, Jodrell Bank
      credit: tom_bullock
      license: CC BY 2.0
      url: https://www.flickr.com/photos/22206162@N03/3614254573
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Subsequent analysis proved the hull was crushed before reaching the surface.
  emphasis:
  - crushed before reaching the surface
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Venus_globe.jpg/3840px-Venus_globe.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Venus globe.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Venus_globe.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: And that is what happened when a probe slammed into Venus.
  emphasis:
  - probe slammed
  sfx: whoosh
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
