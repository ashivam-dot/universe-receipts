- https://www.spacedaily.com/t-the-voyager-golden-record-carries-a-small-sample-of-uranium-on-its-cover-placed-there-so-whoever-finds-it-can-measure-the-decay-and-work-out-how-long-it-has-been-drifting-a-built-in-clock-for-any-ci/
- https://science.nasa.gov/mission/voyager/golden-record-cover/
- https://www.latimes.com/books/la-ca-jc-review-vinyl-frontier-jonathan-scott-20190711-story.html
