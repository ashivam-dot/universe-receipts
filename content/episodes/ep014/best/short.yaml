id: ep014
title: The Atomic Clock Bolted to Voyager's Golden Record
series: Space Got Weird
description: Discover how NASA used a tiny, ultra-pure sample of radioactive uranium-238 to build a silent atomic clock on
  the Voyager Golden Record.
sources:
