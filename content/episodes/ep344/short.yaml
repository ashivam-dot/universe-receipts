id: ep344
title: The Wall Too BIG to Exist
series: Scale Breaker
format: v3
description: In 1989, astronomers discovered the CfA2 Great Wall, a structure so massive it challenged the timeline of the
  universe.
sources:
- https://en.wikipedia.org/wiki/CfA2_Great_Wall
- https://www.latimes.com/archives/la-xpm-1989-11-17-mn-1832-story.html
- https://www.skyatnightmagazine.com/space-science/cfa2-great-wall-galaxies
- https://en-academic.com/dic.nsf/enwiki/11512743
- https://lweb.cfa.harvard.edu/~dfabricant/huchra/zcat/
hashtags:
- '#space'
- '#astronomy'
- '#universe'
tags:
- Great Wall
- CfA2 Great Wall
- Margaret Geller
- John Huchra
- galaxy filament
- dark matter
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
- text: A wall of galaxies stretches across the deep sky.
  emphasis:
  - wall of galaxies
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Large-scale_structure_of_light_distribution_in_the_universe.jpg/3840px-Large-scale_structure_of_light_distribution_in_the_universe.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Large-scale structure of light distribution in the universe.jpg
      credit: Andrew Pontzen and Fabio Governato
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Large-scale_structure_of_light_distribution_in_the_universe.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: If our home galaxy were a single pebble, this wall is a mountain.
  emphasis:
  - mountain
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Simulation_of_large_scale_structure_%28eso1438b%29.jpg/3840px-Simulation_of_large_scale_structure_%28eso1438b%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Simulation of large scale structure (eso1438b).jpg
      credit: Illustris Collaboration
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Simulation_of_large_scale_structure_(eso1438b).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: It contains thousands of galaxies, like the massive Coma Cluster.
  emphasis:
  - thousands of galaxies
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Coma_Cluster_Full_Mosaic_%282018-44-4268%29.tif/lossy-page1-3840px-Coma_Cluster_Full_Mosaic_%282018-44-4268%29.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Coma Cluster Full Mosaic (2018-44-4268).tif
      credit: NASA, ESA, J. Mack (STScI), and J. Madrid (Australian Telescope National Facility)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Coma_Cluster_Full_Mosaic_(2018-44-4268).tif
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers Margaret Geller and John Huchra mapped this sheet in 1989.
  emphasis:
  - Margaret Geller
  visual:
    source: card
    card:
      kind: dateline
      big: '1989'
      small: Whipple Observatory
    motion: zoom_in
- text: The structure is a staggering 500 million light-years long.
  emphasis:
  - 500 million
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/2MASS_LSS_chart-NEW_Nasa_rus.jpg/960px-2MASS_LSS_chart-NEW_Nasa_rus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 2MASS LSS chart-NEW Nasa rus.jpg
      credit: '2MASS_LSS_chart-NEW_Nasa.jpg: IPAC/Caltech, by Thomas Jarrett

        derivative work: antropia (talk)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:2MASS_LSS_chart-NEW_Nasa_rus.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500 MILLION
      small: light-years long
- text: Gravity shouldn't have had enough time to build something this big.
  emphasis:
  - enough time
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/6f/CMB_Timeline300_no_WMAP.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: CMB Timeline300 no WMAP.jpg
      credit: NASA/WMAP Science Team
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_Timeline300_no_WMAP.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Only an invisible web of dark matter makes its scale possible.
  emphasis:
  - dark matter
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Probing_the_cosmic_web_%28opo0820b%29.tiff/lossy-page1-1920px-Probing_the_cosmic_web_%28opo0820b%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Probing the cosmic web (opo0820b).tiff
      credit: NASA, ESA, and E. Hallman (University of Colorado, Boulder)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Probing_the_cosmic_web_(opo0820b).tiff
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Our own Milky Way still hides the wall's true end.
  emphasis:
  - Milky Way
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/VISTA_gigapixel_mosaic_of_the_central_parts_of_the_Milky_Way-Eso1242a.tif/lossy-page1-3840px-VISTA_gigapixel_mosaic_of_the_central_parts_of_the_Milky_Way-Eso1242a.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: VISTA gigapixel mosaic of the central parts of the Milky Way-Eso1242a.tif
      credit: 'ESO/VVV Survey/D. MinnitiAcknowledgement: Ignacio Toledo, Martin Kornmesser'
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:VISTA_gigapixel_mosaic_of_the_central_parts_of_the_Milky_Way-Eso1242a.tif
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: A hidden giant remains draped across the entire sky.
  emphasis:
  - hidden giant
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
