id: ep485
title: The Saturnian Moon That Acts Like a Sponge
series: Space Got Weird
format: v3
description: Hyperion looks like a giant sponge because it is roughly forty percent empty space. Incoming meteors compress
  its porous ice inward rather than blasting debris out.
