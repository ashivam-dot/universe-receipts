id: ep485
title: The Saturnian Moon That Acts Like a Sponge
series: Space Got Weird
format: v3
description: Hyperion is a bizarre moon that is roughly forty percent empty space. This causes meteor impacts to compress
  its surface like foam rather than blasting out debris.
