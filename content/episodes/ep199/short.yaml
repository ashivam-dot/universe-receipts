    reuse: 3
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Believing the target vehicle was malfunctioning, the crew undocked while out of radio range.
  emphasis:
  - undocked
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/2d/Agena_Target_Docking_vehicle_seen_from_Gemini_8_spacecraft_%28s66-25778%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
