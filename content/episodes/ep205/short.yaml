- text: Space is a silent vacuum, except for one massive cosmic singer.
  emphasis:
  - silent vacuum
  - cosmic singer
  visual:
    source: card
    card:
      kind: fact
      big: silent vacuum
      small: ''
    motion: zoom_in
- text: Most people assume sound cannot travel through the total emptiness of space.
  emphasis:
  - emptiness of space
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e5/Abell_426_with_8_inch_RC.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Abell 426 with 8 inch RC.jpg
      credit: Brainandforce
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Abell_426_with_8_inch_RC.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: But the Perseus Cluster, 250 million light-years away, is filled with hot gas.
  emphasis:
  - Perseus Cluster
  - hot gas
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Perseus_A-_Chandra_Catches_Cannibal_Galaxy_in_the_Act_%282000-perseus_-_asmooth%29.tiff/lossy-page1-1920px-Perseus_A-_Chandra_Catches_Cannibal_Galaxy_in_the_Act_%282000-perseus_-_asmooth%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
