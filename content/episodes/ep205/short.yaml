- text: In 2002, NASA’s Chandra X-ray Observatory detected real pressure waves rippling through that gas.
  emphasis:
  - pressure waves
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d0/Chandra_X-ray_Image_of_Perseus_A_%282008-perseus-more-1%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
