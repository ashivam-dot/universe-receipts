    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2002'
      small: Chandra X-ray Observatory
- text: A supermassive black hole in galaxy NGC 1275 is blowing plasma bubbles, creating a cosmic hum.
  emphasis:
  - plasma bubbles
  - cosmic hum
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Perseus_A-_A_Monster_Galaxy_at_the_Heart_of_Perseus_Cluster_%282008-perseus_-_1680%29.jpg/1280px-Perseus_A-_A_Monster_Galaxy_at_the_Heart_of_Perseus_Cluster_%282008-perseus_-_1680%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
