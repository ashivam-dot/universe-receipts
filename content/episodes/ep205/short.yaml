    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 100 million
      small: supernovae
- text: It is a deep, eternal vibration proving that space is a silent vacuum.
  emphasis:
  - eternal vibration
