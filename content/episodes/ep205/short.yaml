    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers at Cambridge University found this hum is a B-flat note 57 octaves below middle C.
  emphasis:
  - B-flat
  - 57 octaves
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 57 octaves
      small: below middle C
    motion: zoom_in
- text: A single oscillation of this deep sound wave takes nearly ten million years to complete.
  emphasis:
  - ten million years
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 5
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This sound carries the energy of 100 million supernovae, keeping the cluster too hot to form stars.
  emphasis:
  - 100 million supernovae
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Illustration_of_Active_Galactic_Nucleus_%282007-agns_-_accretiondisk_torus%29.tiff/lossy-page1-1920px-Illustration_of_Active_Galactic_Nucleus_%282007-agns_-_accretiondisk_torus%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
