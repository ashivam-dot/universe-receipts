  - 78,000 miles
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Halloween_asteroid.jpg/1280px-Halloween_asteroid.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
