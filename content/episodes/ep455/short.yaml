id: ep455
title: Saturn's Rings Are Younger Than Dinosaurs
series: Space Myths, Busted
format: v3
description: NASA's Cassini spacecraft proved Saturn's ring system is remarkably young. A shattered icy moon formed the massive
  rings during the age of dinosaurs.
