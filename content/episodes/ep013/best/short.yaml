- text: Olympus Mons stands approximately twenty-one to twenty-five kilometers high on the Martian surface.
  emphasis:
  - twenty-one to twenty-five kilometers
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/USGS-Mars-MC-17-PhoenicisRegion-mola.png/1920px-USGS-Mars-MC-17-PhoenicisRegion-mola.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: USGS-Mars-MC-17-PhoenicisRegion-mola.png
      credit: USGS (United States Geological Survey)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:USGS-Mars-MC-17-PhoenicisRegion-mola.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 25 kilometers
      small: Height of Olympus Mons
- text: That is roughly three times the height of Mount Everest, spreading as wide as the state of Arizona.
  emphasis:
  - three times
  - Arizona
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/95/Everest%2C_Nuptse%2C_Khumbu_Glacier%2C_Himalayas.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Everest, Nuptse, Khumbu Glacier, Himalayas.jpg
      credit: Vyacheslav Argenberg
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Everest,_Nuptse,_Khumbu_Glacier,_Himalayas.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Yet its shield volcano profile has an average slope of just five percent.
  emphasis:
  - five percent
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Die_%E2%80%9Ezerknitterte%E2%80%9C_Landschaft_von_Lycus_Sulci_%2853374064752%29.jpg/1280px-Die_%E2%80%9Ezerknitterte%E2%80%9C_Landschaft_von_Lycus_Sulci_%2853374064752%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Die „zerknitterte“ Landschaft von Lycus Sulci (53374064752).jpg
      credit: DLR_de
      license: CC BY 3.0 de
      url: https://commons.wikimedia.org/wiki/File:Die_%E2%80%9Ezerknitterte%E2%80%9C_Landschaft_von_Lycus_Sulci_(53374064752).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 5 percent
      small: Average slope
- text: Because of this gentle grade, the ground appears as a plain stretching to a horizon a mere three kilometers away.
  emphasis:
  - mere three kilometers
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 3 kilometers
      small: Distance to horizon
    motion: zoom_in
- text: The summit calderas remain completely out of view, hiding the scale of the largest volcano in the solar system.
  emphasis:
  - out of view
  - largest volcano
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/PIA01457.jpg/960px-PIA01457.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
