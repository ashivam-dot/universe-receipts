id: ep219
title: The Moon Rock Hiding in Madagascar
series: Space Got Weird
description: The bright highlands of the Moon are made of anorthosite, an ancient rock that also forms a massive white formation
  in Madagascar. Astronauts photographed the forty-square-mile geological wonder from the Space Station.
sources:
- https://science.nasa.gov/earth/earth-observatory/moon-like-madagascar/
- https://sciencedaily.com/releases/2026/10/261008102707.htm
- https://www.earth.com/science/nasa-astronaut-spots-moon-like-rocks-in-madagascar/
- https://www.europesays.com/africa/482851/
- https://scitechdaily.com/nasa-captures-a-strange-formation-on-earth-with-a-surprising-lunar-connection/
- https://www.ecoportal.net/en/saririaky-anorthosite-madagascar-nasa/42656/
- https://en.wikipedia.org/wiki/Anorthosite
hashtags:
- '#space'
- '#moon'
- '#geology'
tags:
- anorthosite
- moon rock
- madagascar
- lunar highlands
- space station
- geology
- saririaky massif
