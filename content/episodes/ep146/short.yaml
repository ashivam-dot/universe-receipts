      small: Orbital period
- text: Every late October, Earth plows directly through this trail, igniting the Orionid meteor shower.
  emphasis:
  - late October
  - Orionid meteor shower
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Orionid_Meteor_Shower_Composite_%2850521737888%29.jpg/3840px-Orionid_Meteor_Shower_Composite_%2850521737888%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
