- text: Halley takes about 76 years to orbit the Sun, shedding dust and debris along its path.
  emphasis:
  - 76 years
  - dust and debris
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/63/Halley%27s_multiple_dust_tail_%28eso8605a%29.jpg/1280px-Halley%27s_multiple_dust_tail_%28eso8605a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
