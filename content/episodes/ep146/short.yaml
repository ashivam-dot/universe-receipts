    - color
    motion: pan_left
    focus_x: 0.28
    focus_y: 0.22
    card:
      kind: fact
      big: Late October
      small: Annual shower peak
- text: These particles strike the upper atmosphere at a blistering 66 kilometers per second.
  emphasis:
  - blistering
  - 66 kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Meteoroid_track_through_aerogel_from_EURECA_mission.jpg/500px-Meteoroid_track_through_aerogel_from_EURECA_mission.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
