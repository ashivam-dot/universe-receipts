id: ep146
title: Halley's Comet Is Burning Above You TONIGHT
series: Space Myths, Busted
description: The Orionid meteor shower peaking tonight is made of dust and debris shed by Halley's Comet. Earth crosses the
  iconic comet's orbit twice every year.
sources:
- https://en.wikipedia.org/wiki/Halley%27s_Comet
- https://science.nasa.gov/solar-system/meteors-meteorites/orionids/
- https://www.space.com/stargazing/meteor-showers/the-orionid-meteor-shower-peaks-under-dark-moonless-skies-next-week-heres-how-to-see-it
- http://www.universetoday.com/48991/halleys-comet/
- https://en.wikipedia.org/wiki/Orionids
hashtags:
- '#space'
- '#halleyscomet'
- '#meteors'
tags:
- astronomy
- orionids
- halleys comet
