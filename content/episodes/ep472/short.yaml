id: ep472
title: How Art Pastels Revealed the True Face of Mars
series: Mission Files
format: v3
description: Before computers processed the first close-up data from Mars, NASA engineers hand-colored a pixel printout using
  pastels. Mariner 4 revealed a cold, cratered world instead of a living planet.
sources:
- https://en.wikipedia.org/wiki/Mariner_4
- https://science.nasa.gov/mission/mariner-4/
- https://web.archive.org/web/20221231233510/http://www.directedplay.com/first-tv-image-of-mars
- http://www.marsdaily.com/reports/Has_The_Mariner_Meteor_Mystery_Been_Solved_999.html
- http://filmer.blogspot.com/2004/01/beagle-here-beagle-beagle.html
hashtags:
- '#space'
- '#mariner4'
- '#mars'
tags:
- mars
- mariner 4
- nasa
- jpl
- space exploration
- astronomy
