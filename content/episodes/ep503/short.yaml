id: ep503
title: Why Space Won't Instantly Freeze You
series: Space Myths, Busted
format: v3
description: Hollywood movies show astronauts freezing solid in space, but the vacuum is actually a thermal insulator. Here
  is what really happens to your body without a spacesuit.
sources:
- https://en.wikipedia.org/wiki/Effect_of_spaceflight_on_the_human_body
- https://imagine.gsfc.nasa.gov/ask_astro/space_travel.html
