    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1877'
      small: Pegasus
- text: However, modern measurements revealed that its brightest member, NGC 7320, is merely a foreground interloper.
  emphasis:
  - NGC 7320
  - foreground interloper
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/NGC_7320.jpg/1920px-NGC_7320.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NGC 7320.jpg
      credit: NASA, ESA, and the Hubble SM4 ERO Team
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NGC_7320.jpg
