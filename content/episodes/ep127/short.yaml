    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: NGC 7320
      small: Foreground Interloper
- text: It sits only thirty-nine million light-years from Earth, while the other four galaxies are parked 210 to 340 million
    light-years away.
  emphasis:
  - thirty-nine million light-years
  - 210 to 340 million
