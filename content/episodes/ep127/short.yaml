    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 39 Million
      small: Light-Years Away
- text: Even wilder, another intruder named NGC 7318B is currently falling into the center at supersonic speeds of several
    million kilometers per hour.
  emphasis:
  - NGC 7318B
  - supersonic speeds
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/b1/NGC_7318_taken_by_James_Webb_Space_Telescope_%28cropped%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
