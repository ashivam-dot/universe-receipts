id: ep127
title: The Supersonic Impostor in Stephan's Quintet
series: Space Got Weird
description: Stephan's Quintet looks like a peaceful cosmic family, but one galaxy is actually an interloper plowing through
  at supersonic speeds.
sources:
- https://en.wikipedia.org/wiki/Stephan%27s_Quintet
- https://www.constellation-guide.com/stephans-quintet/
- https://www.space.com/2125-shock-galaxies-caught-colliding.html
- https://www.astronomy.com/science/stephans-quintet/
- https://web.archive.org/web/20191224142658/https://www.noao.edu/image_gallery/html/im0414.html
hashtags:
- '#space'
- '#astronomy'
- '#galaxies'
tags:
- Stephan's Quintet
- galaxies
- astronomy
- Pegasus
- JWST
- cosmic collision
