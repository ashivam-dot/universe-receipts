    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Compass_and_Scale_Image_of_Stephan%27s_Quintet_%282009-25-2583%29.jpg/1920px-Compass_and_Scale_Image_of_Stephan%27s_Quintet_%282009-25-2583%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
