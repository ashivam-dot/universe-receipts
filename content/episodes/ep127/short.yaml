    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Discovered in 1877 by Édouard Stephan, the group in the constellation Pegasus appears to be a tight cluster of five.
  emphasis:
  - Édouard Stephan
  - constellation Pegasus
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Pegasus_-_Johann_Bayer.jpg/3840px-Pegasus_-_Johann_Bayer.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
