  - Four interacting galaxies
  - supersonic impostor
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Stephan%27s_Quintet_%28NIRCam_and_MIRI_Composite_Compass_Image%29_%282022-034-01G7DBYV6PTE37PEB5TZ19TMV2%29.tiff/lossy-page1-1920px-Stephan%27s_Quintet_%28NIRCam_and_MIRI_Composite_Compass_Image%29_%282022-034-01G7DBYV6PTE37PEB5TZ19TMV2%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
