    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.6
    card:
      kind: fact
      big: NO LIMIT
      small: on space expansion
- text: That ancient matter was carried 46 billion light-years away while its original glow was still in transit.
  emphasis:
  - 46 billion light-years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Webb%27s_First_Deep_Field.jpg/1920px-Webb%27s_First_Deep_Field.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
