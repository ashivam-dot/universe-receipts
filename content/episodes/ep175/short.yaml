id: ep175
title: The 93-Billion-Light-Year Paradox
series: Scale Breaker
description: If light can only travel for 13.8 billion years, how can the observable universe span 93 billion light-years?
  The mystery lies in the stretching fabric of space itself.
sources:
- https://en.wikipedia.org/wiki/Observable_universe
- https://www.space.com/25303-how-many-galaxies-are-in-the-universe.html
- https://www.livescience.com/how-many-atoms-in-universe.html
- https://www.spacedaily.com/t-universe-13-8-billion-years-93-billion-light-years-46-5/
- https://morningoverview.com/the-observable-universe-stretches-roughly-93-billion-light-years-across/
- https://biologyinsights.com/how-many-light-years-across-is-the-universe/
- https://astro.ucla.edu/~wright/cosmology_faq.html
hashtags:
- '#space'
- '#astronomy'
- '#cosmology'
tags:
- observable universe
- cosmic expansion
- big bang
- speed of light
- astronomy
- cosmology
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Our universe is 13.8 billion years old, but 93 billion light-years wide.
  emphasis:
  - 13.8 billion years old
  - 93 billion light-years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Dark_Flow_%284423361836%29.jpg/960px-Dark_Flow_%284423361836%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Dark Flow (4423361836).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Dark_Flow_(4423361836).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 93 BILLION
      small: light-years across
- text: Since nothing outruns light, that cosmic sphere should logically measure under 28 billion light-years across.
  emphasis:
  - 28 billion light-years
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/CMB_universe_expansion.png/1920px-CMB_universe_expansion.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: CMB universe expansion.png
      credit: NASA/WMAP Science Team/ Art by Dana Berry
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CMB_universe_expansion.png
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: When the oldest detectable glow was emitted 380,000 years after the Big Bang, its source sat just 42 million light-years
    away.
  emphasis:
  - 380,000 years
  - 42 million light-years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Oldest_Light_in_the_Universe_%28SVS30133%29.jpg/3840px-Oldest_Light_in_the_Universe_%28SVS30133%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Oldest Light in the Universe (SVS30133).jpg
      credit: NASA's Scientific Visualization Studio - Marit Jentoft-Nilsen, Global Science and Technology, Inc./Mark Malanoski
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Oldest_Light_in_the_Universe_(SVS30133).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 42 MILLION
      small: light-years away at emission
- text: Yet as those ancient photons spent 13.8 billion years journeying toward Earth, the distance multiplied between us.
  emphasis:
  - multiplied
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg/1920px-NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg
      credit: NASA, ESA, H. Teplitz and M. Rafelski (IPAC/Caltech), A. Koekemoer (STScI), R. Windhorst (Arizona State University),
        and Z. Levay (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-HS201427a-HubbleUltraDeepField2014-20140603.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Albert Einstein proved no physical object can move locally through space faster than light.
  emphasis:
  - through space
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Einstein_1921_by_F_Schmutzer_-_restoration.jpg/1920px-Einstein_1921_by_F_Schmutzer_-_restoration.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Einstein 1921 by F Schmutzer - restoration.jpg
      credit: Ferdinand Schmutzer / Adam Cuerden
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Einstein_1921_by_F_Schmutzer_-_restoration.jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.55
    focus_y: 0.35
    box:
    - 0.42
    - 0.15
    - 0.68
    - 0.48
- text: But the fabric of space itself has no speed limit, stretching relentlessly between receding galaxies.
  emphasis:
  - no speed limit
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e5/Probing_the_cosmic_web_%28opo0820b%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
