    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90 Times
      small: Earth's Pressure
- text: In 2021, NASA selected the DAVINCI mission to pierce the planet's toxic clouds of sulfuric acid.
  emphasis:
  - DAVINCI mission
  - sulfuric acid
  visual:
    source: card
    card:
      kind: dateline
      big: June 2021
      small: Mission Selected
    motion: zoom_in
- text: The heart of the mission is a titanium sphere built to survive a one-hour plunge through the crushing air.
  emphasis:
  - titanium sphere
  - one-hour plunge
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8e/DAVINCI_Drop_Testing_at_UTTR_%28SVS14582%29.jpg/960px-DAVINCI_Drop_Testing_at_UTTR_%28SVS14582%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: DAVINCI Drop Testing at UTTR (SVS14582).jpg
