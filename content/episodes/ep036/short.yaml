        Garvin
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:DAVINCI_Drop_Testing_at_UTTR_(SVS14582).jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.6
    box:
    - 0.13
    - 0.38
    - 0.87
    - 0.85
- text: This descent probe will sniff noble gases to discover if Earth's twin once held vast water oceans.
  emphasis:
  - noble gases
  - water oceans
  visual:
    source: card
    card:
      kind: fact
      big: Ancient Oceans
      small: Science Goal
    motion: zoom_in
- text: Before crashing, the sphere will capture the first high-resolution views of Venus's rugged mountains since 1982.
  emphasis:
  - rugged mountains
  - since 1982
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/81/Maxwell_Montes_on_Venus2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
