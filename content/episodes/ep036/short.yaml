- text: Venus features a surface hot enough to melt lead and crushing pressure ninety times greater than Earth's.
  emphasis:
  - ninety times
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Surfaces_of_Venus%2C_Venere_13_and_Venera14.jpg/1920px-Surfaces_of_Venus%2C_Venere_13_and_Venera14.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
