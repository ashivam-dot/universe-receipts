id: ep036
title: NASA's titanium probe to Venus
series: Mission Files
description: NASA is dropping a specialized titanium sphere into the 900-degree atmosphere of Venus to find evidence of ancient
  oceans.
sources:
- https://www.nasa.gov/solar-system/nasa-to-explore-divergent-fate-of-earths-mysterious-twin-with-goddards-davinci/
