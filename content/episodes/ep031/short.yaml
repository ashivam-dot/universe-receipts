- text: A postage stamp declaring Pluto unexplored inspired a spacecraft to visit it.
  emphasis:
  - Pluto unexplored
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Pluto-01_Stern_03_Pluto_Color_TXT.jpg/3840px-Pluto-01_Stern_03_Pluto_Color_TXT.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
