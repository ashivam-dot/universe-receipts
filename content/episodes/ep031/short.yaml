    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In 1991, the postal service released stamps showing every planet alongside its visitor except the ninth.
  emphasis:
  - except the ninth
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/United_States_Postal_Service_Truck.jpg/1920px-United_States_Postal_Service_Truck.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: United States Postal Service Truck.jpg
      credit: Alexander Marks (aomarks)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:United_States_Postal_Service_Truck.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.4
- text: 'The Pluto stamp simply read, Pluto: Not Yet Explored.'
  emphasis:
  - Not Yet Explored
  visual:
    reuse: 2
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.4
- text: The phrase irked scientists so much it became a call to arms for a new mission.
