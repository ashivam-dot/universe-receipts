  - call to arms
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/La_NASA_en_la_Embajada_%2834142640202%29.jpg/1280px-La_NASA_en_la_Embajada_%2834142640202%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
