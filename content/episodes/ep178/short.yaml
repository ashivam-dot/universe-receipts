    focus_y: 0.5
- text: Yet the automated ship guided itself home, surviving re-entry and touching down on parachutes in Kazakhstan.
  emphasis:
  - automated ship
  - Kazakhstan
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Expedition_59_Soyuz_MS-11_Landing_%28NHQ201906250017%29.jpg/3840px-Expedition_59_Soyuz_MS-11_Landing_%28NHQ201906250017%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
