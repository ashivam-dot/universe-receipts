- text: The cabin depressurized into space in less than one minute, with the crew wearing no pressurized spacesuits.
  emphasis:
  - less than one minute
  - no pressurized spacesuits
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Inside_the_Soyuz_spacecraft._-interstellar_today._%2815723361278%29.jpg/1920px-Inside_the_Soyuz_spacecraft._-interstellar_today._%2815723361278%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
