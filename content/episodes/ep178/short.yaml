- text: After more than three weeks of orbital experiments, their Soyuz 11 spacecraft undocked to return to Earth.
  emphasis:
  - three weeks
  - Soyuz 11
  visual:
    reuse: 2
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Roughly 80 to 100 miles above Earth, capsule separation accidentally jarred open an air equalization valve.
  emphasis:
  - 80 to 100 miles
  - air equalization valve
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/03/Diagram_of_Soyuz_ASTP_spacecraft_%28MSFC-0101493%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
