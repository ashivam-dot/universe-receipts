    url: https://upload.wikimedia.org/wikipedia/commons/0/03/Diagram_of_Soyuz_ASTP_spacecraft_%28MSFC-0101493%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
