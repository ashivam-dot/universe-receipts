beats:
- text: On one asteroid, the sun rises and sets in completely random locations.
  emphasis:
  - random locations
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/4179_Toutatis.png/960px-4179_Toutatis.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
