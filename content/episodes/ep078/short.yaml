      small: Minimum estimated lifetime
- text: Yet, researchers recently simulated these destructive bubbles using a quantum computer.
  emphasis:
  - simulated
  - quantum computer
  sfx: riser
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/1c/Quantum_Computing%3B_Ion_Trapping_%285941055642%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
