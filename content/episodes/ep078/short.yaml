- text: It's called false vacuum decay, where a sudden shift in cosmic energy destroys space itself.
  emphasis:
  - false vacuum decay
  - destroys space itself
  sfx: whoosh
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Physicist Sidney Coleman established the mathematical framework for this catastrophic process in 1977.
  emphasis:
  - Sidney Coleman
  - '1977'
  visual:
    source: card
    card:
      kind: dateline
      big: '1977'
      small: Theoretical framework established
    motion: zoom_in
- text: Calculations show our entire universe exists in this fragile, temporary state.
  emphasis:
  - entire universe
  - fragile
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/CERN_OpenDays_%40_LHC_02.jpg/1920px-CERN_OpenDays_%40_LHC_02.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
