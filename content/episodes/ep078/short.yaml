- text: Our universe could vanish in an instant with zero warning.
  emphasis:
  - vanish in an instant
  - zero warning
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Illustration_of_an_Isolated_Black_Hole_%2852675793824%29.png/1280px-Illustration_of_an_Isolated_Black_Hole_%2852675793824%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
