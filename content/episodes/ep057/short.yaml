      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Delta_II_launches_with_Mars_Climate_Orbiter.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Lockheed Martin built the spacecraft to calculate thrusters using pound-force seconds.
  emphasis:
  - Lockheed Martin
  - pound-force seconds
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/7c/Preparing_Juno_for_WAVES_installation.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Preparing Juno for WAVES installation.jpg
      credit: 'Photo credit: NASA/Frankie Martin'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Preparing_Juno_for_WAVES_installation.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Lockheed Martin
      small: Builder of the spacecraft
- text: Meanwhile, NASA navigation software expected metric newton-seconds for those exact thrusters.
  emphasis:
  - NASA navigation software
  - newton-seconds
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Mission_Operations_Control_Room_during_Apollo_9.jpg/3840px-Mission_Operations_Control_Room_during_Apollo_9.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Mission Operations Control Room during Apollo 9.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Mission_Operations_Control_Room_during_Apollo_9.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Because one pound-force equals about 4.45 newtons, the system treated force as twenty-two percent of its actual value.
  emphasis:
  - 4.45 newtons
  - twenty-two percent
  sfx: riser
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 4.45 newtons
      small: One pound-force equivalent
    motion: zoom_in
- text: Those tiny uncorrected errors accumulated over a nine-month journey across space.
  emphasis:
  - uncorrected errors
  - nine-month journey
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Mars_-_Over_Gale_Crater_%2845991611011%29.jpg/1280px-Mars_-_Over_Gale_Crater_%2845991611011%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
