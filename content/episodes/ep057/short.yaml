      title: Mars - Over Gale Crater (45991611011).jpg
      credit: Kevin M. Gill
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Mars_-_Over_Gale_Crater_(45991611011).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: On September twenty-third, nineteen ninety-nine, the probe plunged to a lethal altitude of just thirty-five miles.
  emphasis:
  - September twenty-third
  - thirty-five miles
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/PIA07500.jpg/3840px-PIA07500.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
