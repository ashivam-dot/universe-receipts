    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: Sept 23, 1999
      small: Orbital insertion
- text: Navigators spotted discrepancies earlier, but managers dismissed their warnings because proper paperwork was missing.
  emphasis:
  - proper paperwork
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Bill_Tindall_%28left%29_and_Gene_Kranz_in_Mission_Control_during_Apollo_11.png/960px-Bill_Tindall_%28left%29_and_Gene_Kranz_in_Mission_Control_during_Apollo_11.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Bill Tindall (left) and Gene Kranz in Mission Control during Apollo 11.png
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Bill_Tindall_(left)_and_Gene_Kranz_in_Mission_Control_during_Apollo_11.png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: That fatal refusal to file correct forms is why a hundred million dollar Mars orbiter vanished from a simple math
    mix-up.
  emphasis:
  - fatal refusal
  - simple math mix-up
