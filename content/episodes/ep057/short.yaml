    focus_x: 0.5
    focus_y: 0.5
- text: Most people assume it was a sudden rocket failure, but the truth hid in software.
  emphasis:
  - rocket failure
  - hid in software
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Delta_II_launches_with_Mars_Climate_Orbiter.jpg/1280px-Delta_II_launches_with_Mars_Climate_Orbiter.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
