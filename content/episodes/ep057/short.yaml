id: ep057
title: The Mars Mistake That Lost an Orbiter
series: Mission Files
description: Discover how a unit mismatch between pounds and newtons led to the loss of the Mars Climate Orbiter in nineteen
  ninety-nine.
sources:
- https://en.wikipedia.org/wiki/Mars_Climate_Orbiter
- https://www.latimes.com/archives/la-xpm-1999-oct-01-mn-17288-story.html
- https://www.19fortyfive.com/2026/09/mars-climate-orbiter-ran-on-pound-force-seconds-while-nasas-software-expected-newtons-and-over-nine-months-that-4-45-to-one-error-put-it-35-miles-above-mars-instead-of-85-so-on-23-september-1/
- https://www.spacedaily.com/t-mars-climate-orbiter-pound-force-newton-seconds/
- https://www.jpl.nasa.gov/news/mars-climate-orbiter-team-finds-likely-cause-of-loss/
- https://web.archive.org/web/20131226075519/http://www.pbs.org/newshour/bb/science/jan-june00/nasa_4-14.html
hashtags:
- '#space'
- '#nasa'
- '#mars'
tags:
- Mars Climate Orbiter
- NASA
- spacecraft
- units
- Lockheed Martin
