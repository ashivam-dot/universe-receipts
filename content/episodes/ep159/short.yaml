- https://web.archive.org/web/20210408001053/https://www.nasa.gov/vision/space/workinginspace/great_wall.html
- https://web.archive.org/web/20211201222611/https://www.smithsonianmag.com/history/sticky-rice-mortar-view-space-and-more-fun-facts-about-chinas-great-wall-180962197/
