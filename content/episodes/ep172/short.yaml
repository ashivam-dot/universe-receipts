id: ep172
title: Why the Van Allen Belts Didn't Fry Apollo Astronauts
series: Space Myths, Busted
description: Discover how Apollo astronauts safely bypassed the lethal Van Allen radiation belts during their historic missions
  to the Moon.
sources:
