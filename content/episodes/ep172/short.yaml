    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Skeptics argued that passing through these radioactive zones would prove fatal for human travelers.
  emphasis:
  - radioactive zones
  - fatal
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Apollo_CSM_lunar_orbit.jpg/960px-Apollo_CSM_lunar_orbit.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo CSM lunar orbit.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Apollo_CSM_lunar_orbit.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: NASA trajectory planners designed high-speed routes through the thinnest parts of the belts.
  emphasis:
  - high-speed routes
  - thinnest parts
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Apollo_11_Crew.jpg/3840px-Apollo_11_Crew.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo 11 Crew.jpg
      credit: NASA
      license: Public domain
