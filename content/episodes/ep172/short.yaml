- text: Named after physicist James Van Allen, the inner region holds energetic protons while the outer contains high-energy
    electrons.
  emphasis:
  - James Van Allen
  - energetic protons
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/5b/James_Van_Allen_72400_A78-0077-9.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: James Van Allen 72400 A78-0077-9.jpg
      credit: NASA Ames Resarch Center (NASA-ARC)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:James_Van_Allen_72400_A78-0077-9.jpg
