    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Protected by aluminum hulls and moving at roughly twenty-five thousand miles per hour, astronauts spent only thirty
    minutes in the dense regions.
  emphasis:
  - aluminum hulls
  - thirty minutes
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/Fisheye_view_of_the_interior_of_the_Command_Module_simulator_with_Apollo_14_crew_Ap14-S70-45580HR.jpg/3840px-Fisheye_view_of_the_interior_of_the_Command_Module_simulator_with_Apollo_14_crew_Ap14-S70-45580HR.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
