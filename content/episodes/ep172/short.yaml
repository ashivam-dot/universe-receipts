    focus_x: 0.5
    focus_y: 0.5
- text: In 1958, Explorer one helped discover these two massive zones trapped by Earth's magnetic field.
  emphasis:
  - Explorer one
  - magnetic field
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/America%27s_First_Satellite_%28Explorer_1%29.jpg/960px-America%27s_First_Satellite_%28Explorer_1%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
