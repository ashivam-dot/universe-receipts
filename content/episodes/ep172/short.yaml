- https://theconversation.com/space-radiation-the-apollo-crews-were-extremely-lucky-120339
- http://www.popsci.com/blog-network/vintage-space/apollo-rocketed-through-van-allen-belts
- https://web.archive.org/web/20191220163500/https://image.gsfc.nasa.gov/poetry/tour/AAvan.html
- https://spectrum.ieee.org/military-experiments-target-the-van-allen-belts
- http://www.universetoday.com/110482/twin-nasa-probes-find-zebra-stripes-in-earths-radiation-belt
hashtags:
- '#space'
