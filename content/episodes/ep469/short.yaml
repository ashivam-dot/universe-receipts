id: ep469
title: The Last-Second Radio Signal That Saved Soyuz T-10a
series: Near Misses
format: v3
description: In 1983, Soviet cosmonauts Vladimir Titov and Gennadi Strekalov survived a massive launchpad explosion after
  a backup radio signal triggered their escape tower.
