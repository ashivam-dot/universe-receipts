    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1659'
      small: Christiaan Huygens
- text: These massive bands are actually 99.9 percent pure water ice.
  emphasis:
  - 99.9 percent
  - water ice
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/Saturn_Ring_Particles_%2832004738971%29.png/1920px-Saturn_Ring_Particles_%2832004738971%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Saturn Ring Particles (32004738971).png
      credit: geckzilla
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Saturn_Ring_Particles_(32004738971).png
