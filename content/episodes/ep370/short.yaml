beats:
- text: Saturn’s rings are wider than twenty Earths but razor-thin.
  emphasis:
  - twenty Earths
  - razor-thin
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg/3840px-PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA17172 Saturn eclipse mosaic bright crop.jpg
      credit: NASA / JPL-Caltech / Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA17172_Saturn_eclipse_mosaic_bright_crop.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: They span 170,000 miles while averaging just 30 feet thick.
  emphasis:
  - 170,000 miles
  - 30 feet thick
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/PIA11668_The_Tallest_Peaks.jpg/960px-PIA11668_The_Tallest_Peaks.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA11668 The Tallest Peaks.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA11668_The_Tallest_Peaks.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 30 feet
      small: Average thickness
- text: This disk is like a city-sized circle thinner than cardboard.
  emphasis:
  - city-sized
  - thinner than cardboard
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Planetary_Rings_and_California_%284078771106%29.jpg/1920px-Planetary_Rings_and_California_%284078771106%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Planetary Rings and California (4078771106).jpg
      credit: Lunar and Planetary Institute from Houston, TX, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Planetary_Rings_and_California_(4078771106).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Galileo first saw them in 1610 and thought they were ears.
  emphasis:
  - '1610'
  - ears
  visual:
    source: card
    card:
      kind: dateline
      big: '1610'
      small: Saturn
    motion: zoom_in
- text: Two years later they vanished because Earth passed through their plane.
  emphasis:
  - vanished
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/88/Edge-On_View_of_Saturn%27s_Rings_%281996-16-415%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Edge-On View of Saturn's Rings (1996-16-415).jpg
      credit: 'Credit: Erich Karkoschka (University of Arizona Lunar & Planetary Lab) and NASA'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Edge-On_View_of_Saturn%27s_Rings_(1996-16-415).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Christiaan Huygens finally revealed their true shape as detached rings in 1659.
  emphasis:
  - '1659'
  - detached rings
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/The_celestial_worlds_discover%27d-_or%2C_conjectures_concerning_the_inhabitants%2C_plants_and_productions_of_the_worlds_in_the_planets_Fleuron_T053996-5.png/1280px-The_celestial_worlds_discover%27d-_or%2C_conjectures_concerning_the_inhabitants%2C_plants_and_productions_of_the_worlds_in_the_planets_Fleuron_T053996-5.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
