    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 99.9%
      small: Pure water ice
- text: They are likely temporary, appearing only 100 million years ago.
  emphasis:
  - temporary
  - 100 million years
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 100 million
      small: Years old
    motion: zoom_in
- text: Nothing in the solar system matches this massive scale.
  emphasis:
  - nothing
  - massive scale
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
