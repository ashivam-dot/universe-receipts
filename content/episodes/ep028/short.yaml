id: ep028
title: The North Star Brightness Myth Busted
series: Space Myths, Busted
description: Polaris isn't even in the top forty brightest stars in the night sky. Here is why the North Star is famous despite
  its dim appearance.
sources:
- https://www.sciencing.com/1863568/myth-north-star-isnt-brightest-star-sky/
- https://discoverwildscience.com/the-north-star-isnt-the-brightest-star-and-it-wont-always-be-north-4-335803/
- https://www.spacedaily.com/m-the-north-star-is-not-the-brightest-star-in-the-sky-not-even-close-polaris-ranks-around-48th-far-outshone-by-sirius-and-dozens-of-others-what-makes-it-special-is-only-that-it-sits-almost/
- https://www.scienceaq.com/Article/Astronomy/398793.html
- https://thrushobservatory.org/why-the-north-star-isnt-the-brightest-star-in-the-sky/
- http://stars.astro.illinois.edu/sow/polaris.html
- https://en.wikipedia.org/wiki/Polaris
hashtags:
- '#space'
- '#polaris'
- '#astronomy'
tags:
- polaris
- north star
- sirius
- vega
- astronomy
- space myths
- precession
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The most famous star in the sky ranks 48th in brightness.
  emphasis:
  - 48th in brightness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/A_Colorful_Night_%28iotw2025a%29.tiff/lossy-page1-3840px-A_Colorful_Night_%28iotw2025a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A Colorful Night (iotw2025a).tiff
      credit: KPNO/NOIRLab/NSF/AURA/B. Tafreshi
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:A_Colorful_Night_(iotw2025a).tiff
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.75
    focus_y: 0.12
    card:
      kind: fact
      big: 48TH BRIGHTEST
      small: Polaris rank in night sky
- text: Millions of skywatchers mistakenly believe Polaris is the brightest star above Earth.
  emphasis:
  - mistakenly believe
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bc/Location_of_the_EGS_Field_on_the_Sky_%28opo0706f%29.jpg/1920px-Location_of_the_EGS_Field_on_the_Sky_%28opo0706f%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Location of the EGS Field on the Sky (opo0706f).jpg
      credit: NASA/ESA, The Hubble Heritage Team and A. Riess (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Location_of_the_EGS_Field_on_the_Sky_(opo0706f).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.88
    focus_y: 0.17
- text: In reality, Sirius blazes roughly 25 times brighter because it sits only 8.7 light-years away.
  emphasis:
  - 25 times brighter
  - 8.7 light-years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/The_Dog_Star%2C_Sirius%2C_and_its_Tiny_Companion_%282005-36-1820%29.jpg/1920px-The_Dog_Star%2C_Sirius%2C_and_its_Tiny_Companion_%282005-36-1820%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Dog Star, Sirius, and its Tiny Companion (2005-36-1820).jpg
      credit: NASA, H.E. Bond and E. Nelan (Space Telescope Science Institute, Baltimore, Md.); M. Barstow and M. Burleigh
        (University of Leicester, U.K.); and J.B. Holberg (University of Arizona)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Dog_Star,_Sirius,_and_its_Tiny_Companion_(2005-36-1820).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.49
    focus_y: 0.46
    card:
      kind: fact
      big: 25X BRIGHTER
      small: Sirius compared to Polaris
- text: Polaris sits over 430 light-years away, though it is intrinsically thousands of times more luminous than our Sun.
  emphasis:
  - over 430 light-years
  - more luminous
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Polaris_A_and_Polaris_B_%28opo0602c%29.jpg/960px-Polaris_A_and_Polaris_B_%28opo0602c%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Polaris A and Polaris B (opo0602c).jpg
      credit: NASA, ESA, N. Evans (Harvard-Smithsonian CfA), and H. Bond (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Polaris_A_and_Polaris_B_(opo0602c).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.25
    focus_y: 0.31
    card:
      kind: fact
      big: '> 430 LIGHT-YEARS'
      small: Distance to Polaris
- text: Navigators rely on Polaris solely because it aligns almost directly above Earth's northern rotational axis.
  emphasis:
  - northern rotational axis
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/Big_Dipper_%28ann22042ah%29.jpg/1920px-Big_Dipper_%28ann22042ah%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Big Dipper (ann22042ah).jpg
      credit: Arya Anthony/IAU OAE
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Big_Dipper_(ann22042ah).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.55
    focus_y: 0.72
- text: But Earth wobbles on its rotational axis over a 26,000-year cycle called precession.
  emphasis:
  - 26,000-year cycle
  - precession
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 26,000 YEARS
      small: Axial precession cycle
    motion: zoom_in
- text: Around the year 2100, Polaris reaches its closest northern alignment before slowly drifting away.
  emphasis:
  - year 2100
  - closest northern alignment
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Polaris_system.jpg/1920px-Polaris_system.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Polaris system.jpg
      credit: NASA/ESA/HST, G. Bacon (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Polaris_system.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: YEAR 2100
      small: Closest alignment to true north
- text: In 13,000 years, the brilliant star Vega will take over as our new North Star.
  emphasis:
  - 13,000 years
  - Vega
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/ad/Vega_by_Stephen_Rahn.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Vega by Stephen Rahn.jpg
      credit: Stephen Rahn
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Vega_by_Stephen_Rahn.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.51
    card:
      kind: fact
      big: VEGA
      small: Future North Star in 13,000 years
- text: Until then, many will still falsely assume that the North Star is the brightest.
  emphasis:
  - falsely assume
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.75
    focus_y: 0.12
hook_text: NOT THE BRIGHTEST STAR
