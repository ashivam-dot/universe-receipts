id: ep263
title: The Black Hole Vacuum Myth
series: Space Myths, Busted
format: v3
description: Black holes do not suck in everything around them. At a distance, their gravity is identical to any normal star
  of the same mass.
sources:
- https://en.wikipedia.org/wiki/Black_hole
- https://science.nasa.gov/universe/black-holes/
- https://www.esa.int/gsp/ACT/phy/Projects/Blackholes/WebGL/
hashtags:
- '#space'
- '#blackhole'
- '#astronomy'
tags:
- black hole
- sagittarius a*
- gravity
- space myth
- astronomy
- physics
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
