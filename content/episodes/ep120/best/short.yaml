id: ep120
title: The Cosmic Giant Tearing Itself Apart
series: Scale Breaker
description: Astronomers discovered El Gordo, a titan weighing up to three quadrillion Suns. Instead of one peaceful cluster,
  it is two massive systems smashing together at extreme speeds.
