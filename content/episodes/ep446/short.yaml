id: ep446
title: Why the Sun Is Not Actually on Fire
series: Space Myths, Busted
format: v3
description: The Sun doesn't burn like a bonfire; it is powered by nuclear fusion. Surprisingly, its core produces less heat
  per volume than your own body.
sources:
- https://en.wikipedia.org/wiki/Nuclear_fusion
- https://theuniverseepisodes.com/how-does-the-sun-burn-without-oxygen/
- https://ar5iv.labs.arxiv.org/html/2302.04206
hashtags:
- '#space'
- '#sun'
- '#nuclearfusion'
tags:
- sun
- nuclear fusion
- arthur eddington
- solar core
- astronomy
- physics
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
