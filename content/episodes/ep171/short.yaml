      small: Brightest Of All Time
- text: It completely smashed previous space records by being roughly seventy times brighter than any prior recorded burst.
  emphasis:
  - seventy times brighter
  - previous space records
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Swift_Observatory_spacecraft_model.png/1920px-Swift_Observatory_spacecraft_model.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
