- text: The resulting gamma-ray burst was officially dubbed the BOAT, standing for Brightest Of All Time.
  emphasis:
  - dubbed the BOAT
  - Brightest Of All Time
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/Fermi_telescope_illustration_04.jpg/1920px-Fermi_telescope_illustration_04.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
