- text: On October 9, 2022, a massive star located within the constellation Sagitta violently collapsed directly into a black
    hole.
  emphasis:
  - October 9, 2022
  - constellation Sagitta
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Sagitta_%28Annotated%29_%28sagitta-ann%29.tiff/lossy-page1-3840px-Sagitta_%28Annotated%29_%28sagitta-ann%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
