- text: The blinding flash was so intensely powerful that it temporarily saturated most gamma-ray space telescope detectors.
  emphasis:
  - temporarily saturated
  - gamma-ray space telescope detectors
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/James_Webb_Space_Telescope_%28artist%27s_impression%29_%28jwst_poster01%29.tiff/lossless-page1-3840px-James_Webb_Space_Telescope_%28artist%27s_impression%29_%28jwst_poster01%29.tiff.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
