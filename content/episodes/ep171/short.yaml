- https://www.esa.int/ESA_Multimedia/Images/2022/10/ESA_spacecraft_catch_the_brightest_ever_gamma-ray_burst
- https://web.archive.org/web/20221027024145/https://skyandtelescope.org/astronomy-news/brightest-gamma-ray-burst-yet-lit-up-the-sky/
