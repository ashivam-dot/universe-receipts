id: ep171
title: The Brightest Cosmic Explosion Ever Recorded
series: The Universe Is Terrifying
description: Discover GRB 221009A, the brightest gamma-ray burst in cosmic history, which shook Earth's upper atmosphere from
  two billion light-years away.
sources:
- https://en.wikipedia.org/wiki/GRB_221009A
