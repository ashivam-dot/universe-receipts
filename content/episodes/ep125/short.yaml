- text: Shaped nuclear charges blasted hot plasma directly against a heavy steel pusher plate.
  emphasis:
  - shaped nuclear charges
  - pusher plate
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/0c/Project-Orion_propulsion-module_section.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
