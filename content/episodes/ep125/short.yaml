  emphasis:
  - estimated specific impulse
  - 2,000 seconds
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/ProjectOrionConfiguration.png/960px-ProjectOrionConfiguration.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
