id: ep125
title: The Cold War Rocket Powered by Atomic Bombs
series: Mission Files
description: In 1958, Project Orion engineered a crewed interplanetary spacecraft driven by a rapid-fire sequence of atomic
  bomb detonations.
sources:
- https://en.wikipedia.org/wiki/Project_Orion_(nuclear_propulsion)
- https://web.archive.org/web/20230803165748/https://airandspace.si.edu/collection-objects/model-spacecraft-orion-nuclear-pulse/nasm_A19790892000
- http://large.stanford.edu/courses/2010/ph240/stetler2/
hashtags:
- '#space'
- '#projectorion'
- '#nasa'
tags:
- project orion
- nuclear propulsion
- freeman dyson
- ted taylor
- space exploration
- cold war
voice:
  voice: af_heart
  speed: 1.05
beats:
