    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Giant shock absorbers reduced extreme blast accelerations to just a few g's for the crew compartment.
  emphasis:
  - shock absorbers
  - few g's
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Project_Orion_Model.jpg/960px-Project_Orion_Model.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Project Orion Model.jpg
      credit: Air Force Research Laboratory
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Project_Orion_Model.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: A FEW G'S
      small: Crew compartment acceleration
- text: To keep atomic fireballs from vaporizing the plate, researchers discovered an unexpected fix.
  emphasis:
  - vaporizing
  - unexpected fix
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/3e/Ivy_Mike_%28Eniwetok-Atoll_-_31._Oktober_1952%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Ivy Mike (Eniwetok-Atoll - 31. Oktober 1952).jpg
      credit: Unknown authorUnknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Ivy_Mike_(Eniwetok-Atoll_-_31._Oktober_1952).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Spraying a thin film of oil between detonations prevented surface ablation entirely.
  emphasis:
  - film of oil
  - prevented surface ablation
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: THIN FILM OF OIL
      small: Prevented plate ablation
    motion: zoom_in
- text: The 1963 Test Ban Treaty canceled the program in 1964, ending the dream before a single launch.
  emphasis:
  - Test Ban Treaty
  - canceled
  sfx: whoosh
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
