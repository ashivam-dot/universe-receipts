id: ep203
title: The Asteroid That Snuck Past Earth
series: Near Misses
description: An SUV-sized asteroid passed just 1,830 miles above Earth in 2020, and astronomers were completely blind to it.
sources:
- https://en.wikipedia.org/wiki/2020_QG
- https://www.nasa.gov/solar-system/tiny-asteroid-buzzes-by-earth-the-closest-flyby-on-record/
- https://www.caltech.edu/about/news/ztf-finds-closest-known-asteroid-fly-earth
- https://www.scientificamerican.com/article/asteroid-makes-the-closest-earth-flyby-a-space-rock-has-ever-survived/
- https://www.space.com/asteroid-ciose-earth-flyby-orbit-change-2020-qg.html
- https://www.cbsnews.com/news/asteroid-2020qg-closest-fly-by-earth-on-record-nasa-astronomers/
- https://www.minorplanetcenter.net/db_search/show_object?object_id=2020+QG
