- text: On December 27, 2004, on the opposite side of the Milky Way, magnetic stress fractured its ultradense core in a massive
    starquake.
  emphasis:
  - Milky Way
  - starquake
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Neutron_star_magnetic_fields_simulation.jpg/3840px-Neutron_star_magnetic_fields_simulation.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
