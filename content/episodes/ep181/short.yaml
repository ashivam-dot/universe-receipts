    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: DECEMBER 27, 2004
      small: Milky Way Galaxy
- text: In a tenth of a second, the rupture released more energy than the Sun does in 150,000 years.
  emphasis:
  - tenth of a second
  - 150,000 years
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/94/SGR_1806-20_108530main_cloudballPrint.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
