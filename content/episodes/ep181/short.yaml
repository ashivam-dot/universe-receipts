    motion: pan_left
    focus_x: 0.31
    focus_y: 0.35
- text: Traveling 50,000 light-years, the burst momentarily matched the full Moon's brightness in gamma rays.
  emphasis:
  - 50,000 light-years
  - full Moon
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/2019-01-20_21-58MEZ_Vollmond_LRGB.jpg/3840px-2019-01-20_21-58MEZ_Vollmond_LRGB.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
