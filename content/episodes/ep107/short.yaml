id: ep107
title: Why the Sun Isn't Actually Yellow
series: Space Myths, Busted
description: The Sun appears yellow from Earth, but it is actually blindingly white. Discover how our atmosphere steals blue
  light to create this cosmic illusion.
sources:
- https://en.wikipedia.org/wiki/Sun
- https://www.spacedaily.com/d-the-sun-might-look-yellow-but-seen-from-space-without-an-atmosphere-filtering-its-light-the-sun-is-actually-white-and-the-yellow-color-we-see-from-earth-is-the-result-of-our-atmosphere-scatteri/
- https://scienceblog.com/the-sun-might-look-yellow-but-seen-from-space-without-an-atmosphere-filtering-its-light-the-sun-is-actually-white-and-the-yellow-color-we-see-from-earth-is-the-result-of-our-atmosphere-sca/
- https://nibble-app.com/blog/is-the-sun-yellow-or-white
- http://math.ucr.edu/home/baez/physics/General/BlueSky/blue_sky.html
- https://en.wikipedia.org/wiki/Rayleigh_scattering
hashtags:
- '#space'
- '#astronomy'
- '#sun'
tags:
- sun
- rayleigh scattering
- space facts
- atmosphere
- white sun
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: We have been drawing the Sun the wrong color our entire lives.
  emphasis:
  - wrong color
  - entire lives
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg/3840px-ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-47 Earth Sunset From the International Space Station.jpg
      credit: NASA/Jeff Williams
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-47_Earth_Sunset_From_the_International_Space_Station.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: For generations, children's drawings and even professional astronomers have classified our star as a yellow dwarf.
  emphasis:
  - yellow dwarf
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d3/Crab_by_Anna_Frodesiak_derived_from_Drawing_of_Cafe_Anna_back_room_2012_05_04.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Crab by Anna Frodesiak derived from Drawing of Cafe Anna back room 2012 05 04.jpg
      credit: Anna Frodesiak
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Crab_by_Anna_Frodesiak_derived_from_Drawing_of_Cafe_Anna_back_room_2012_05_04.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Yellow Dwarf
      small: Historical classification
- text: But astronauts aboard the International Space Station observe a brilliant, blindingly white disk set against black
    space.
  emphasis:
  - blindingly white disk
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Full_disk_of_the_Sun_%28eso1703e-comparisona%29.tiff/lossy-page1-1920px-Full_disk_of_the_Sun_%28eso1703e-comparisona%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Full disk of the Sun (eso1703e-comparisona).tiff
      credit: NASA/SDO, ALMA (ESO/NAOJ/NRAO)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Full_disk_of_the_Sun_(eso1703e-comparisona).tiff
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Surprisingly, the Sun’s actual peak emission is in the green portion of the visible spectrum.
  emphasis:
  - green portion
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/38/McCree-Kurve_1_DE_demo.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: McCree-Kurve 1 DE demo.png
      credit: Mrmw
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:McCree-Kurve_1_DE_demo.png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500 nm
      small: Peak solar wavelength
- text: Human eyes perceive this broad mixture of wavelengths as white because it stimulates all our color receptors simultaneously.
  emphasis:
  - perceive
  - all our color receptors
  visual:
    source: url
    url: https://live.staticflickr.com/7397/9543521907_9dfa97de4d_b.jpg
    credit:
      source: Flickr via Openverse
      title: Untitled
      credit: Han Cheng Yeh
      license: CC BY 2.0
      url: https://www.flickr.com/photos/26719227@N00/9543521907
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This yellow star we see from Earth is actually an atmospheric illusion called Rayleigh scattering.
  emphasis:
  - atmospheric illusion
  - Rayleigh scattering
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Baron_Rayleigh%2C_PB00682.jpg/1280px-Baron_Rayleigh%2C_PB00682.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Baron Rayleigh, PB00682.jpg
      credit: Walker (artist) (graphic artist)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Baron_Rayleigh,_PB00682.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Rayleigh Scattering
      small: Atmospheric illusion
- text: Nitrogen and oxygen molecules deflect blue light away, leaving the remaining direct sunlight appearing yellow to our
    eyes.
  emphasis:
  - deflect blue light
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/ISS066-E-25494_-_View_of_Earth.jpg/3840px-ISS066-E-25494_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS066-E-25494 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS066-E-25494_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This stolen blue light paints our sky, while the leftover rays make us believe our white star is golden.
  emphasis:
  - stolen blue light
  - white star is golden
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: OUR WHITE SUN
