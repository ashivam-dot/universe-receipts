  - twenty-six years
  - June 2015
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/46/Swift_Observatory_rendering_back_alpha_%28SVS13926%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
