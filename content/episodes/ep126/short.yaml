      small: binary orbital period
    motion: zoom_in
- text: After recorded outbursts in 1938 and 1956, Japan's [Ginga](/ʤˈinɡˈɑ/) satellite detected another awakening in 1989.
  emphasis:
  - Ginga satellite
  - '1989'
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Perseus_and_Centaurus_clusters.jpg/3840px-Perseus_and_Centaurus_clusters.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
