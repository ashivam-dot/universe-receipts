id: ep126
title: The Sleeping Black Hole That Outshone the Sky
series: The Universe Is Terrifying
description: V404 Cygni spent decades silently feeding on a companion star before waking up to unleash record-shattering X-ray
  blasts and wobbling relativistic jets.
