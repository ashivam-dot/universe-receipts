- text: Apollo astronauts brought back samples of anorthosite, a highly reflective, coarse-grained rock covering the lunar
    highlands.
  emphasis:
  - anorthosite
  - lunar highlands
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/AS15-86-11687_%2821495902168%29.jpg/3840px-AS15-86-11687_%2821495902168%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
