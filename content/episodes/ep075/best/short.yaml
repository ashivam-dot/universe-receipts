    focus_y: 0.3
    box:
    - 0.15
    - 0.05
    - 0.95
    - 0.48
- text: Scientists believed the entire Moon once had a global magma ocean, where these light crystals floated to the top.
  emphasis:
  - magma ocean
  - floated to the top
  sfx: whoosh
  visual:
    reuse: 2
    motion: zoom_out
    focus_x: 0.55
    focus_y: 0.3
- text: To study this primordial crust, geologists compared it to similar rock deposits in Canada and Scandinavia.
  emphasis:
  - Canada and Scandinavia
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Marcy_Anorthosite_%28Mesoproterozoic%2C_1.16_Ga%3B_Route_3_roadcut_southwest_of_Saranac_Lake%2C_New_York_State%2C_USA%29_60.jpg/1920px-Marcy_Anorthosite_%28Mesoproterozoic%2C_1.16_Ga%3B_Route_3_roadcut_southwest_of_Saranac_Lake%2C_New_York_State%2C_USA%29_60.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Marcy Anorthosite (Mesoproterozoic, 1.16 Ga; Route 3 roadcut southwest of Saranac Lake, New York State, USA)
        60.jpg
      credit: James St. John
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Marcy_Anorthosite_(Mesoproterozoic,_1.16_Ga;_Route_3_roadcut_southwest_of_Saranac_Lake,_New_York_State,_USA)_60.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But a 2011 study re-dated lunar Sample 60025 to just 4.36 billion years old.
  emphasis:
  - Sample 60025
  - 4.36 billion years
  sfx: riser
  visual:
    source: card
    card:
      kind: dateline
      big: 4.36 Billion Years
      small: Lunar Sample 60025
    motion: zoom_in
- text: This young age shattered the theory of a single, rapidly cooling global magma ocean.
  emphasis:
  - shattered the theory
  - magma ocean
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: Too Young
      small: Magma ocean challenged
    motion: zoom_in
- text: Now, scientists are debating whether the Moon's crust actually built up slowly through multiple volcanic episodes.
  emphasis:
  - multiple volcanic episodes
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Igneous_rock_eng_modified.jpg/1280px-Igneous_rock_eng_modified.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
