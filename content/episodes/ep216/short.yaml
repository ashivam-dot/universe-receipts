id: ep216
title: The Earth Escape Velocity Myth
series: Space Myths, Busted
description: Discover why you do not need 25,000 miles per hour to escape Earth's gravity.
sources:
- https://en.wikipedia.org/wiki/Escape_velocity
- https://physicsfundamentals.org/blog/escape-velocity
- https://physicstribune.com/gravity/escape-velocity/
- https://physicsfundamentalsz.com/blog/escape-velocity/
- https://physicsfundamentalsinfo.com/blog/mechanics/escape-velocity/
- https://mechsimulator.com/tools/escape-velocity/
- https://arjunschool.com/physics/escape-velocity
hashtags:
- '#space'
- '#escapevelocity'
- '#nasa'
tags:
- escape velocity
- gravity
- rockets
- physics
- space myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: You do not need 25,000 miles per hour to escape Earth.
  emphasis:
  - 25,000 miles per hour
  - escape Earth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/1920px-The_Earth_seen_from_Apollo_17.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Earth seen from Apollo 17.jpg
      credit: NASA/Apollo 17 crew; taken by either Harrison Schmitt or Ron Evans
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Earth_seen_from_Apollo_17.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 25,000 mph
      small: Surface escape speed
- text: That terrifying speed limit is actually just a mathematical shortcut for a single unpowered ballistic burst.
  emphasis:
  - terrifying speed limit
  - unpowered ballistic burst
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/3b/SaturnV_S-IVB.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: SaturnV S-IVB.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:SaturnV_S-IVB.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: If you fire a projectile and let gravity do all the work, you genuinely need 11.2 kilometers per second.
  emphasis:
  - let gravity do all the work
  - 11.2 kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Apollo_11_Launch_-_GPN-2000-000630.jpg/1920px-Apollo_11_Launch_-_GPN-2000-000630.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo 11 Launch - GPN-2000-000630.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Apollo_11_Launch_-_GPN-2000-000630.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 11.2 km/s
      small: Unpowered launch requirement
- text: But spacecraft are not simple cannonballs.
  emphasis:
  - not simple cannonballs
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/STS120LaunchHiRes-edit1.jpg/1280px-STS120LaunchHiRes-edit1.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: STS120LaunchHiRes-edit1.jpg
      credit: NASA; edited by jjron (tilt corrected)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS120LaunchHiRes-edit1.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: By keeping their powerful engines burning, they can climb slowly at a leisurely walking pace and still slip away completely.
  emphasis:
  - engines burning
  - slip away completely
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/STS-134_International_Space_Station_after_undocking.jpg/3840px-STS-134_International_Space_Station_after_undocking.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: STS-134 International Space Station after undocking.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS-134_International_Space_Station_after_undocking.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Escape velocity is not a strict speed limit you must break, but merely an underlying energy bill.
  emphasis:
  - not a strict speed limit
  - underlying energy bill
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/96/Periods_Slika_02_b.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Periods Slika 02 b.jpg
      credit: Ivan T.
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Periods_Slika_02_b.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Thanks to continuous thrust provided by onboard propellants, you never have to pay that massive bill all at once.
  emphasis:
  - continuous thrust
  - all at once
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: 25,000 MPH IS A MYTH
