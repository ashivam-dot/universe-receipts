id: ep216
title: The Escape Velocity Myth
series: Space Myths, Busted
description: Discover why the famous 25,000 miles per hour speed limit is only true if you stop your engines.
sources:
- https://en.wikipedia.org/wiki/Escape_velocity
- https://physicsfundamentals.org/blog/escape-velocity
- https://physicstribune.com/gravity/escape-velocity/
- https://physicsfundamentalsz.com/blog/escape-velocity/
- https://physicsfundamentalsinfo.com/blog/mechanics/escape-velocity/
- https://mechsimulator.com/tools/escape-velocity/
- https://arjunschool.com/physics/escape-velocity
hashtags:
- '#space'
- '#physics'
- '#nasa'
tags:
- escape velocity
- gravity
- rocketry
- astrophysics
- space myths
- Isaac Newton
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: You do not need 25,000 miles per hour to escape Earth.
  emphasis:
  - 25,000 miles per hour
  - escape Earth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/The_Blue_Marble_4463x4163.jpg/3840px-The_Blue_Marble_4463x4163.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Blue Marble 4463x4163.jpg
      credit: NASA. Photo taken by either Harrison Schmitt or Ron Evans (of the Apollo 17 crew).
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Blue_Marble_4463x4163.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 25,000 mph
      small: Commonly cited limit
- text: That massive speed is only required if you use a single unpowered launch boost.
  emphasis:
  - massive speed
  - unpowered launch boost
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/0f/KSC-95EC-0911.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: KSC-95EC-0911.jpg
      credit: Unknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:KSC-95EC-0911.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: If you fire a projectile and let gravity do all the work, you genuinely need 11.2 kilometers per second.
  emphasis:
  - 11.2 kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Apollo_11_Launch_-_GPN-2000-000630.jpg/1920px-Apollo_11_Launch_-_GPN-2000-000630.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo 11 Launch - GPN-2000-000630.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Apollo_11_Launch_-_GPN-2000-000630.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 11.2 km/s
      small: Unpowered ballistic speed
- text: But modern rockets are not unpowered cannonballs designed for a single blast.
  emphasis:
  - modern rockets
  - cannonballs
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Space_Shuttle_Columbia_launching.jpg/3840px-Space_Shuttle_Columbia_launching.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Space Shuttle Columbia launching.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Space_Shuttle_Columbia_launching.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: By keeping their engines burning, they can climb at a leisurely walking pace and still slip away completely.
  emphasis:
  - walking pace
  - slip away
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/ISS031-E-103470_-_View_of_Earth.jpg/3840px-ISS031-E-103470_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS031-E-103470 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, Lyndon B. Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS031-E-103470_-_View_of_Earth.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Escape velocity is simply the total energy cost needed to leave Earth for good.
  emphasis:
  - energy cost
  - leave Earth
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 5
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Thanks to continuous thrust, you do not have to pay that steep gravity bill all at once.
  emphasis:
  - continuous thrust
  - gravity bill
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/29/Voyager_spacecraft.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Voyager spacecraft.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Voyager_spacecraft.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This is why you do not need 25,000 miles per hour to escape Earth.
  emphasis:
  - why you do not need
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: THE 25,000 MPH MYTH
