id: ep139
title: The Cosmic Explosion Brighter Than Twenty Galaxies
series: The Universe Is Terrifying
description: Discover ASASSN-15lh, a mysterious cosmic explosion that outshined the Milky Way twenty times over and radiates
  more energy than the Sun's entire lifetime.
sources:
- https://en.wikipedia.org/wiki/ASASSN-15lh
- https://www.scientificamerican.com/article/found-the-most-powerful-supernova-ever-seen/
