id: ep221
title: How the Suicide Squad Built NASA's Space Center
series: Mission Files
description: In 1936, a group of student rocketeers nicknamed the Suicide Squad was kicked off campus for dangerous explosions.
  They moved to a dry riverbed and built what became NASA's Jet Propulsion Laboratory.
