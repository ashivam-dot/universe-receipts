id: ep474
title: The Bizarre Reason Saturn's Rings Keep Vanishing
series: Scale Breaker
format: v3
description: Saturn's massive rings span tens of thousands of miles across space, but spacecraft revealed they are razor-thin.
  Every fifteen years, Earth aligns edge-on with the disk, making the giant rings vanish from view.
