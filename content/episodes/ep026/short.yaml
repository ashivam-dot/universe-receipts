    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Flaring_red_dwarf_star_%28artist%27s_impression%29_%28opo1102a%29.tiff/lossy-page1-3840px-Flaring_red_dwarf_star_%28artist%27s_impression%29_%28opo1102a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
