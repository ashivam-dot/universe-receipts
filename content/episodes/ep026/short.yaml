    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Located in the southern constellation Centaurus, Proxima Centauri is a small, low-mass red dwarf star.
  emphasis:
  - southern constellation
  - red dwarf star
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/A_Comparison_of_Star_Sizes.jpg/960px-A_Comparison_of_Star_Sizes.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A Comparison of Star Sizes.jpg
      credit: NASA, ESA and A. Feild (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:A_Comparison_of_Star_Sizes.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.35
    focus_y: 0.45
- text: It has a mass that is only about 10 percent of the Sun's mass.
  emphasis:
  - only about 10 percent
  - Sun's mass
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Neon_Abundance_in_Nearby_Stars-_Chandra_Discovery_Solves_Solar_Paradox_%282005-neon_-_neon%29.tiff/lossy-page1-1920px-Neon_Abundance_in_Nearby_Stars-_Chandra_Discovery_Solves_Solar_Paradox_%282005-neon_-_neon%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
