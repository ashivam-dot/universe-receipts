    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 10 PERCENT
      small: Solar mass
- text: The star's interior is fully convective, meaning it will shine for trillions of years.
  emphasis:
  - fully convective
  - trillions of years
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/New_shot_of_Proxima_Centauri%2C_our_nearest_neighbour_%2810581847073%29.jpg/960px-New_shot_of_Proxima_Centauri%2C_our_nearest_neighbour_%2810581847073%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: New shot of Proxima Centauri, our nearest neighbour (10581847073).jpg
