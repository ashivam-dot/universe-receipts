id: ep122
title: The Blue Planet That Rains Sideways Glass
series: The Universe Is Terrifying
description: HD 189733 b looks like a peaceful blue marble from afar, but its atmosphere is a scorching inferno. Powerful
  winds whip molten silicate particles sideways through toxic clouds.
sources:
- https://en.wikipedia.org/wiki/HD_189733_b
- https://sciencetrace.com/scientific-breakthroughs/scientists-discovered-a-planet-where-it-rains-glass-sideways
- https://www.sciencetimes.com/articles/51168/20240709/exoplanet-glass-rain-rotten-egg-hydrogen-sulfide-hd-189733-b.htm
- https://arxiv.org/abs/astro-ph/0510119
- https://www.jpl.nasa.gov/news/nasas-spitzer-first-to-crack-open-light-of-faraway-worlds/
hashtags:
