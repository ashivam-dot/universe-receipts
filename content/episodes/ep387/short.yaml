id: ep387
title: Rosetta's 2 MPH Comet Landing
series: Mission Files
format: v3
description: Rosetta spent ten years chasing Comet 67P across billions of miles. In 2016, the spacecraft ended its historic
  mission by gently descending onto the comet at two miles per hour.
