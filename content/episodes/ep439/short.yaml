id: ep439
title: The Disappearing Mega-Storm on Neptune
series: Mission Files
format: v3
description: When Voyager 2 flew past Neptune in 1989, it photographed an Earth-sized mega-storm called the Great Dark Spot.
  Just five years later, the giant storm was gone.
