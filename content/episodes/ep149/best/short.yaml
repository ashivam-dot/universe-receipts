id: ep149
title: What If the Sun Became a Black Hole?
series: Space Myths, Busted
description: Discover what would actually happen to Earth if the Sun turned into a black hole of the exact same mass.
sources:
- https://en.wikipedia.org/wiki/Black_hole
- https://science.nasa.gov/universe/black-holes/
hashtags:
- '#space'
- '#blackhole'
- '#nasa'
tags:
- black hole
- Sun
- Earth orbit
- gravity
- astronomy
- science myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Earth would keep orbiting if the Sun became a black hole.
  emphasis:
  - keep orbiting
  - black hole
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/SDO%27s_Ultra-high_Definition_View_of_2012_Venus_Transit_--_Path_Sequence.jpg/3840px-SDO%27s_Ultra-high_Definition_View_of_2012_Venus_Transit_--_Path_Sequence.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: SDO's Ultra-high Definition View of 2012 Venus Transit -- Path Sequence.jpg
      credit: NASA/SDO, AIA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:SDO%27s_Ultra-high_Definition_View_of_2012_Venus_Transit_--_Path_Sequence.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Most people assume a stellar collapse creates an instant cosmic vacuum cleaner.
  emphasis:
  - stellar collapse
  - cosmic vacuum cleaner
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d4/Keplers_supernova.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Keplers supernova.jpg
      credit: NASA/ESA/JHU/R.Sankrit & W.Blair
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Keplers_supernova.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: A black hole is an astronomical body so compact that its gravity prevents anything, including light, from escaping.
  emphasis:
  - so compact
  - prevents anything
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/ab/Black_hole_%28NASA%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Black hole (NASA).jpg
      credit: NASA/D. Berry
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Black_hole_(NASA).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: NO ESCAPE
      small: Event horizon boundary
- text: The boundary of no escape around a black hole is called the event horizon.
  emphasis:
  - event horizon
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Black_hole_-_Messier_87_crop_max_res.png/3840px-Black_hole_-_Messier_87_crop_max_res.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Black hole - Messier 87 crop max res.png
      credit: Event Horizon Telescope
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Black_hole_-_Messier_87_crop_max_res.png
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Yet from far away, the external gravitational field of a black hole is identical to that of any other body of the
    same mass.
  emphasis:
  - gravitational field
  - identical
  sfx: riser
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: SAME MASS
      small: Identical gravity field
    motion: zoom_in
- text: Our solar system would get much colder because the black hole emits no visible sunlight, but the planets would stay
    in their orbits.
  emphasis:
  - much colder
  - stay in their orbits
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Illustration_of_Cygnus_X-1_%282011-cygx1-more-1%29.tiff/lossy-page1-3840px-Illustration_of_Cygnus_X-1_%282011-cygx1-more-1%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Illustration of Cygnus X-1 (2011-cygx1-more-1).tiff
      credit: '(Credit: NASA/CXC/M.Weiss)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Illustration_of_Cygnus_X-1_(2011-cygx1-more-1).tiff
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Earth would keep orbiting normally.
  emphasis:
  - keep orbiting normally
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: SUN TURNS TO BLACK HOLE
