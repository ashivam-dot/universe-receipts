id: ep149
title: The Black Hole Vacuum Cleaner Myth
series: Space Myths, Busted
description: Discover what would actually happen if our Sun became a black hole. It turns out gravity doesn't work like a
  vacuum cleaner.
sources:
- https://en.wikipedia.org/wiki/Black_hole
- https://science.nasa.gov/universe/black-holes/
hashtags:
- '#space'
- '#blackhole'
- '#nasa'
tags:
- black hole
- Sun
- Earth
- gravity
- myth
- NASA
- astronomy
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Most people assume a stellar collapse creates an instant cosmic vacuum cleaner.
  emphasis:
  - stellar collapse
  - vacuum cleaner
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Hubble_Space_Telescope-_Kepler%27s_Supernova_Remnant_%28visible-light_data%29_%28opo0429i%29.tiff/lossy-page1-1280px-Hubble_Space_Telescope-_Kepler%27s_Supernova_Remnant_%28visible-light_data%29_%28opo0429i%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble Space Telescope- Kepler's Supernova Remnant (visible-light data) (opo0429i).tiff
      credit: NASA, ESA, R. Sankrit and W. Blair (Johns Hopkins University)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Space_Telescope-_Kepler%27s_Supernova_Remnant_(visible-light_data)_(opo0429i).tiff
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: A black hole is indeed so dense that not even light can escape its gravitational grip.
  emphasis:
  - so dense
  - light can escape
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Anatomy_of_a_Black_Hole.jpg/3840px-Anatomy_of_a_Black_Hole.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Anatomy of a Black Hole.jpg
      credit: European Southern Observatory - ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Anatomy_of_a_Black_Hole.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: NO ESCAPE
      small: Light cannot escape
- text: The boundary of no escape is the event horizon, but its reach is surprisingly limited.
  emphasis:
  - event horizon
  - surprisingly limited
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/A_view_of_the_M87_supermassive_black_hole_in_polarised_light_%28eso2105a%29.jpg/1920px-A_view_of_the_M87_supermassive_black_hole_in_polarised_light_%28eso2105a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A view of the M87 supermassive black hole in polarised light (eso2105a).jpg
      credit: EHT Collaboration
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:A_view_of_the_M87_supermassive_black_hole_in_polarised_light_(eso2105a).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: From a distance, the gravitational field of a black hole is identical to any other body of the same mass.
  emphasis:
  - gravitational field
  - identical
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: IDENTICAL GRAVITY
      small: Determined by mass
    motion: zoom_in
- text: If you replaced the Sun with a black hole of equal mass, the physics of gravity wouldn't change.
  emphasis:
  - physics of gravity
  - wouldn't change
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: ONE SOLAR MASS
      small: Mass remains constant
    motion: zoom_in
- text: While the solar system would grow dark and freezing, the actual path of our planet wouldn't move an inch.
  emphasis:
  - dark and freezing
  - wouldn't move an inch
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/NH-PlutoByMoonlight-ArtistConcept-20150710.jpg/1280px-NH-PlutoByMoonlight-ArtistConcept-20150710.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NH-PlutoByMoonlight-ArtistConcept-20150710.jpg
      credit: NASA/Johns Hopkins University Applied Physics Laboratory/Southwest Research Institute (JHUAPL/SwRI) => http://pluto.jhuapl.edu/Multimedia/Images/Artist-Renderings.php
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NH-PlutoByMoonlight-ArtistConcept-20150710.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Our planets would stay in their current orbits instead of getting sucked inside.
  emphasis:
  - stay in their current orbits
  - getting sucked inside
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: SUN TURNS TO BLACK HOLE
