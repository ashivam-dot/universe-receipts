      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Horsehead_Nebula_(NIRCam_image)_(weic2411d).jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers estimate this photo-evaporation will completely erase the pillar within five million years.
  emphasis:
  - five million years
  - completely erase
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Webb_Space_Telescope_View_of_the_Horsehead_Nebula_%28SVS31283%29.jpg/960px-Webb_Space_Telescope_View_of_the_Horsehead_Nebula_%28SVS31283%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
