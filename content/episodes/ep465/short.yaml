beats:
- text: The iconic Horsehead Nebula is slowly erasing itself into nothing.
  emphasis:
  - erasing itself
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d4/The_Horsehead_Nebula_%28eso0202b%29.jpg/960px-The_Horsehead_Nebula_%28eso0202b%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Horsehead Nebula (eso0202b).jpg
      credit: ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:The_Horsehead_Nebula_(eso0202b).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This massive tower of dust sits roughly fourteen hundred light-years away in Orion.
  emphasis:
  - fourteen hundred light-years
  - Orion
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Alnitak_%26_Orion%27s_Sword_%2853514488047%29.jpg/3840px-Alnitak_%26_Orion%27s_Sword_%2853514488047%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Alnitak & Orion's Sword (53514488047).jpg
      credit: gjdonatiello
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Alnitak_%26_Orion%27s_Sword_(53514488047).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: It stretches three light-years across, blocking the glowing hydrogen gas behind it.
  emphasis:
  - three light-years
  - hydrogen gas
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/IC_434_%2850982686502%29.jpg/1920px-IC_434_%2850982686502%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: IC 434 (50982686502).jpg
      credit: Carsten Frenzl from Deutschland
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:IC_434_(50982686502).jpg
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 3 light-years
      small: Pillar dimension
- text: A former Harvard maid named Williamina Fleming first spotted the silhouette in eighteen eighty-eight.
  emphasis:
  - Williamina Fleming
  - eighteen eighty-eight
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Williamina_Paton_Stevens_Fleming_circa_1890s.jpg/1280px-Williamina_Paton_Stevens_Fleming_circa_1890s.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Williamina Paton Stevens Fleming circa 1890s.jpg
      credit: Unknown authorUnknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Williamina_Paton_Stevens_Fleming_circa_1890s.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.4
    card:
      kind: dateline
      big: '1888'
      small: Harvard College Observatory
- text: Ultraviolet radiation from nearby stars is relentlessly carving into the dust.
  emphasis:
  - Ultraviolet radiation
  - carving into the dust
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Horsehead_Nebula_%28NIRCam_image%29_%28weic2411d%29.jpg/1920px-Horsehead_Nebula_%28NIRCam_image%29_%28weic2411d%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
