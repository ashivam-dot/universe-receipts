id: ep515
title: The NASA Lander That Cut Its Own Engines
series: Mission Files
format: v3
description: In December 1999, NASA lost contact with Mars Polar Lander during descent. Investigators discovered a mechanical
  leg vibration triggered premature engine shutdown 40 meters above the surface.
sources:
- https://en.wikipedia.org/wiki/Mars_Polar_Lander
- https://www.americaspace.com/2019/01/06/could-not-have-survived-20-years-since-nasas-ill-fated-mars-polar-lander/
- https://web.archive.org/web/20131226075519/http://www.pbs.org/newshour/bb/science/jan-june00/nasa_4-14.html
- https://azmth.space/mars/missions/mars-polar-lander
- https://web.archive.org/web/20060818152601/http://www.planetary.org/programs/projects/planetary_microphones/mars_microphone.html
- https://www.wired.com/1999/12/mars-lander-wont-phone-home/
hashtags:
- '#space'
- '#marspolarlander'
- '#nasa'
tags:
- mars polar lander
- nasa
- mars
- space exploration
- astronomy
- space accident
