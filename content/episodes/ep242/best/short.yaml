id: ep242
title: 'Pioneer 10: The First Scout to Jupiter'
series: Mission Files
description: In 1972, Pioneer 10 became the first spacecraft to navigate the asteroid belt and reach Jupiter. Carrying humanity's
  golden greeting card, it blazed a trail into interstellar space.
