- text: The International Astronomical Union demoted it in 2006 for failing to clear its orbital neighborhood.
  emphasis:
  - '2006'
  - clear its orbital neighborhood
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Discussions_-_IAU_General_Assembly_2006_%28DSC_5200%29.jpg/960px-Discussions_-_IAU_General_Assembly_2006_%28DSC_5200%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
