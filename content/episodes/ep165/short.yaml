  - closer to the Sun
  - Neptune
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Uranus%2C_Neptune%2C_and_their_moons_%282MASS%29_-_cropped.jpg/960px-Uranus%2C_Neptune%2C_and_their_moons_%282MASS%29_-_cropped.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
