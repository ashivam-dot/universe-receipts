id: ep165
title: Why Pluto Never Finished Its Orbit
series: Space Myths, Busted
description: Pluto was a planet for 76 years, but it has not even completed one trip around the Sun since its discovery in
  1930.
sources:
- https://en.wikipedia.org/wiki/Pluto
- http://nssdc.gsfc.nasa.gov/planetary/factsheet/plutofact.html
