id: ep413
title: The Ghost Module That Started the Space Station
series: Mission Files
format: v3
description: In 1998, the very first module of the International Space Station launched into orbit. Built in Russia and paid
  for by NASA, it flew uncrewed for eighteen months before astronauts moved in.
