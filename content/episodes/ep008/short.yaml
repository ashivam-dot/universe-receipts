id: ep008
title: The Terrifying Truth of Our Galaxy's Black Hole
series: The Universe Is Terrifying
description: The supermassive black hole at the center of our galaxy is a sleeping giant. When astronomers finally photographed
  Sagittarius A*, they couldn't even use the internet to send the data.
