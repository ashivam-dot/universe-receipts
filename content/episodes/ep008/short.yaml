    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: HARD DRIVES
      small: SHIPPED BY MAIL
- text: Discovered in 1974, Sagittarius A* is a supermassive black hole at our galactic center.
  emphasis:
  - Sagittarius A*
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Sagittarius_A_%28Chandra%29.jpg/960px-Sagittarius_A_%28Chandra%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Sagittarius A (Chandra).jpg
      credit: 'Credit: NASA/CXC/MIT/F.K.Baganoff et al.'
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Sagittarius_A_(Chandra).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.65
    focus_y: 0.53
    card:
      kind: dateline
      big: '1974'
      small: Sagittarius A* Discovered
- text: It has a mass about four million times our Sun, hidden behind thick cosmic dust.
  emphasis:
  - four million
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d5/Galactic_Center_in_Near-infrared_%28Hubble%29_%282021-053-01FJHRD1AK27XBK157T4N7DGM4%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Galactic Center in Near-infrared (Hubble) (2021-053-01FJHRD1AK27XBK157T4N7DGM4).png
      credit: 'SCIENCE: NASA, ESA, STScI, Q.D. Wang (UMass)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Galactic_Center_in_Near-infrared_(Hubble)_(2021-053-01FJHRD1AK27XBK157T4N7DGM4).png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: About 350 years ago, this quiet beast released a million times more energy than today.
  emphasis:
  - 350 years ago
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Scenario_for_Mysterious_Light_Beams_from_Active_Galaxy_%282020-58-4781%29.tif/lossy-page1-3840px-Scenario_for_Mysterious_Light_Beams_from_Active_Galaxy_%282020-58-4781%29.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
