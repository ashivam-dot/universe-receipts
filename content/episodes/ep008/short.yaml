      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Scenario_for_Mysterious_Light_Beams_from_Active_Galaxy_(2020-58-4781).tif
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.28
    focus_y: 0.4
- text: In 2017, the global Event Horizon Telescope captured the glowing ring around its shadow.
  emphasis:
  - glowing ring
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/ALMA_antennas_%28uhd_beletsky_alma_07%29.tiff/lossy-page1-3840px-ALMA_antennas_%28uhd_beletsky_alma_07%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ALMA antennas (uhd beletsky alma 07).tiff
      credit: ESO/Y. Beletsky
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:ALMA_antennas_(uhd_beletsky_alma_07).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.4
- text: But gas orbits this small target so fast that its appearance changed in mere minutes.
  emphasis:
  - mere minutes
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/NASA_Black_Hole_Visualization_Takes_Viewers_Beyond_the_Brink_%28SVS14576_-_FlyBy_Mollweide_Still_01830%29.jpg/3840px-NASA_Black_Hole_Visualization_Takes_Viewers_Beyond_the_Brink_%28SVS14576_-_FlyBy_Mollweide_Still_01830%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA Black Hole Visualization Takes Viewers Beyond the Brink (SVS14576 - FlyBy Mollweide Still 01830).jpg
