id: ep129
title: The Deep-Space Telescope Pointed Into Earth
series: Space Got Weird
description: Beneath the South Pole, the IceCube observatory turns a cubic kilometer of ice into a telescope that looks straight
  down through our planet.
sources:
- https://en.wikipedia.org/wiki/IceCube_Neutrino_Observatory
