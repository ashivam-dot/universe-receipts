id: ep510
title: The Astronaut Who Threw a Solar Panel into Space
series: Mission Files
format: v3
description: During NASA's STS-61 mission to repair the Hubble Space Telescope, astronaut Kathy Thornton manually jettisoned
  a damaged 350-pound solar array directly into orbit.
