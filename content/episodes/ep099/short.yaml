title: The Martian Mountain Taller Than Mount Everest
series: Scale Breaker
description: In the center of Gale Crater on Mars, Aeolis Mons towers higher than Mount Everest from base to peak. For over
  a decade, NASA's Curiosity rover has been slowly climbing its slopes.
