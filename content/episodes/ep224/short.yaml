- text: Most supermassive black holes act as thermostats, heating gas to prevent star formation.
  emphasis:
  - thermostats
  - prevent
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Galaxy_cluster_IDCS_J1426.jpg/1280px-Galaxy_cluster_IDCS_J1426.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Galaxy cluster IDCS J1426.jpg
      credit: NASA, ESA, and M. Brodwin (University of Missouri)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Galaxy_cluster_IDCS_J1426.jpg
