  emphasis:
  - unsustainable
  - hundred million
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Hubble_Sees_%27Comet_Galaxy%27_Being_Ripped_Apart_By_Galaxy_Cluster_%282007-12-2077%29.tiff/lossy-page1-1920px-Hubble_Sees_%27Comet_Galaxy%27_Being_Ripped_Apart_By_Galaxy_Cluster_%282007-12-2077%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
