    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Thermostats
      small: heating gas
- text: But the Phoenix Cluster, discovered in 2010, is a rule-breaking monster in the southern sky.
  emphasis:
  - Phoenix Cluster
  - rule-breaking
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/South_Pole_Telescope_%28Pano3-2017Aug14-South-Pole-360-DrMichalik-CC3%29.jpg/3840px-South_Pole_Telescope_%28Pano3-2017Aug14-South-Pole-360-DrMichalik-CC3%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
