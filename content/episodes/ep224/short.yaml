  - seven hundred
  - records
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/3a/SPT-CLJ2344%E2%80%934243_%28Phoenix_Cluster%29_Chandra.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
