  emphasis:
  - ten billion
  - fails
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/ab/Black_hole_%28NASA%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
