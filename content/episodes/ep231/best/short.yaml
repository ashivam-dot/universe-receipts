id: ep231
title: Why the Moon Hides its Far Side
series: Space Myths, Busted
description: The Moon isn't frozen; Earth's gravity braked its rotation to match its orbit perfectly through tidal locking.
sources:
- https://en.wikipedia.org/wiki/Tidal_locking
- https://scienceinsights.org/is-the-moon-tidally-locked-the-science-explained/
- https://www.earth-site.co.uk/Education/tidal-locking-moon-rotation/
- https://science.nasa.gov/moon/tidal-locking/
- http://www.universetoday.com/128350/will-earth-lock-moon/
- https://www.planetary.org/articles/1017-rapidly-rotating-regular-satellites-and-tides
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- tidal locking
- moon rotation
- gravity
- earth
- lunar science
- space myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The Moon is actually spinning on its axis right now.
  emphasis:
  - axis right now
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/df/Full_moon_partially_obscured_by_atmosphere.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Full moon partially obscured by atmosphere.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Full_moon_partially_obscured_by_atmosphere.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.51
- text: Many believe it stays still because we only ever see one face.
  emphasis:
  - one face
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/NASA_Goddard_Photo_and_Video_-_First_Quarter_%28by%29.jpg/1920px-NASA_Goddard_Photo_and_Video_-_First_Quarter_%28by%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA Goddard Photo and Video - First Quarter (by).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:NASA_Goddard_Photo_and_Video_-_First_Quarter_(by).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: If it didn't rotate, we would see the lunar far side every single month.
  emphasis:
  - far side
  sfx: whoosh
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Far_side_of_the_Moon_close_up_for_Lunar_Crater_Radio_Telescope.png/1920px-Far_side_of_the_Moon_close_up_for_Lunar_Crater_Radio_Telescope.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Far side of the Moon close up for Lunar Crater Radio Telescope.png
      credit: Wikideas1
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Far_side_of_the_Moon_close_up_for_Lunar_Crater_Radio_Telescope.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Instead, Earth’s gravity has spent billions of years braking the Moon’s spin.
  emphasis:
  - braking
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Moon_apsidal_precession.png/1280px-Moon_apsidal_precession.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon apsidal precession.png
      credit: Rfassbind
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moon_apsidal_precession.png
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: This invisible grip created solid tidal bulges, using friction to slow the rotation.
  emphasis:
  - tidal bulges
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/PSM_V74_D529_Relationship_between_tidal_forces_the_moon_and_latitude.png/960px-PSM_V74_D529_Relationship_between_tidal_forces_the_moon_and_latitude.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PSM V74 D529 Relationship between tidal forces the moon and latitude.png
      credit: Unknown authorUnknown author
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PSM_V74_D529_Relationship_between_tidal_forces_the_moon_and_latitude.png
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Now, the Moon completes one rotation in about twenty-seven point three days to match its orbit.
  emphasis:
  - orbit
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Once_in_a_Super_Blue_Moon_%28LROC1309%29.jpg/960px-Once_in_a_Super_Blue_Moon_%28LROC1309%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Once in a Super Blue Moon (LROC1309).jpg
      credit: NASA/GSFC/Arizona State University
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Once_in_a_Super_Blue_Moon_(LROC1309).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 27.3 days
      small: Rotation period
- text: This cosmic anchor is so powerful it even slows Earth’s day by two milliseconds every century.
  emphasis:
  - two milliseconds
  visual:
    source: card
    card:
      kind: fact
      big: 2 milliseconds
      small: Day lengthening
    motion: zoom_in
- text: Our planet is losing this tug-of-war as the Moon spirals away by four centimeters every year.
  emphasis:
  - four centimeters
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Apollo_11_Lunar_Laser_Ranging_Experiment.jpg/1920px-Apollo_11_Lunar_Laser_Ranging_Experiment.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Apollo 11 Lunar Laser Ranging Experiment.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Apollo_11_Lunar_Laser_Ranging_Experiment.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.4
    box:
    - 0.38
    - 0.3
    - 0.62
    - 0.5
    card:
      kind: fact
      big: 4 centimeters
      small: Annual recession
- text: It is a perpetual, balanced cycle that explains why our neighbor is turning.
  emphasis:
  - turning
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.51
