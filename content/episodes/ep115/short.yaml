id: ep115
title: The Myth of the Bottomless Lunar Quicksand
series: Space Myths, Busted
description: Early scientists feared the Moon would swallow the first astronauts, but the real surface turned out to be an
  electrifying dust fountain.
sources:
- https://littleastronomy.com/surveyor-missions/
- http://www.psrd.hawaii.edu/July19/Apollo11-discoveries.html
- https://en.wikipedia.org/wiki/Lunar_lander
- https://en.wikipedia.org/wiki/Lunar_regolith
- https://web.archive.org/web/20100319112529/http://science.nasa.gov/headlines/y2005/30mar_moonfountains.htm
hashtags:
- '#space'
- '#apollo'
- '#nasa'
tags:
- lunar soil
- moon landing
- Thomas Gold
- Surveyor program
- electrostatic levitation
- Apollo 17
- space mystery
voice:
  voice: af_heart
  speed: 1.05
