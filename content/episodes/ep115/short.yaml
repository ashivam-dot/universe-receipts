    focus_x: 0.5
    focus_y: 0.5
- text: To solve the mystery, NASA launched the Surveyor program to touch the surface before humans did.
  emphasis:
  - Surveyor program
  - touch the surface
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Lunar_Lander%2C_Surveyor_-_DPLA_-_d6accc3d89e8efa6f2e88962941bf43a_%28page_8%29.jpg/1280px-Lunar_Lander%2C_Surveyor_-_DPLA_-_d6accc3d89e8efa6f2e88962941bf43a_%28page_8%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
