- text: Solar radiation strips electrons from the soil, creating electrostatic charges that launch dust kilometers into the
    sky.
  emphasis:
  - electrostatic charges
  - kilometers
  sfx: whoosh
  visual:
    source: url
    url: https://www.artic.edu/iiif/2/478e9df5-6d98-39b2-8610-970a6067cc16/full/1686,/0/default.jpg
    credit:
