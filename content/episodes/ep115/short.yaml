    focus_x: 0.5
    focus_y: 0.5
- text: In the 1960s, Cornell astronomer Thomas Gold warned that lunar dust was deep enough to swallow any spacecraft.
  emphasis:
  - Thomas Gold
  - swallow
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Admiral_Byrd_admires_medal_awarded_to_aide_on_Antarctic_expedition._Washington%2C_D.C.%2C_April_27._Rear_Admiral_Richard_E._Byrd_admires_the_gold_medal_of_the_National_Geographic_Society_which_LCCN2016877888_%28Poulter_crop%29.jpg/1920px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Admiral Byrd admires medal awarded to aide on Antarctic expedition. Washington, D.C., April 27. Rear Admiral
        Richard E. Byrd admires the gold medal of the National Geographic Society which LCCN2016877888 (Poulter crop).jpg
