      title: Lunar Law, No. 1
      credit: 'Charles Meryon

        French, 1821-1868'
      license: CC0
      url: https://www.artic.edu/artworks/74058
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Kilometers High
      small: Dust Levitation
- text: Apollo 17 astronauts even sketched these towering rays of levitating glass shards during their final mission.
  emphasis:
  - levitating glass shards
  - towering rays
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/72/Apollo_17_twilight_ray_sketch.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
