id: ep119
title: The City-Killer Hiding in the Sun
series: Near Misses
description: In July 2023, a 200-foot asteroid swept past Earth completely undetected because it approached directly out of
  the solar glare. Early warning telescopes only spotted it two days after its closest approach.
sources:
- https://en.wikipedia.org/wiki/2023_NT1
- https://www.livescience.com/space/asteroids/a-skyscraper-size-asteroid-flew-closer-to-earth-than-the-moon-and-scientists-didnt-notice-until-2-days-later
- https://www.independent.co.uk/space/asteroid-earth-moon-nasa-2023-nt1-b2376657.html
- https://earthsky.org/space/asteroid-2023-nt1-close-call-earth-july-13-2023/
- https://www.earth.com/space/close-encounter-giant-asteroid-slipped-by-earth-last-week-evading-detection/
- https://www.popsci.com/science/asteroid-nt1-earth-planetary-defense/
- https://arxiv.org/abs/2310.13112
hashtags:
- '#space'
- '#asteroid'
- '#astronomy'
tags:
- asteroid
- 2023 NT1
- planetary defense
- astronomy
- space mystery
- ATLAS telescope
- Chelyabinsk
