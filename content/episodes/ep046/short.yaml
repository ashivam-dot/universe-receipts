    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In nineteen sixty-seven, the United States launched military Vela satellites to catch banned atomic tests in space.
  emphasis:
  - nineteen sixty-seven
  - Vela satellites
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/HD.6D.265_%2810824400184%29.jpg/1920px-HD.6D.265_%2810824400184%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: HD.6D.265 (10824400184).jpg
      credit: ENERGY.GOV
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:HD.6D.265_(10824400184).jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Sensors soon detected a mysterious flash of gamma radiation that matched no known weapon signature.
  emphasis:
  - mysterious flash
  - gamma radiation
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/69/GRB_artist_NASA_Zhang_Woosley.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: GRB artist NASA Zhang Woosley.jpg
      credit: NASA/Zhang & Woosley
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:GRB_artist_NASA_Zhang_Woosley.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: The discovery stayed strictly classified for six years until researchers finally published the data in nineteen seventy-three.
  emphasis:
  - strictly classified
  - nineteen seventy-three
  sfx: riser
  visual:
    source: card
    card:
      kind: dateline
      big: '1973'
      small: Declassified Data
    motion: zoom_in
- text: These gamma-ray bursts erupt when massive stars collapse or dense neutron stars collide in deep space.
  emphasis:
  - massive stars collapse
  - neutron stars collide
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Artist%E2%80%99s_impression_of_merging_neutron_stars_%28eso1733s%29.tiff/lossy-page1-3840px-Artist%E2%80%99s_impression_of_merging_neutron_stars_%28eso1733s%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist’s impression of merging neutron stars (eso1733s).tiff
      credit: University of Warwick/Mark Garlick
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_merging_neutron_stars_(eso1733s).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: A single event releases more energy in seconds than our Sun will produce in its entire ten billion year life.
  emphasis:
  - more energy in seconds
  - ten billion year life
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/HyperNova.tif/lossy-page1-1920px-HyperNova.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: HyperNova.tif
      credit: NASA/GSFC/Dana Berry
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:HyperNova.tif
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 10 Billion Years
      small: Sun's Total Life Energy
- text: Orbiting observatories now detect roughly one of these cosmic flashes every day across the universe.
  emphasis:
  - roughly one
  - every day
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/b7/Fermi_Gamma-ray_Space_Telescope_spacecraft_model.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
