    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: That is how hunting for secret nuclear bombs revealed the universe's brightest explosions.
  emphasis:
  - secret nuclear bombs
  - brightest explosions
