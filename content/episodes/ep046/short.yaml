- text: The universe's brightest explosions were found hunting for secret nuclear bombs.
  emphasis:
  - brightest explosions
  - secret nuclear bombs
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/59/HD.6D.267_%2810824623453%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
