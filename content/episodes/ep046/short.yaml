id: ep046
title: The Cosmic Flashes Found by Cold War Satellites
series: Space Got Weird
description: Discover how Cold War satellites searching for secret nuclear tests accidentally stumbled upon gamma-ray bursts,
  the brightest explosions in the universe.
sources:
- https://en.wikipedia.org/wiki/History_of_gamma-ray_burst_research
- https://en.wikipedia.org/wiki/GRB_670702
- https://heasarc.gsfc.nasa.gov/docs/cgro/epo/vu/overview/bursts/bursts.html
- https://scienceinsights.org/what-is-a-grb-the-universes-most-powerful-explosions/
- https://arxiv.org/abs/2006.07251
hashtags:
- '#space'
- '#astronomy'
- '#nasa'
tags:
- gamma-ray burst
- space got weird
- cold war
- vela satellites
- astrophysics
- universe
