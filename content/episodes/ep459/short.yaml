id: ep459
title: How a Hammer Failed to Save NASA's First Color Moon TV
series: Mission Files
format: v3
description: During Apollo 12 in 1969, NASA brought its first live color TV camera to the Moon. When astronaut Alan Bean accidentally
  pointed it at the Sun, he tried fixing the ruined broadcast with a hammer.
