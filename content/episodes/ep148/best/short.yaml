    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 2 Instruments
      small: Active tools remaining
- text: And to think, when this probe launched back in 1977,
  emphasis:
  - launched back
  - '1977'
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
