id: ep148
title: Voyager 1's Deep Space Survival
series: Scale Breaker
description: How Voyager 1 outlived its five-year design to become humanity's most distant emissary in interstellar space.
sources:
- https://web.archive.org/web/20221210180431/http://www.nasa.gov/centers/goddard/news/topstory/2003/1105voyager_facts.html
- https://web.archive.org/web/20131104221550/http://www.smithsonianmag.com/science-nature/Timothy-Ferris-on-Voyagers-Never-Ending-Journey.html
- https://en.wikipedia.org/wiki/Voyager_1
- https://www.universetoday.com/104717/its-official-voyager-1-is-now-in-interstellar-space/
- https://www.scientificamerican.com/article/nasas-voyager-1-spacecraft-down-to-just-two-working-science-instruments/
