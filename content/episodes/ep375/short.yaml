    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c5/Black_Hole_Triggering_Star_Formation_in_Henize_2-10_%282022-002%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
