id: ep458
title: Jupiter's Storm Is Deeper Than You Think
series: Scale Breaker
format: v3
description: Jupiter's iconic Great Red Spot isn't just a surface cloud feature; new data shows it reaches deep into the gas
  giant's atmosphere.
