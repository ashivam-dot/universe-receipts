id: ep458
title: Jupiter's Storm Plunges 200 Miles Deep
series: Scale Breaker
format: v3
description: Jupiter's iconic Great Red Spot isn't just a surface cloud feature. NASA's Juno mission revealed the storm plunges
  hundreds of miles into the planet's deep atmosphere.
