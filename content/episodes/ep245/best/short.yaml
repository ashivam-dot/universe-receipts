    motion: zoom_in
    focus_x: 0.25
    focus_y: 0.28
    box:
    - 0.03
    - 0.04
    - 0.46
    - 0.52
- text: Dayside temperatures soar to over forty-six hundred degrees Fahrenheit, thermalizing the atmosphere so no clouds can
    form.
  emphasis:
  - forty-six hundred degrees
  - no clouds can form
  visual:
    source: card
    card:
      kind: fact
      big: "4,600 \x80F"
      small: Extreme dayside temperatures
    motion: zoom_in
- text: Hubble observations revealed that its superheated gas is actively spilling onto the star.
  emphasis:
  - Hubble observations
  - spilling onto the star
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_%2827512134324%29.jpg/3840px-Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_%2827512134324%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
