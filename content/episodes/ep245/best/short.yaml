- text: Enormous tidal forces have stretched this swollen world into a distorted egg shape.
  emphasis:
  - tidal forces
  - egg shape
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Artist%E2%80%99s_View_of_Extrasolar_Planet_WASP-12b_v2.png/3840px-Artist%E2%80%99s_View_of_Extrasolar_Planet_WASP-12b_v2.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
