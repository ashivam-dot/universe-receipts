- text: The exoplanet orbits just two million miles from its host, locking one side in permanent day.
  emphasis:
  - two million miles
  - permanent day
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Light_Curve_of_a_Planet_Transiting_Its_Star.jpg/1920px-Light_Curve_of_a_Planet_Transiting_Its_Star.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
