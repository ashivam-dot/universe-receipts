- text: Discovered in 2008, the hot Jupiter known as WASP-12b whips around its star in roughly twenty-six hours.
  emphasis:
  - discovered in 2008
  - twenty-six hours
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e8/Forecasting_Weather_on_Distant_Worlds.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
