      source: Wikimedia Commons
      title: Hubble Space Telescope Grappled by Shuttle Arm (27512134324).jpg
      credit: NASA Hubble Space Telescope
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Space_Telescope_Grappled_by_Shuttle_Arm_(27512134324).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Tidal friction is draining its orbital energy, shrinking its year by milliseconds annually.
  emphasis:
  - orbital energy
  - shrinking its year
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Roque_de_los_Muchachos_Observatory_at_La_Palma_%28lapalma_summit_rnh1%29.jpg/1280px-Roque_de_los_Muchachos_Observatory_at_La_Palma_%28lapalma_summit_rnh1%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
