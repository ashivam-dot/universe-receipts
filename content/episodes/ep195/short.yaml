    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d4/Centaur_10199_Chariklo_%28Illustration%29_%2801GQJ8WWVBWDQV4P05Y74FVZRH%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
