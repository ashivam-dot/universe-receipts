    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2014'
      small: HV 2112 Discovered
- text: Yet confirming this hidden core is buried inside requires detecting both unique light and gravitational waves.
  emphasis:
  - gravitational waves
  - unique light
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c4/MergingBlackHoles_V2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
