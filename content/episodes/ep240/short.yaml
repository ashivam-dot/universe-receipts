id: ep240
title: The Star That Hides a Dead Core
series: The Universe Is Terrifying
description: Discover the bizarre Thorne-Żytkow object, a hybrid star holding a neutron star within.
sources:
- https://en.wikipedia.org/wiki/Thorne%E2%80%93%C5%BBytkow_object
- https://handwiki.org/wiki/Astronomy:Thorne–Żytkow_object
- https://iopscience.iop.org/article/10.3847/1538-4357/ad595e
hashtags:
- '#space'
- '#neutronstar'
- '#astronomy'
tags:
- neutron star
- red giant
- hybrid star
- astronomy
- milky way
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Inside a normal red giant star, a dead neutron star is buried.
  emphasis:
  - red giant star
  - neutron star
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/98/Betelgeuse_and_Siwarha.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Betelgeuse and Siwarha.png
      credit: WhirligigGirl
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse_and_Siwarha.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Most astronomers once assumed such hybrid stars were impossible.
  emphasis:
  - hybrid stars
  - impossible
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/ESO_-_Milky_Way.jpg/3840px-ESO_-_Milky_Way.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ESO - Milky Way.jpg
      credit: ESO/S. Brunier
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:ESO_-_Milky_Way.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: In nineteen seventy-seven, Kip Thorne and Anna Żytkow first hypothesized these bizarre objects.
  emphasis:
  - Kip Thorne
  - Anna Żytkow
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Neutron_star_cross_section.jpg/960px-Neutron_star_cross_section.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Neutron star cross section.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Neutron_star_cross_section.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1977'
      small: Thorne and Żytkow
- text: Theoretical models show the embedded core reaches extreme temperatures exceeding ten to the nine Kelvin.
  emphasis:
  - extreme temperatures
  - ten to the nine Kelvin
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Illustrations_of_Disks_around_Black_Holes_%282005-bhlock-more-2_-_bhdisk_ill%29.tiff/lossy-page1-1920px-Illustrations_of_Disks_around_Black_Holes_%282005-bhlock-more-2_-_bhdisk_ill%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Illustrations of Disks around Black Holes (2005-bhlock-more-2 - bhdisk ill).tiff
      credit: '(Credit: NASA/CXC/M.Weiss)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Illustrations_of_Disks_around_Black_Holes_(2005-bhlock-more-2_-_bhdisk_ill).tiff
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 10^9 K
      small: Core Temperature
- text: Between twenty and two hundred of these strange hybrids may exist across the Milky Way.
  emphasis:
  - twenty and two hundred
  - Milky Way
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 20 to 200
      small: Estimated Hybrids
    motion: zoom_in
- text: In twenty fourteen, astronomers identified the star HV twenty eleven two in the Small Magellanic Cloud as a candidate.
  emphasis:
  - HV twenty eleven two
  - Small Magellanic Cloud
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Small_Magellanic_Cloud_%28ground-based_image%29_%28heic0603d%29.jpg/1920px-Small_Magellanic_Cloud_%28ground-based_image%29_%28heic0603d%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Small Magellanic Cloud (ground-based image) (heic0603d).jpg
      credit: 'ESA/Hubble and Digitized Sky Survey 2. Acknowledgements: Davide De Martin'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Small_Magellanic_Cloud_(ground-based_image)_(heic0603d).jpg
