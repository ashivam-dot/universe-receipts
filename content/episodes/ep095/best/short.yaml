id: ep095
title: The Coldest Place in the Natural Universe
series: Scale Breaker
description: Discover the Boomerang Nebula, a dying star creating temperatures colder than the background glow of the Big
  Bang.
sources:
- https://en.wikipedia.org/wiki/Boomerang_Nebula
- https://www.jpl.nasa.gov/news/boomerang-nebula-boasts-the-coolest-spot-in-the-universe/
- https://sci.esa.int/web/hubble/-/32790-the-boomerang-nebula-the-coolest-place-in-the-universe
- https://esahubble.org/images/heic0301a/
- https://www.astronomy.com/observing/weird-object-the-boomerang-nebula/
- https://www.skyatnightmagazine.com/space-science/coldest-place-universe
hashtags:
- '#space'
- '#nebula'
- '#astronomy'
tags:
- Boomerang Nebula
- coldest place
- Big Bang
- astronomy
- stars
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: One bizarre nebula is colder than the Big Bang itself.
  emphasis:
  - colder than
  - Big Bang itself
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Boomerang_nebula.jpg/1280px-Boomerang_nebula.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Boomerang nebula.jpg
      credit: ESA/NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Boomerang_nebula.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Located five thousand light-years away in Centaurus, this object reaches a bone-chilling one Kelvin.
  emphasis:
  - five thousand light-years
  - one Kelvin
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/93/Johannes_Hevelius_-_Centaurus.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Johannes Hevelius - Centaurus.jpg
      credit: Johannes Hevelius
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Johannes_Hevelius_-_Centaurus.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1 Kelvin
      small: Temperature of the nebula
- text: While the afterglow of the Big Bang warms space to two point seven Kelvin, the nebula plunges to minus two hundred
    seventy-two degrees Celsius.
  emphasis:
  - two point seven Kelvin
  - minus two hundred seventy-two degrees Celsius
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/04/Cosmic_Microwave_Background_%28CMB%29.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Cosmic Microwave Background (CMB).jpeg
      credit: ESA and the Planck Collaboration
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Cosmic_Microwave_Background_(CMB).jpeg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers Keith Taylor and Mike Scarrott named it around nineteen eighty after telescopes revealed a curved, asymmetrical
    shape.
  emphasis:
  - Keith Taylor
  - asymmetrical shape
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Anglo-Australian_Observatory.JPG/1920px-Anglo-Australian_Observatory.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Anglo-Australian Observatory.JPG
      credit: Astro690
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Anglo-Australian_Observatory.JPG
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Later Hubble images exposed its true bow-tie form as a young planetary nebula.
  emphasis:
  - bow-tie form
  - young planetary nebula
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/10/View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_%2828223588012%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: View of Hubble after Being Released from the Shuttle Atlantis (28223588012).jpg
      credit: NASA Hubble Space Telescope
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_(28223588012).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.49
    focus_y: 0.52
- text: A dying central star is shedding mass up to one hundred times faster than similar stars.
  emphasis:
  - dying central star
  - one hundred times faster
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Structure_of_stars_%28artist%E2%80%99s_impression%29_%28eso0729a%29.tiff/lossy-page1-3840px-Structure_of_stars_%28artist%E2%80%99s_impression%29_%28eso0729a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Structure of stars (artist’s impression) (eso0729a).tiff
      credit: ESO
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Structure_of_stars_(artist%E2%80%99s_impression)_(eso0729a).tiff
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Blasting gas outward at hundreds of thousands of kilometers per hour causes extreme adiabatic cooling.
  emphasis:
  - hundreds of thousands
  - adiabatic cooling
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/A_lonely_little_telescope.jpg/1920px-A_lonely_little_telescope.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A lonely little telescope.jpg
      credit: Petr Horálek
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:A_lonely_little_telescope.jpg
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500,000 km/h
      small: Gas expansion speed
- text: That rapid expansion drops temperatures below cosmic microwave radiation, explaining why.
  emphasis:
  - rapid expansion
  - explaining why
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
