- https://science.nasa.gov/solar-system/asteroids/2024-yr4-facts/
- https://www.esa.int/Space_Safety/Planetary_Defence/Will_asteroid_2024_YR4_hit_the_Moon
- https://www.space.com/180-foot-asteroid-1-in-83-chance-hitting-Earth-2032
- https://www.livescience.com/space/city-killer-asteroid-2024-yr4-could-hit-the-moon-instead-of-us-scientists-say
hashtags:
- '#space'
- '#asteroids'
- '#nasa'
tags:
- asteroid 2024 YR4
- Torino scale
- James Webb Space Telescope
- impact probability
- near Earth objects
- space threat
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A new asteroid held a terrifying 3.1 percent chance of hitting Earth.
  emphasis:
  - 3.1 percent chance
  - hitting Earth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Asteroid_2024_YR4_Flyby_Still_%28noirlab2514c%29.jpg/3840px-Asteroid_2024_YR4_Flyby_Still_%28noirlab2514c%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Asteroid 2024 YR4 Flyby Still (noirlab2514c).jpg
      credit: NOIRLab/NSF/AURA/R. Proctor
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Asteroid_2024_YR4_Flyby_Still_(noirlab2514c).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 3.1%
      small: Impact probability
- text: On December 27, 2024, the ATLAS telescope in Chile spotted asteroid 2024 YR4 sneaking past a solar blind spot.
  emphasis:
  - December 27, 2024
  - ATLAS telescope
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: December 27, 2024
      small: ATLAS Telescope, Chile
    motion: zoom_in
- text: The city-killer reached Level 3 on the Torino Scale, the highest impact probability ever recorded for its size.
  emphasis:
  - Level 3
  - Torino Scale
  sfx: riser
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: Level 3
      small: Torino Impact Scale
    motion: zoom_in
- text: Roughly 53 to 67 meters wide, it packed the explosive punch of 8 megatons of TNT.
  emphasis:
  - 53 to 67 meters
  - 8 megatons
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/2024_YR4_size_comparison.png/960px-2024_YR4_size_comparison.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 2024 YR4 size comparison.png
      credit: Sinucep
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:2024_YR4_size_comparison.png
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 8 Megatons
      small: Explosive energy
- text: Its potential impact corridor stretched across parts of South America, India, and Nigeria.
  emphasis:
  - impact corridor
  - South America
  visual:
    reuse: 4
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Then, James Webb Space Telescope observations ruled out Earth, leaving a 4 percent chance of hitting the Moon.
  emphasis:
  - James Webb Space Telescope
  - 4 percent chance
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/2024_YR4_JWST_NIRCam_F150W_2025-03-08.png/960px-2024_YR4_JWST_NIRCam_F150W_2025-03-08.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 2024 YR4 JWST NIRCam F150W 2025-03-08.png
      credit: A. S. Rivkin et al./NASA/ESA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:2024_YR4_JWST_NIRCam_F150W_2025-03-08.png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 4%
      small: Moon impact chance
- text: Refined 2026 data finally cleared the asteroid entirely, ending the most threatening impact scare in history.
  emphasis:
  - 2026 data
  - cleared the asteroid
  sfx: pop
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/11/Moon_LSETM_%2835970428073%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Moon LSETM (35970428073).jpg
      credit: Giuseppe Donatiello
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Moon_LSETM_(35970428073).jpg
