    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2026'
      small: Threat Cleared
- text: That is how a new space rock briefly held a terrifying 3.1 percent chance of hitting Earth.
  emphasis:
