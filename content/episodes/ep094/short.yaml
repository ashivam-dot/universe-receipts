id: ep094
title: The Asteroid That Sparked a 3.1 Percent Impact Scare
series: Near Misses
description: Discover how asteroid 2024 YR4 became the most threatening space rock ever measured by impact probability before
  being ruled out.
sources:
- https://en.wikipedia.org/wiki/2024_YR4
- https://www.scientificamerican.com/article/city-killer-asteroids-earth-impact-risk-rises-to-highest-ever-recorded/
