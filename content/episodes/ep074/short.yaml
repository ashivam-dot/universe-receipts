      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_the_WDJ0914%2B1914_system.tif
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Most astronomers believed a white dwarf, the dense remnant core of a dead star, was a planetary graveyard.
  emphasis:
  - planetary graveyard
  - dense remnant core
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/fe/Hubble_image_of_the_Ring_Nebula_%28Messier_57%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Hubble image of the Ring Nebula (Messier 57).jpg
      credit: NASA, ESA, and C. Robert O’Dell (Vanderbilt University)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_image_of_the_Ring_Nebula_(Messier_57).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But in 1999, Hubble spotted mystery chemical signatures around a distant white dwarf.
  emphasis:
  - Hubble
  - mystery chemical signatures
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/10/View_of_Hubble_after_Being_Released_from_the_Shuttle_Atlantis_%2828223588012%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
