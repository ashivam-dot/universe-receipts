- text: Recently, researcher Jamie Williams used new data to solve this cosmic cold case.
  emphasis:
  - Jamie Williams
  - cosmic cold case
  sfx: whoosh
  visual:
    source: url
    url: https://live.staticflickr.com/65535/52014624204_d74e857c76_b.jpg
    credit:
      source: Flickr via Openverse
