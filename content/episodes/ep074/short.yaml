- text: The white dwarf's intense radiation is stripping this second-generation planet's atmosphere, raining those heavy metals
    back down.
  emphasis:
  - stripping
  - second-generation planet
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/56/Hot_Jupiter_%2835268999232%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
