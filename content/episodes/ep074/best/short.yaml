      title: Artist’s impression of the WDJ0914+1914 system.tif
      credit: ESO/M. Kornmesser
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_the_WDJ0914%2B1914_system.tif
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Most astronomers believed a white dwarf, the dense remnant core of a dead star, was a planetary graveyard.
  emphasis:
  - planetary graveyard
  - dense remnant core
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/fe/Hubble_image_of_the_Ring_Nebula_%28Messier_57%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Hubble image of the Ring Nebula (Messier 57).jpg
      credit: NASA, ESA, and C. Robert O’Dell (Vanderbilt University)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_image_of_the_Ring_Nebula_(Messier_57).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But in 1999, the Hubble Space Telescope spotted one hundred unidentified chemical signatures around the white dwarf
    HS 0209+0832.
  emphasis:
  - Hubble Space Telescope
  - one hundred unidentified
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg/1920px-Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble Space Telescope sporting new solar arrays during SM3B (s109e5705).jpg
      credit: NASA/ESA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_(s109e5705).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1999'
      small: White Dwarf HS 0209+0832
- text: Recently, researcher Jamie Williams used an updated database to solve this twenty-five-year-old cosmic cold case.
  emphasis:
  - Jamie Williams
  - cosmic cold case
  sfx: whoosh
  visual:
    source: url
    url: https://live.staticflickr.com/7222/7400981134_7d78735c90_b.jpg
    credit:
      source: Flickr via Openverse
      title: Warwick Digital Laboratory
      credit: Daniel I Scully
      license: CC BY 2.0
      url: https://www.flickr.com/photos/64192957@N04/7400981134
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.4
- text: The mystery signatures turned out to be niobium, a heavy metal forged only during stellar death throes.
  emphasis:
  - niobium
  - stellar death throes
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/Element_Origins.jpg/960px-Element_Origins.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Element Origins.jpg
      credit: JENNIFER JOHNSON
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Element_Origins.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.27
    focus_y: 0.54
- text: NASA's TESS telescope then detected a Jupiter-sized candidate planet orbiting the dead star every 4.4 days.
  emphasis:
  - Jupiter-sized candidate
  - every 4.4 days
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Transiting_Exoplanet_Survey_Satellite_artist_concept_%28transparent_background%29.png/960px-Transiting_Exoplanet_Survey_Satellite_artist_concept_%28transparent_background%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
