id: ep187
title: The Trillions of Starless Planets Drifting in the Dark
series: The Universe Is Terrifying
description: Billions of rogue planets wander the Milky Way in total darkness, and recent research suggests they outnumber
  star-bound worlds by six to one.
sources:
- https://en.wikipedia.org/wiki/Rogue_planet
- https://science.nasa.gov/mission/roman-space-telescope/rogue-planets/
- https://www.eso.org/public/news/eso2120/
- https://www.nature.com/articles/s41550-021-01513-x
- http://www.astronomy.com/news/2018/11/rogue-one-and-two
- https://www.space.com/11699-rogue-alien-planets-milky-common.html
- https://www.scientificamerican.com/article/rogue-rocky-planet-found-adrift-in-the-milky-way/
hashtags:
- '#space'
- '#astronomy'
- '#planets'
tags:
- rogue planets
- milky way
- free-floating planets
- microlensing
- space
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Billions of planets drift through total darkness without any star at all.
  emphasis:
  - total darkness
  - any star at all
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/92/Alone_in_Space_-_Astronomers_Find_New_Kind_of_Planet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Alone in Space - Astronomers Find New Kind of Planet.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Alone_in_Space_-_Astronomers_Find_New_Kind_of_Planet.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.45
    focus_y: 0.5
- text: Most people assume every single planet belongs to a solar system bound tightly to a shining sun.
  emphasis:
  - every single planet
  - bound tightly
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Sun_With_Planets.jpg/960px-Sun_With_Planets.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Sun With Planets.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Sun_With_Planets.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Instead, massive nomadic objects known as rogue planets wander the vast galaxy in absolute solitude.
  emphasis:
  - rogue planets
  - absolute solitude
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Icy_Earth-mass_Rogue_Planet_%28SVS14380%29.jpg/1280px-Icy_Earth-mass_Rogue_Planet_%28SVS14380%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Icy Earth-mass Rogue Planet (SVS14380).jpg
      credit: NASA's Scientific Visualization Studio - Chris Meaney, Scott Wiessinger, Ashley Balzer
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Icy_Earth-mass_Rogue_Planet_(SVS14380).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.65
    focus_y: 0.7
- text: Astronomers first identified a massive population of these mysterious objects back in 2011 using gravitational microlensing
    techniques.
  emphasis:
  - '2011'
  - gravitational microlensing
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg/3840px-PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: PIA21077 Brown Dwarf Microlensing Diagram.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA21077_Brown_Dwarf_Microlensing_Diagram.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2011'
      small: Microlensing Discovery
- text: That clever observational technique reveals invisible worlds when their gravity warps the light of distant background
    stars.
  emphasis:
  - gravity warps
  - distant background stars
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/d5/Gravitational_Lensing_Diagram_%282018-23-4149-Image%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Gravitational Lensing Diagram (2018-23-4149-Image).png
      credit: 'IMAGE: NASA, ESA, Ann Feild (STScI), Frank Summers (STScI)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Gravitational_Lensing_Diagram_(2018-23-4149-Image).png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Recent research suggests these lonely wanderers significantly outnumber star-bound worlds by six to one.
  emphasis:
  - six to one
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/09/Brown_dwarf_%28artist%E2%80%99s_concept%29_%28heic2405a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Brown dwarf (artist’s concept) (heic2405a).jpg
      credit: NASA, ESA, J. Olmsted (STScI)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Brown_dwarf_(artist%E2%80%99s_concept)_(heic2405a).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.7
    focus_y: 0.6
- text: Trillions of invisible worlds continue drifting through total darkness without any star at all.
  emphasis:
  - Trillions of invisible worlds
  - total darkness
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.45
    focus_y: 0.5
hook_text: TRILLIONS OF STARLESS WORLDS
