      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:NWA_6963_full_slice.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: LUNAR & MARTIAN
