- text: Most meteoroids vaporize completely, but any surviving piece that hits the surface becomes a meteorite.
  emphasis:
  - vaporize completely
  - meteorite
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/00/Esquel.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Esquel.jpg
      credit: Doug Bowman
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Esquel.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Surprisingly, some of these retrieved meteorites are actual pieces of planetary debris blasted off Mars or the Moon.
  emphasis:
  - blasted off Mars
  - the Moon
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/NWA_6963_full_slice.jpg/1280px-NWA_6963_full_slice.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
