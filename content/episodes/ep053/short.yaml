- text: While drifting through deep space, a tiny rock fragment is known as a meteoroid.
  emphasis:
  - deep space
  - meteoroid
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/89/243_ida_crop.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: 243 ida crop.jpg
      credit: '243_ida.jpg: NASA/JPL

        derivative work:   Chzz  ►'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:243_ida_crop.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: The moment it plunges into our atmosphere and ignites, it becomes a fiery meteor.
  emphasis:
  - plunges into our atmosphere
  - fiery meteor
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Comet_Lemmon_Oct_30.png/1920px-Comet_Lemmon_Oct_30.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Comet Lemmon Oct 30.png
      credit: Chuck Ayoub
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Comet_Lemmon_Oct_30.png
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.3
    focus_y: 0.3
- text: Major showers like August's Perseids happen when Earth plows directly through dusty comet trails.
  emphasis:
  - Perseids
  - comet trails
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/2018_Perseid_No_2_%2844004016011%29.jpg/3840px-2018_Perseid_No_2_%2844004016011%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
