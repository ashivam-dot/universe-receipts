  - atomic clocks
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Hydrogen_maser_atomic_clock_installed_at_the_ALMA_AOS_%28140604_almamaser_05%29.tiff/lossy-page1-960px-Hydrogen_maser_atomic_clock_installed_at_the_ALMA_AOS_%28140604_almamaser_05%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
