    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/South_Pole_Telescope_with_Joaquin_Vieira.jpg/1280px-South_Pole_Telescope_with_Joaquin_Vieira.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
