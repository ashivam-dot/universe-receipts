      title: United States of North America, and part of Canada. Western sheet. (with) Sections of Central Pacific Railway
        (IA dr united-states-of-north-america-and-part-of-canada-western-sheet-with-s-5371116).jpg
      credit: Letts, Son & Co.
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:United_States_of_North_America,_and_part_of_Canada._Western_sheet._(with)_Sections_of_Central_Pacific_Railway_(IA_dr_united-states-of-north-america-and-part-of-canada-western-sheet-with-s-5371116).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: During its pass, the meteoroid dipped to a minimum altitude of just fifty-eight kilometers.
  emphasis:
  - fifty-eight kilometers
  - minimum altitude
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/1000px-Atmosphere_layers-en.PNG/960px-1000px-Atmosphere_layers-en.PNG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
