    focus_x: 0.5
    focus_y: 0.3
    card:
      kind: fact
      big: Truck-Sized
      small: Space Rock
- text: On August 10, 1972, the Great Daylight Fireball entered the sky over Utah at thirty-three thousand miles per hour.
  emphasis:
  - August 10, 1972
  - Utah
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: August 10, 1972
      small: Utah Sky
    motion: zoom_in
- text: The object streaked fifteen hundred kilometers northward, visible in broad daylight across the western United States
    and Canada.
  emphasis:
  - fifteen hundred kilometers
  - broad daylight
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/United_States_of_North_America%2C_and_part_of_Canada._Western_sheet._%28with%29_Sections_of_Central_Pacific_Railway_%28IA_dr_united-states-of-north-america-and-part-of-canada-western-sheet-with-s-5371116%29.jpg/3840px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
