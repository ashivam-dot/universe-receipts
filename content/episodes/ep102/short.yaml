    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: The entire frantic encounter lasted approximately one hundred seconds.
  emphasis:
  - one hundred seconds
  - encounter
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 100 Seconds
      small: Duration
    motion: zoom_in
- text: The dense atmosphere acted like a cosmic ramp, stripping away half the object's mass and warping its orbital tilt
    from fifteen degrees to seven.
  emphasis:
  - cosmic ramp
  - orbital tilt
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/03/Colure.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
