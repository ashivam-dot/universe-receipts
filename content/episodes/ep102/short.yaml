- text: A truck-sized space rock skipped off Earth's atmosphere like a stone.
  emphasis:
  - skipped off Earth's atmosphere
  - stone
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c8/Frederic_Church_Meteor_of_1860.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
