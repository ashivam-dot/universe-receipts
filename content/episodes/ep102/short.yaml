    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 15 to 7 Degrees
      small: Orbital Tilt Shift
- text: Having bounced off our sky and escaped back into space, the Great Daylight Fireball was never seen again.
  emphasis:
  - escaped back into space
  - never seen again
  sfx: whoosh
