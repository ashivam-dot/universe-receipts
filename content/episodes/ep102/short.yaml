    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 58 Kilometers
      small: Minimum Altitude
- text: Witnesses in Montana reported hearing a startling double sonic boom as the rock rushed overhead.
  emphasis:
  - double sonic boom
  - Montana
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/51/110925-N-DC018-068_%286192572646%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
