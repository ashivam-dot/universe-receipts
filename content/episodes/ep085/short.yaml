id: ep085
title: The Star That Chokes on Its Own Soot
series: The Universe Is Terrifying
description: R Coronae Borealis is a rare reverse nova that periodically vanishes as it smothers itself in clouds of carbon
  dust.
sources:
- https://en.wikipedia.org/wiki/R_Coronae_Borealis
