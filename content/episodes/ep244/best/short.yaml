- https://en.wikipedia.org/wiki/Lunar_regolith
- https://web.archive.org/web/20081015195451/http://www.livescience.com/space/scienceastronomy/080418-strange-moon.html
- http://www.collectspace.com/news/news-042314a-astronaut-alanbean-moon-auction.html
- https://www.space.com/apollo-12-surveyor-3-parts-50-years.html
hashtags:
