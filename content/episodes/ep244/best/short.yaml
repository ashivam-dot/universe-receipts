id: ep244
title: The Terrifying Myth of the Moon's Quicksand
series: Space Myths, Busted
description: Before Apollo 11 touched down, scientists feared the Moon was covered in deep dust that would swallow landers
  whole. Robotic probes proved the real danger was levitating above the ground.
sources:
- https://en.wikipedia.org/wiki/Surveyor_program
- https://www.jpl.nasa.gov/news/fifty-years-of-moon-dust-surveyor-1-was-a-pathfinder-for-apollo/
