id: ep244
title: The Terrifying Myth of the Moon's Quicksand
series: Space Myths, Busted
description: Before Apollo 11, experts feared the Moon was a swallowing trap of deep dust. Probes proved the ground was solid,
  but the real hazard was levitating above it.
sources:
- https://en.wikipedia.org/wiki/Surveyor_program
