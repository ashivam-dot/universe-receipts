id: ep110
title: The Lost Space Forest NASA Forgot Existed
series: Space Got Weird
description: In 1971, Apollo 14 carried hundreds of tree seeds to the Moon. Decades later, NASA completely forgot they existed
  until a schoolteacher made a surprise discovery.
sources:
- https://en.wikipedia.org/wiki/Moon_tree
- https://www.nasa.gov/history/moon-trees/
