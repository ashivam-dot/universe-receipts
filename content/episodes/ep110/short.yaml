- https://web.archive.org/web/20221013075734/https://www.theatlantic.com/science/archive/2022/01/nasa-moon-trees-apollo/621395/
- https://www.latimes.com/travel/story/2019-07-19/california-moon-trees
hashtags:
- '#space'
- '#apollo'
- '#nasa'
