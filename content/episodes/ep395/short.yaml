id: ep395
title: The Moon's First Rover That Never Gave Up
series: Space Got Weird
format: v3
description: In 1970, the Soviet Union landed Lunokhod 1 on the Moon for a three-day mission. Decades later, an Earth laser
  pinged the forgotten rover and it fired right back.
