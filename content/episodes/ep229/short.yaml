id: ep229
title: The Fireball That Skipped Off Earth
series: Near Misses
description: Discover the story of the 1972 Great Daylight Fireball, a massive space rock that bounced off our atmosphere
  and escaped back into space.
sources:
- https://en.wikipedia.org/wiki/1972_Great_Daylight_Fireball
- https://www.space.com/space-exploration/on-this-day-in-space-august-10-2026
- https://science.report/discover/1972-daylight-fireball-skimmed-earth-s-atmosphere-over-north-america-80209/
- https://natureshocks.blogspot.com/2026/08/1972-great-daylight-fireball-earth-grazer.html
- https://grokipedia.com/page/1972_Great_Daylight_Fireball
- https://web.archive.org/web/20161019155203/http://www.phys.ncku.edu.tw/~astrolab/mirrors/apod_e/ap090302.html
- https://web.archive.org/web/20071020025037/http://www.astrosociety.org/pubs/mercury/9806/impact.html
hashtags:
- '#space'
- '#nearmiss'
- '#meteor'
tags:
- 1972 fireball
- daylight fireball
- meteoroid
- space rock
- grand teton
- near miss
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: In 1972, a blinding fireball streaked across the sky, never hitting ground.
  emphasis:
  - blinding fireball
  - never hitting ground
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Meteoroiden.jpg/960px-Meteoroiden.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Meteoroiden.jpg
      credit: Herbert Bolz
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Meteoroiden.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: On August 10, a truck-sized space rock entered the atmosphere over the state of Utah.
  emphasis:
  - truck-sized
  - Utah
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: August 10, 1972
      small: Utah, USA
    motion: zoom_in
- text: Moving at 15 kilometers per second, the object glowed bright enough for people to film.
  emphasis:
  - 15 kilometers per second
  visual:
    source: card
    card:
      kind: fact
      big: 15 km/s
      small: Entry speed
    motion: zoom_in
- text: Tourists in Wyoming watched the trail while a sonic boom shook the air.
  emphasis:
  - sonic boom
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/2/21/Adams_The_Tetons_and_the_Snake_River.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Adams The Tetons and the Snake River.jpg
      credit: Ansel Adams
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Adams_The_Tetons_and_the_Snake_River.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Military surveillance satellites tracked the object spending 100 seconds skipping like a stone.
  emphasis:
  - 100 seconds
  - like a stone
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/North_America_from_low_orbiting_satellite_Suomi_NPP.jpg/3840px-North_America_from_low_orbiting_satellite_Suomi_NPP.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: North America from low orbiting satellite Suomi NPP.jpg
      credit: NASA/NOAA/GSFC/Suomi NPP/VIIRS/Norman Kuring
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:North_America_from_low_orbiting_satellite_Suomi_NPP.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 100 seconds
      small: Atmospheric time
- text: Instead of crashing, the meteoroid merely grazed the atmosphere and rebounded back into interplanetary space.
  emphasis:
  - grazed the atmosphere
  - interplanetary space
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Atmosphere_Diagram_%28Atmosfera_EN-CC%29.tiff/lossy-page1-3840px-Atmosphere_Diagram_%28Atmosfera_EN-CC%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Atmosphere Diagram (Atmosfera EN-CC).tiff
      credit: P. Horálek /NOIRLab/NSF/AURA
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Atmosphere_Diagram_(Atmosfera_EN-CC).tiff
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Czech astronomer Zdenek Ceplecha determined this brief encounter permanently shifted the rock's entire orbit.
  emphasis:
  - Zdenek Ceplecha
  - shifted the rock's entire orbit
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/59/2427%28Kobzar%29_asteroid_orbit.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: 2427(Kobzar) asteroid orbit.png
      credit: This is a screenshot taken from Jet Propulsion Laboratory site.
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:2427(Kobzar)_asteroid_orbit.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Apollo-type
      small: Orbital class
- text: Not a single solid fragment reached the ground because the world only watched.
  emphasis:
  - world only watched
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
