- https://www.nationalgeographic.com/science/article/moon-illusion-explained-horizon-size-supermoon-space-science
- https://web.archive.org/web/20090221135719/http://www.lhup.edu/~dsimanek/3d/moonillu.htm
- https://scienceshot.com/post/moon-illusion-horizon-farther
- https://web.archive.org/web/20210126141939/http://www.nasa.gov/vision/universe/watchtheskies/20jun_moonillusion.html
hashtags:
- '#space'
- '#moon'
- '#science'
tags:
- moon illusion
- astronomy
- psychology
- space myth
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
