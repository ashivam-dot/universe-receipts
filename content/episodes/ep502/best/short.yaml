    focus_x: 0.5
    focus_y: 0.5
- text: Standard rockets couldn't push a probe out of Earth's flat orbit.
  emphasis:
  - flat orbit
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Dialogue-day3-_yearly_motion.png/1920px-Dialogue-day3-_yearly_motion.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
