    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: So Ulysses used Jupiter's gravity to loop over the Sun's poles.
  emphasis:
  - loop over
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/83/Space_probe_trajectory_example.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
