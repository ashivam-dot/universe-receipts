    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: It launched in 1990 and hit record-shattering speeds.
  emphasis:
  - record-shattering
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/STS-41_launch.jpg/1920px-STS-41_launch.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
