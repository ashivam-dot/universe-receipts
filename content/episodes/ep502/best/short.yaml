  - more than just a view
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/RTG_radiation_measurement.jpg/1920px-RTG_radiation_measurement.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
