id: ep502
title: The 500-Million-Mile Detour to the Sun
series: Mission Files
format: v3
description: To see the Sun's unexplored poles, the Ulysses probe had to fly to Jupiter first. This mission revealed that
  polar solar winds travel twice as fast.
sources:
- https://en.wikipedia.org/wiki/Ulysses_(spacecraft)
- https://science.nasa.gov/mission/ulysses/
- https://www.esa.int/Enabling_Support/Operations/Ulysses_12_extra_months_of_valuable_science
- https://web.archive.org/web/20230907002154/https://www.reuters.com/article/us-space-solar-idINTRE5600A220090701
hashtags:
- '#space'
- '#nasa'
- '#sun'
tags:
- Ulysses
- Sun
- Jupiter
- solar wind
- ESA
- NASA
- STS-41
- Space Shuttle
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
