  emphasis:
  - vacuum cleaners
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Black_Hole_Desktop_%26_Phone_Wallpapers_%28SVS14146_-_BlackHoleDisk_desktop%29.png/1280px-Black_Hole_Desktop_%26_Phone_Wallpapers_%28SVS14146_-_BlackHoleDisk_desktop%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
