      big: 3 kilometers
      small: Size of solar-mass black hole
- text: To get trapped, an object must cross this Schwarzschild radius where even light cannot escape.
  emphasis:
  - Schwarzschild radius
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/First_image_of_our_black_hole_%28with_wider_background%29_%28eso2208-eht-mwh%29.tiff/lossy-page1-3840px-First_image_of_our_black_hole_%28with_wider_background%29_%28eso2208-eht-mwh%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
