id: ep156
title: The Radioactive Clock Bolted to Voyager
series: Space Got Weird
description: The Voyager Golden Record carries an ultra-pure sample of uranium-238 to tell extraterrestrials how old it is.
  Here is how NASA built a billion-year atomic clock for deep space.
