id: ep404
title: The Star Eating Another Star from Within
series: The Universe Is Terrifying
format: v3
description: Deep inside a red supergiant star, a swallowed neutron star devours its host from the inside out. Physicists
  call this hybrid monster a Thorne–Żytkow object.
sources:
- https://en.wikipedia.org/wiki/Thorne%E2%80%93%C5%BBytkow_object
- https://cosmosatlasai.substack.com/p/a-star-inside-a-star-the-bizarre
- https://crvscience.com/wiki/thorne-zytkow-object
hashtags:
- '#space'
- '#astronomy'
- '#blackhole'
tags:
- space
- astronomy
- neutron star
- red supergiant
- black hole
- thorne zytkow object
voice:
  engine: gemini
  voice: Zubenelgenubi
  language: en-US
  speed: 1.05
  max_pause: 0.25
  direction: fast, energetic, conversational American telling a friend a true space story they can hardly believe; punchy
    and playful, natural rises and falls, never an announcer or documentary voice
beats:
- text: A dead star can hide inside a living giant star.
  emphasis:
  - hide inside
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/98/Betelgeuse_and_Siwarha.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Betelgeuse and Siwarha.png
      credit: WhirligigGirl
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse_and_Siwarha.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.44
    focus_y: 0.49
- text: To our telescopes, the host looks like an ordinary red supergiant.
  emphasis:
  - ordinary
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/62/Image_of_Betelgeuse%E2%80%99s_surface_taken_in_January_2019_%28eso2109f%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Image of Betelgeuse’s surface taken in January 2019 (eso2109f).jpg
      credit: ESO/M. Montargès et al.
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Image_of_Betelgeuse%E2%80%99s_surface_taken_in_January_2019_(eso2109f).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: But gas friction drags a swallowed neutron star toward the center.
  emphasis:
  - swallowed neutron star
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Betelgeuse_and_wake_of_its_companion_star_%28artist%27s_concept%29_%28opo2602%29.tiff/lossy-page1-3840px-Betelgeuse_and_wake_of_its_companion_star_%28artist%27s_concept%29_%28opo2602%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Betelgeuse and wake of its companion star (artist's concept) (opo2602).tiff
      credit: 'NASA, ESA, E. Wheatley (STScI), Science: A. Dupree (CfA)'
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Betelgeuse_and_wake_of_its_companion_star_(artist%27s_concept)_(opo2602).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.49
    focus_y: 0.67
- text: Falling gas heats up to nearly one billion Kelvin.
  emphasis:
  - one billion Kelvin
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Swift_J1749.4-2807.jpg/1280px-Swift_J1749.4-2807.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Swift J1749.4-2807.jpg
      credit: NASA/GSFC
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Swift_J1749.4-2807.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: This extreme heat forces rapid proton capture inside the stellar belly.
  emphasis:
  - stellar belly
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Light_nuclide_abundance_and_origins_hi_res.png/3840px-Light_nuclide_abundance_and_origins_hi_res.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Light nuclide abundance and origins hi res.png
      credit: Urayness
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Light_nuclide_abundance_and_origins_hi_res.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Violent convection churns rare rubidium and molybdenum toward the surface.
  emphasis:
  - rubidium and molybdenum
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/SMC_inset.jpg/3840px-SMC_inset.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: SMC inset.jpg
      credit: ESA/Hubble and Digitized Sky Survey 2
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:SMC_inset.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: The ravenous core keeps devouring gas and growing heavier.
  emphasis:
  - growing heavier
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ee/IGR_J17062-6143_binary_still.jpg/1280px-IGR_J17062-6143_binary_still.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: IGR J17062-6143 binary still.jpg
      credit: NASA/Goddard Space Flight Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:IGR_J17062-6143_binary_still.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.51
    focus_y: 0.5
- text: Eventually, that hidden dead core collapses into a black hole.
  emphasis:
  - black hole
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/ab/Illustration_of_Black_Hole_System_%282020-19-4641%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Illustration of Black Hole System (2020-19-4641).png
      credit: ', , and D. Player ()'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Illustration_of_Black_Hole_System_(2020-19-4641).png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.32
    focus_y: 0.48
- text: Nothing survives once a dead star burrows deep inside.
  emphasis:
  - Nothing survives
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.44
    focus_y: 0.49
