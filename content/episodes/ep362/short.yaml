id: ep362
title: The Starquake That Hit Earth
series: The Universe Is Terrifying
format: v3
description: In 1998, a violent starquake on magnetar SGR 1900+14 unleashed a radiation blast so fierce it struck Earth from
  20,000 light-years away.
