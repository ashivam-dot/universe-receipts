      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Longevity_Escape_Velocity.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Triple Speed
      small: Breaking Free
- text: It was kicked out of the galactic center approximately five million years ago.
  emphasis:
  - galactic center
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Galactic_Cntr_full_cropped.jpg/1920px-Galactic_Cntr_full_cropped.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
