    - color
    motion: pan_right
    focus_x: 0.7
    focus_y: 0.7
    box:
    - 0.55
    - 0.55
    - 0.9
    - 0.9
    card:
      kind: fact
      big: Gaia Data
      small: Tracing the Path
- text: The star travels at an extraordinary velocity of approximately 1,755 kilometers per second.
  emphasis:
  - 1,755 kilometers
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 1,755 km/s
      small: Extraordinary Velocity
    motion: zoom_in
- text: This speed is more than triple what is required to break free from our home galaxy.
  emphasis:
  - break free
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c6/Longevity_Escape_Velocity.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
