      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Grus_(Annotated)_(grus-ann).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 29,000 Light-Years
      small: Distance from Earth
- text: Sergey Koposov and a team of researchers used Gaia spacecraft data to trace its direct path.
  emphasis:
  - Gaia spacecraft
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/The_Gaia_Spacecraft_%28eso1908d%29.tiff/lossy-page1-1920px-The_Gaia_Spacecraft_%28eso1908d%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
