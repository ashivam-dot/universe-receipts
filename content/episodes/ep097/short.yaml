id: ep097
title: The Star Escaping Our Galaxy at 4 Million MPH
series: The Universe Is Terrifying
description: Discover S5-HVS1, a hypervelocity star flung by Sagittarius A* that is currently fleeing the Milky Way forever.
sources:
- https://en.wikipedia.org/wiki/S5-HVS1
- https://unseel.com/astronomy/hypervelocity-star
- https://refractor.io/space/fastest-star-hypervelocity-ejected-milky-way/
