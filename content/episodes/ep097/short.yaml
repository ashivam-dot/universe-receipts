- text: Our central black hole, Sagittarius A*, captured its partner star and violently slung this one away.
  emphasis:
  - Sagittarius A*
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Gcle.jpg/1920px-Gcle.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
