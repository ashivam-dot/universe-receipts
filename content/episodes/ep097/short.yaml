- https://newatlas.com/space/fastest-star-hypervelocity-ejected-milky-way/
- https://science.nasa.gov/missions/hubble/hyperfast-star-was-booted-from-milky-way/
- https://www.space.com/hypervelocity-star-ejected-from-milky-way.html
hashtags:
- '#space'
- '#astronomy'
- '#blackhole'
tags:
- hypervelocity star
- S5-HVS1
- Sagittarius A*
- Milky Way
- black hole
- space mysteries
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A giant black hole hurled a star out of our galaxy.
  emphasis:
  - hurled a star
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c7/Hypervelocity_star_trajectory.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Hypervelocity star trajectory.jpg
      credit: CfA/Melissa Weiss
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Hypervelocity_star_trajectory.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers tracked this stellar runaway, known as S5-HVS1, roughly 29,000 light-years away from Earth.
  emphasis:
  - 29,000 light-years
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Grus_%28Annotated%29_%28grus-ann%29.jpg/3840px-Grus_%28Annotated%29_%28grus-ann%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Grus (Annotated) (grus-ann).jpg
