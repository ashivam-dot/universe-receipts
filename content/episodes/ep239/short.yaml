- text: In 2004, astronomers tracking the Kuiper Belt noticed a distant point of light flashing wildly.
  emphasis:
  - Kuiper Belt
  - flashing wildly
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: '2004'
      small: Kuiper Belt Discovery
    motion: zoom_in
- text: That rapidly flickering brightness revealed a dwarf planet completing a full rotation every 3.9 hours.
  emphasis:
  - flickering brightness
  - 3.9 hours
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Recurring_Planetary_Debris_Transits_and_Circumstellar_Gas_around_White_Dwarf_ZTF_J0328%E2%88%921219_%28Figure_2%29.png/1280px-Recurring_Planetary_Debris_Transits_and_Circumstellar_Gas_around_White_Dwarf_ZTF_J0328%E2%88%921219_%28Figure_2%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
