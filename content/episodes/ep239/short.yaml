- https://solaresistema.it/en/planets/haumea/
- https://nineplanets.org/haumea/
hashtags:
- '#space'
- '#haumea'
- '#astronomy'
tags:
- haumea
- dwarf planet
- kuiper belt
- space
- astronomy
- ring system
- solar system
