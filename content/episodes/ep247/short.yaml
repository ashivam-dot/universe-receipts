id: ep247
title: The Space Telescope That Hunts on Machine Instinct
series: Mission Files
description: NASA's Neil Gehrels Swift Observatory can pivot its entire multi-ton body in under a minute to catch fleeting
  cosmic explosions. Launched in 2004, it revolutionized how astronomers study the dying universe.
