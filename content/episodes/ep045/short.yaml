id: ep045
title: Why NASA Killed a $3B Spacecraft
series: Mission Files
description: NASA intentionally crashed the Cassini spacecraft into Saturn's atmosphere to protect its moons from Earthly
  bacteria.
sources:
- https://en.wikipedia.org/wiki/Cassini_retirement
- https://en.wikipedia.org/wiki/Cassini%E2%80%93Huygens
- https://science.nasa.gov/mission/cassini/
- https://www.planetary.org/space-missions/cassini
- https://www.space.com/38167-cassini-spacecraft-plunges-into-saturn.html
hashtags:
- '#space'
- '#nasa'
- '#cassini'
tags:
- Cassini
- Saturn
- Enceladus
- Titan
- NASA
- Space Exploration
- Grand Finale
voice:
  voice: af_heart
  speed: 1.05
beats:
