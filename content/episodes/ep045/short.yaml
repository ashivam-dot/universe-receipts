- text: These worlds had everything needed for life, but Cassini was running out of rocket fuel.
  emphasis:
  - everything needed
  - running out
  visual:
    source: card
    card:
      kind: fact
      big: Empty Tanks
      small: Fuel Supply
    motion: zoom_in
- text: Scientists realized if the dead probe ever drifted and crashed, Earthly microbes could contaminate these pristine
    moons.
  emphasis:
  - Earthly microbes
  - pristine moons
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/a6/PIA22912.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: PIA22912.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:PIA22912.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: To prevent a biological disaster, they ordered a 'Grand Finale' dive through the rings and into Saturn's clouds.
  emphasis:
  - Grand Finale
  - into Saturn's clouds
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Cassini_Grand_Finale.png/1280px-Cassini_Grand_Finale.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Cassini Grand Finale.png
      credit: NASA / JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Cassini_Grand_Finale.png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: On September 15, 2017, Cassini fought Saturn's winds for 30 seconds longer than predicted before burning up.
  emphasis:
  - 30 seconds longer
  - burning up
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/0f/Cassini%27s_final_plunge_7635_CGF_STILL_00032.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Cassini's final plunge 7635 CGF STILL 00032.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Cassini%27s_final_plunge_7635_CGF_STILL_00032.jpg
