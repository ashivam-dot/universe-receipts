    focus_x: 0.5
    focus_y: 0.5
- text: The Cassini-Huygens mission, a joint international effort, arrived at the ringed planet in July 2004.
  emphasis:
  - joint international effort
  - July 2004
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/a9/Saturn_Prior_to_Cassini_Probe%27s_Arrival_%282004-18-1545%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
