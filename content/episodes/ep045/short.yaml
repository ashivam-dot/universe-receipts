    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: Sept 15, 2017
      small: Saturn Impact
- text: This was a calculated sacrifice to protect moons that might hold life from the three-billion-dollar spacecraft.
  emphasis:
  - calculated sacrifice
  - might hold life
