      small: Saturn Arrival
- text: The spacecraft discovered geysers of water ice on Enceladus and methane seas on the massive moon Titan.
  emphasis:
  - water ice
  - methane seas
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Dramatic_plumes%2C_both_large_and_small%2C_spray_water_ice_out_from_many_locations_along_the_famed_tiger_stripes_near_the_south_pole_of_Saturn%E2%80%99s_moon_Enceladus_in_this_image_released_on_Feb_23_%28newly-found-organics-in-enceladus-plumes%29.jpg/1280px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Dramatic plumes, both large and small, spray water ice out from many locations along the famed tiger stripes
        near the south pole of Saturn’s moon Enceladus in this image released on Feb 23 (newly-found-organics-in-enceladus-plumes).jpg
      credit: NASA/JPL-Caltech/Space Science Institute
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Dramatic_plumes,_both_large_and_small,_spray_water_ice_out_from_many_locations_along_the_famed_tiger_stripes_near_the_south_pole_of_Saturn%E2%80%99s_moon_Enceladus_in_this_image_released_on_Feb_23_(newly-found-organics-in-enceladus-plumes).jpg
