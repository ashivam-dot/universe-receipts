id: ep069
title: The Soviet Lander That Defied Death on Venus
series: Mission Files
description: In 1982, the Soviet Venera 13 lander touched down on the hostile surface of Venus. Designed to survive for only
  32 minutes, it shocked engineers by operating for over two hours.
