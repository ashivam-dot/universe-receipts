id: ep412
title: How One Astronomer Proved the UNIVERSE Is Expanding
series: Space Got Weird
format: v3
description: Before Edwin Hubble's observations, astronomers believed the Milky Way was the entire cosmos. His work proved
  distant galaxies are moving away in an expanding universe.
