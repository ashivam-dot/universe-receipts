id: ep301
title: Why Neil Armstrong's Famous Quote Made No Sense
series: Space Myths, Busted
format: v3
description: Neil Armstrong's iconic line on the Moon was missing a single word, altering its meaning. Decades of forensic
  audio analysis still debate whether radio static muffled the missing letter.
