    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: When Voyager 2 reached Uranus in 1986, scientists expected its moon Miranda to be a boring ice-ball.
  emphasis:
  - Voyager 2
  - ice-ball
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/Uranus2.jpg/1280px-Uranus2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Uranus2.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Uranus2.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1986'
      small: Voyager 2
- text: Instead, they found a 'Frankenstein' world of mismatched geological blocks and a massive V-shaped scar.
