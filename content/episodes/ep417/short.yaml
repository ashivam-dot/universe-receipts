id: ep417
title: The Hidden Flaw That Doomed Shuttle Columbia
series: The Universe Is Terrifying
format: v3
description: Space Shuttle Columbia was lost in 2003 when a foam strike damaged its wing. While the crew was lost, a canister
  of live roundworms remarkably survived.
