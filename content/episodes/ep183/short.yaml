- https://www.space.com/exoplanet-hot-atmosphere-vaporized-rock
- https://scitechdaily.com/observed-giant-ultra-hot-planet-wasp-76b-where-it-rains-iron/
hashtags:
- '#space'
- '#exoplanet'
- '#astronomy'
tags:
- WASP-76b
- exoplanet
- iron rain
- astronomy
- Very Large Telescope
- space facts
