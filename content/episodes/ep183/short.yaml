  emphasis:
  - Very Large Telescope
  - nothing at dawn
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Sundown_on_the_VLT_%28vlt_atudorica014-cc%29.tiff/lossy-page1-3840px-Sundown_on_the_VLT_%28vlt_atudorica014-cc%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
