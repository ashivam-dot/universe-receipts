id: ep183
title: The Alien World Where It Rains Molten Iron
series: Space Got Weird
description: Astronomers discovered that extreme temperatures on WASP-76b vaporize iron on its dayside, triggering winds that
  cool into molten metal rain.
sources:
- https://en.wikipedia.org/wiki/WASP-76b
