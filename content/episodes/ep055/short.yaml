    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Their powerful stellar winds slam together, creating a spinning pinwheel nebula over two hundred astronomical units
    wide.
  emphasis:
  - pinwheel nebula
  - two hundred astronomical units
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 200 AU
      small: Nebula diameter
    motion: zoom_in
- text: Early imaging suggested Earth was looking directly down the rotational axis, sparking panic over a lethal gamma-ray
    burst.
  emphasis:
  - rotational axis
  - lethal gamma-ray burst
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Gamma-rays_hitting_the_Earth%27s_atmosphere.tif/lossy-page1-1920px-Gamma-rays_hitting_the_Earth%27s_atmosphere.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Gamma-rays hitting the Earth's atmosphere.tif
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Gamma-rays_hitting_the_Earth%27s_atmosphere.tif
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Recent Keck Observatory research revealed that the actual stellar orbit is tilted thirty to forty degrees away from
    us.
  emphasis:
  - Keck Observatory
  - tilted thirty to forty degrees
