- text: Deep in the constellation Sagittarius lies WR 104, located about eight thousand four hundred light-years from Earth.
  emphasis:
  - constellation Sagittarius
  - eight thousand four hundred light-years
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: 8,400 Light-Years
      small: Constellation Sagittarius
    motion: zoom_in
- text: At its heart, a massive Wolf-Rayet star and an OB companion orbit each other every eight months.
  emphasis:
  - Wolf-Rayet star
  - every eight months
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/A_cosmic_couple.jpg/960px-A_cosmic_couple.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
