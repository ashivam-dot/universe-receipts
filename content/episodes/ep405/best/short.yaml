id: ep405
title: The Spacecraft One Light-Day Away From Earth
series: Scale Breaker
format: v3
description: Voyager 1 is so far from Earth that its signals take nearly twenty-four hours to reach us. Discover how NASA
  keeps this interstellar traveler calling home.
