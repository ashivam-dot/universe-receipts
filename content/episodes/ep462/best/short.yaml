title: The Milky Way's Black Hole Erupted 350 Years Ago
series: The Universe Is Terrifying
format: v3
description: Astronomers discovered an ancient X-ray echo revealing that the Milky Way's central black hole erupted 350 years
  ago. The supermassive monster released a million times more energy than it does today.
