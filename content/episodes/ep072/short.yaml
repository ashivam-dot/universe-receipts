id: ep072
title: The Solar Storm That Missed Earth
series: Near Misses
description: In July 2012, a solar superstorm traveling 2,000 kilometers per second missed Earth by just nine days, narrowly
  avoiding a global catastrophe.
sources:
- https://en.wikipedia.org/wiki/July_2012_solar_storm
