      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:CME_Cornucopia_(May_11,_2012)_(hd_video)_(7203919450).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: July 2012
      small: The Sun Erupts
- text: This blast traveled at over two thousand kilometers per second, four times faster than normal.
  emphasis:
  - over two thousand
  - four times faster
  visual:
    source: card
    card:
      kind: fact
      big: 2,000 km/s
      small: Record Speed
    motion: zoom_in
- text: It achieved this record speed because an eruption four days earlier had cleared its cosmic path.
  emphasis:
  - record speed
  - cleared its cosmic path
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/41/The_Sun_Flares_with_Activity.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: The Sun Flares with Activity.jpg
      credit: NASA's Earth Observatory
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:The_Sun_Flares_with_Activity.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: A direct hit would have crippled global power grids and water pumps, costing over two trillion dollars.
  emphasis:
  - crippled global power grids
  - two trillion dollars
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: $2 Trillion
      small: Estimated Cost
    motion: zoom_in
- text: Instead, NASA's STEREO-A spacecraft in deep space safely recorded the entire blow.
  emphasis:
  - STEREO-A spacecraft
  - safely recorded
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/00/The_two_STEREO_spacecrafts_sits_on_a_test_stand.jpg/1920px-The_two_STEREO_spacecrafts_sits_on_a_test_stand.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
