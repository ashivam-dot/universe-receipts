    focus_y: 0.3
    box:
    - 0.2
    - 0.1
    - 0.8
    - 0.5
- text: Physicist Pete Riley calculated a twelve percent chance a similar disaster strikes Earth each decade.
  emphasis:
  - twelve percent chance
  - each decade
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/The_Mauli_%26_Polyblank_photograph_of_Richard_C_Carrington.jpg/1920px-The_Mauli_%26_Polyblank_photograph_of_Richard_C_Carrington.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
