id: ep072
title: The Solar Storm That Missed Earth by Nine Days
series: Near Misses
description: In July 2012, an ultra-fast Carrington-class solar superstorm crossed Earth's orbit, missing us by just nine
  days and sparing our modern power grids.
sources:
- https://en.wikipedia.org/wiki/July_2012_solar_storm
- https://science.nasa.gov/science-research/planetary-science/23jul_superstorm/
- https://www.pbs.org/newshour/science/two-years-ago-intense-solar-storm-barely-misses-earth
- https://www.theguardian.com/science/2014/jul/25/extreme-solar-storm-sun-earth
- https://vcresearch.berkeley.edu/news/fierce-solar-magnetic-storm-barely-missed-earth-2012
- https://www.cmetracker.ai/events/near-miss-2012
- https://www.astronomy.com/observing/fierce-2012-magnetic-storm-barely-missed-earth/
hashtags:
- '#space'
- '#solarstorm'
- '#nasa'
tags:
- solar storm
- near miss
- carrington event
- space weather
- stereo-a
- sun
