- https://www.theguardian.com/science/2014/jul/25/extreme-solar-storm-sun-earth
- https://vcresearch.berkeley.edu/news/fierce-solar-magnetic-storm-barely-missed-earth-2012
- https://www.cmetracker.ai/events/near-miss-2012
- https://www.astronomy.com/observing/fierce-2012-magnetic-storm-barely-missed-earth/
