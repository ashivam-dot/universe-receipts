- text: On July 23, 2012, the Sun launched a massive Carrington-class plasma eruption.
  emphasis:
  - massive Carrington-class
  - plasma eruption
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e6/CME_Cornucopia_%28May_11%2C_2012%29_%28hd_video%29_%287203919450%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
