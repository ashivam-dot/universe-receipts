    focus_x: 0.2
    focus_y: 0.6
    box:
    - 0.0
    - 0.4
    - 0.45
    - 0.9
- text: In July 2012, the Sun launched a massive eruption matching the strongest storm ever recorded.
  emphasis:
  - massive eruption
  - ever recorded
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/The_Sun_Sends_Two_CMEs_Toward_Mercury_%288681308268%29.jpg/960px-The_Sun_Sends_Two_CMEs_Toward_Mercury_%288681308268%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Sun Sends Two CMEs Toward Mercury (8681308268).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Sun_Sends_Two_CMEs_Toward_Mercury_(8681308268).jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: July 2012
      small: The Sun Erupts
- text: This blast traveled over two thousand kilometers per second, four times faster than a typical storm.
  emphasis:
  - two thousand
  - four times faster
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Storms_From_the_Sun_%286819077978%29.jpg/1920px-Storms_From_the_Sun_%286819077978%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Storms From the Sun (6819077978).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Storms_From_the_Sun_(6819077978).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 2,000 km/s
      small: Record Speed
- text: It achieved this record speed because another eruption four days earlier had cleared its cosmic path.
  emphasis:
  - record speed
  - cleared its cosmic path
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Coronal_Mass_Ejection_Headed_for_Earth%3F_%284860149819%29.jpg/960px-Coronal_Mass_Ejection_Headed_for_Earth%3F_%284860149819%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Coronal Mass Ejection Headed for Earth? (4860149819).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Coronal_Mass_Ejection_Headed_for_Earth%3F_(4860149819).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: A direct hit would have crippled global power grids and water pumps, costing over two trillion dollars.
  emphasis:
  - crippled global power grids
  - two trillion dollars
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: $2 Trillion
      small: Estimated Cost
    motion: zoom_in
- text: Instead, NASA's STEREO-A spacecraft took the hit and survived to show us what we missed.
  emphasis:
  - STEREO-A spacecraft
  - what we missed
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Artist_rendering_of_STEREO-A_%28PIA18171%29.jpg/960px-Artist_rendering_of_STEREO-A_%28PIA18171%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Artist rendering of STEREO-A (PIA18171).jpg
      credit: NASA/GSFC
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Artist_rendering_of_STEREO-A_(PIA18171).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Physicist Pete Riley calculated a twelve percent chance a similar storm strikes Earth every decade.
  emphasis:
  - twelve percent
  - every decade
  visual:
    source: card
    card:
      kind: fact
      big: 12%
      small: Decadal Chance
    motion: zoom_in
- text: We survived only because the erupting region of the Sun was no longer pointed directly at us.
  emphasis:
  - no longer pointed
  - directly at us
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.2
    focus_y: 0.6
hook_text: 9-DAY NEAR MISS
