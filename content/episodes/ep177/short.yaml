- https://www.planetary.org/articles/billions-wasted-mysteries-unsolved-the-missions-nasa-may-be-forced-to-abandon
- http://www.eso.org/public/announcements/ann14059/
- https://www.jpl.nasa.gov/edu/resources/teachable-moment/nasas-new-horizons-mission-flies-by-pluto/
- https://www.space.com/33844-proxima-b-exoplanet-interstellar-mission.html
hashtags:
- '#space'
- '#newhorizons'
- '#pluto'
tags:
- new horizons
