id: ep406
title: Jupiter Will Outlive the Death of Our Sun
series: The Universe Is Terrifying
format: v3
description: When the Sun expands into a red giant and swallows the inner planets, outer gas giants like Jupiter and Saturn
  could survive.
sources:
- https://en.wikipedia.org/wiki/Future_of_Earth
- https://keckobservatory.org/white-dwarf-system/
- https://en.wikipedia.org/wiki/Timeline_of_the_far_future
