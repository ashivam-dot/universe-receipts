id: ep482
title: The Cosmic Monster Dragging Our Entire Galaxy
series: Scale Breaker
format: v3
description: 'Astronomers long blamed the Great Attractor for pulling our Milky Way, but a far larger titan is hauling everything
  across space: the Shapley Supercluster.'
