- http://www.atlasoftheuniverse.com/superc/shapley.html
hashtags:
- '#space'
- '#astronomy'
- '#milkyway'
tags:
- shapley supercluster
- great attractor
- milky way
- astronomy
- universe
- galaxies
- cosmic structure
