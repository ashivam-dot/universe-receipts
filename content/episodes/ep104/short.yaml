      title: Illustration of a Doomed Asteroid (2012-sgra-more-1 - sgra 1r).tiff
      credit: '(Credit: Illustrations: NASA/CXC/M.Weiss)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Illustration_of_a_Doomed_Asteroid_(2012-sgra-more-1_-_sgra_1r).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Astronomers estimate this doomed world has only a few million years left before it is completely destroyed.
  emphasis:
  - few million years
  - completely destroyed
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg/1920px-Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
