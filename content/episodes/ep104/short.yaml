id: ep104
title: The Pitch-Black Planet Eaten Alive by Its Star
series: Space Got Weird
description: Discover WASP-12b, a pitch-black hot Jupiter that absorbs nearly all starlight and is being consumed alive by
  its parent star.
sources:
- https://en.wikipedia.org/wiki/WASP-12b
- https://science.nasa.gov/missions/hubble/nasas-hubble-captures-blistering-pitch-black-planet/
- https://www.astronomy.com/science/hubble-finds-a-star-eating-a-planet/
- https://arxiv.org/abs/1911.09131
- https://www.scientificamerican.com/article/astronomers-discover-pitch-black-exoplanet/
- https://web.archive.org/web/20240404210231/https://www.nbcnews.com/id/wbna27222097
- http://wasp-planets.net/wasp-planets/
hashtags:
- '#space'
- '#exoplanets'
- '#astronomy'
tags:
- WASP-12b
- exoplanet
- hot Jupiter
- space got weird
- astronomy
- star
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A pitch-black planet is being eaten alive by its star.
  emphasis:
  - pitch-black planet
  - eaten alive
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/63/Star_Devouring_a_Planet_%282010-15-2725%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Star Devouring a Planet (2010-15-2725).jpg
      credit: 'Artwork: , , and G. Bacon (); Science: , , and C. Haswell (The Open University, UK)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Star_Devouring_a_Planet_(2010-15-2725).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Discovered in 2008, WASP-12b is a hot Jupiter orbiting its star every one point one days.
  emphasis:
  - discovered in 2008
  - hot Jupiter
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/53/Hot_Jupiter_exoplanet_in_the_star_cluster_Messier_67_%28eso1621a%29.tiff/lossy-page1-3840px-Hot_Jupiter_exoplanet_in_the_star_cluster_Messier_67_%28eso1621a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hot Jupiter exoplanet in the star cluster Messier 67 (eso1621a).tiff
      credit: ESO/L. Calçada
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Hot_Jupiter_exoplanet_in_the_star_cluster_Messier_67_(eso1621a).tiff
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2008'
      small: WASP-12b discovered
- text: The planet sits just two million miles away, locked in a permanent dayside.
  emphasis:
  - two million miles
  - permanent dayside
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/b7/Illustration_%28Artist%E2%80%99s_Impression%29_of_WASP-39_b_and_Its_Star_%28weic2221a%29.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Illustration (Artist’s Impression) of WASP-39 b and Its Star (weic2221a).jpeg
      credit: NASA, ESA, CSA, J. Olmsted (STScI)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Illustration_(Artist%E2%80%99s_Impression)_of_WASP-39_b_and_Its_Star_(weic2221a).jpeg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 2 Million Miles
      small: Distance to parent star
- text: Extreme gravitational forces have distorted this world into an egg shape.
  emphasis:
  - gravitational forces
  - egg shape
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/RochePotential.jpg/960px-RochePotential.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: RochePotential.jpg
      credit: Marc van der Sluys
      license: CC BY 2.5
      url: https://commons.wikimedia.org/wiki/File:RochePotential.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Dayside temperatures reach up to forty-seven hundred degrees Fahrenheit.
  emphasis:
  - forty-seven hundred degrees
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/21/SIRTF_and_the_Milky_Way%2C_an_Artist%27s_Concept.jpg/960px-SIRTF_and_the_Milky_Way%2C_an_Artist%27s_Concept.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: SIRTF and the Milky Way, an Artist's Concept.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:SIRTF_and_the_Milky_Way,_an_Artist%27s_Concept.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 4,700 °F
      small: Dayside temperature
- text: This intense heat allows the world to absorb ninety-four percent of starlight, making it as dark as fresh asphalt.
  emphasis:
  - ninety-four percent
  - fresh asphalt
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Kepler-10_star_system.jpg/3840px-Kepler-10_star_system.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Kepler-10 star system.jpg
      credit: NASA/Ames/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Kepler-10_star_system.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Its atmosphere has ballooned to nearly three times the radius of Jupiter, spilling material directly onto the host
    star.
  emphasis:
  - three times
  - spilling material
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Illustration_of_a_Doomed_Asteroid_%282012-sgra-more-1_-_sgra_1r%29.tiff/lossy-page1-3840px-Illustration_of_a_Doomed_Asteroid_%282012-sgra-more-1_-_sgra_1r%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
