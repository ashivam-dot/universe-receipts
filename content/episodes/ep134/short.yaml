id: ep134
title: The Interstellar Visitor That Sped Up
series: Space Got Weird
description: Discover the mysterious first known interstellar visitor, ʻOumuamua, which accelerated away from our Sun with
  no visible tail.
sources:
- https://en.wikipedia.org/wiki/1I/%CA%BBOumuamua
- https://solarsystem.nasa.gov/asteroids-comets-and-meteors/comets/oumuamua/in-depth.amp
- http://www.eso.org/public/news/eso1820/
- https://blog.sciandnature.com/2024/10/why-did-oumuamua-suddenly-accelerate.html
- http://www.scientificamerican.com/article/meet-oumuamua-the-first-ever-asteroid-from-another-star
- http://www.astronomy.com/news/2017/11/interstellar-asteroid-is-a-quarter-mile-long-red-beast
- https://www.nature.com/articles/s41586-022-05687-w
hashtags:
- '#space'
- '#astronomy'
- '#oumuamua'
tags:
- oumuamua
- interstellar
- astronomy
- comet
- space
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: An interstellar visitor sped up as it left without venting a tail.
  emphasis:
  - interstellar visitor
  - sped up
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Eso1737a-shorter.jpg/1920px-Eso1737a-shorter.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Eso1737a-shorter.jpg
      credit: Original ESO/M. Kornmesser  (+ background position from original change by Nagualdesign)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Eso1737a-shorter.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.53
    focus_y: 0.52
- text: On October nineteenth, 2017, the Pan-STARRS telescope in Hawaii discovered the object named ʻOumuamua.
  emphasis:
  - October nineteenth, 2017
  - Pan-STARRS telescope
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: October 19, 2017
      small: Pan-STARRS telescope
    motion: zoom_in
- text: Astronomers found a reddish, highly elongated body with an estimated length of roughly 400 meters.
  emphasis:
  - reddish
  - 400 meters
  visual:
    source: card
    card:
      kind: fact
      big: 400 meters
      small: Estimated length
    motion: zoom_in
- text: Observations revealed a length-to-width ratio of approximately 10 to 1 as its brightness varied by a factor of 10.
  emphasis:
  - 10 to 1
  - factor of 10
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Confirmed_Interstellar_Object_Paths_%28noirlab2322c%29.jpg/3840px-Confirmed_Interstellar_Object_Paths_%28noirlab2322c%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Confirmed Interstellar Object Paths (noirlab2322c).jpg
      credit: Rubin Observatory/NSF/AURA/J. Pinto
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Confirmed_Interstellar_Object_Paths_(noirlab2322c).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 10 to 1
      small: Length-to-width ratio
- text: Even when closest to the Sun, it showed zero signs of a coma, dust cloud, or tail.
  emphasis:
  - zero signs
  - dust cloud
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/C2020F3_%28NEOWISE%29_from_Estonia_2.jpg/3840px-C2020F3_%28NEOWISE%29_from_Estonia_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: C2020F3 (NEOWISE) from Estonia 2.jpg
      credit: Taavi Niittee
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:C2020F3_(NEOWISE)_from_Estonia_2.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Harvard astrophysicist Avi Loeb proposed the tumbling object could be an artificial light sail.
  emphasis:
  - Avi Loeb
  - artificial light sail
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Solar_sail_artist_conception.jpg/1280px-Solar_sail_artist_conception.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
