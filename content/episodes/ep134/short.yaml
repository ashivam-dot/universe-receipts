    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: quote
      big: Artificial light sail
      small: Avi Loeb
- text: While a 2023 theory points to invisible hydrogen gas venting from water ice, an interstellar visitor left without
    a tail.
  emphasis:
  - invisible hydrogen
  - left without a tail
  sfx: whoosh
