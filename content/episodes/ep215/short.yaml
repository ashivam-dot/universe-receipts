- https://web.archive.org/web/20130809125949/http://phys.org/news/2013-07-scotland-lunar-calendar-stone-age-rethink.html
- https://www.skyatnightmagazine.com/space-science/why-does-the-moons-appearance-change
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- Moon
