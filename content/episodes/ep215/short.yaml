voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Persistent myths claim Earth blocks the Sun to change the Moon's shape.
  emphasis:
  - persistent myths
  - Moon's shape
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/07/Full_disc_of_the_moon_was_photographed_by_the_Apollo_17_crewmen.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Full disc of the moon was photographed by the Apollo 17 crewmen.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Full_disc_of_the_moon_was_photographed_by_the_Apollo_17_crewmen.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This cycle has been tracked for nearly 10,000 years at the Warren Field site in Scotland.
  emphasis:
  - Warren Field site
  - 10,000 years
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: 10,000 Years Ago
      small: Warren Field, Scotland
    motion: zoom_in
- text: The ancient pit alignment beats any other formal record of human timekeeping ever discovered.
  emphasis:
  - ancient pit alignment
  - formal record
  visual:
    source: card
    card:
      kind: fact
      big: World Record
      small: Oldest Lunar Calendar
    motion: zoom_in
- text: Despite these millennia of observation, many people still misunderstand the physical trick behind these phases.
  emphasis:
  - misunderstand
  - physical trick
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Earthshine-_the_Moon_shining_in_reflected_light_from_the_Earth_%28eso1210c%29.tiff/lossy-page1-3840px-Earthshine-_the_Moon_shining_in_reflected_light_from_the_Earth_%28eso1210c%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Earthshine- the Moon shining in reflected light from the Earth (eso1210c).tiff
      credit: ESO/L. Calçada
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Earthshine-_the_Moon_shining_in_reflected_light_from_the_Earth_(eso1210c).tiff
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: The Sun constantly illuminates half the Moon, but our viewpoint shifts as it orbits Earth every 27.3 days.
  emphasis:
  - viewpoint shifts
  - 27.3 days
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e5/Popular_astronomy_airy%281881%29_page_230_figure_59.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Popular astronomy airy(1881) page 230 figure 59.png
      credit: George Biddel Airy
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Popular_astronomy_airy(1881)_page_230_figure_59.png
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 27.3 Days
      small: Orbital period
- text: We aren't seeing Earth’s shadow; we are watching the boundary between lunar day and night from different angles.
  emphasis:
  - boundary
  - different angles
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Art002e010032_%28April_6%2C_2026%29_%E2%80%93_The_Artemis_II_crew_captured_this_view_near_Hertzsprung_and_Vavilov_craters_along_the_lunar_terminator%2C_the_boundary_between_the_Moon%E2%80%99s_illuminated_and_shadowed_regions.jpg/3840px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Art002e010032 (April 6, 2026) – The Artemis II crew captured this view near Hertzsprung and Vavilov craters along
        the lunar terminator, the boundary between the Moon’s illuminated and shadowed regions.jpg
      credit: NASA Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Art002e010032_(April_6,_2026)_%E2%80%93_The_Artemis_II_crew_captured_this_view_near_Hertzsprung_and_Vavilov_craters_along_the_lunar_terminator,_the_boundary_between_the_Moon%E2%80%99s_illuminated_and_shadowed_regions.jpg
