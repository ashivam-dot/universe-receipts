id: ep215
title: Why the Moon Changes Shape
series: Space Myths, Busted
description: Discover the real reason behind the changing phases of the Moon.
sources:
- https://en.wikipedia.org/wiki/Lunar_phase
- https://discoverwildscience.com/what-causes-the-moons-phases-hint-not-earths-shadow-4-335112/
- https://scienceinsights.org/why-does-the-moons-appearance-change/
- https://www.sciencenewstoday.org/lunar-phases-the-28-day-cycle-of-light-and-shadow
- https://www.skyatnightmagazine.com/space-science/why-does-the-moons-appearance-change
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- Moon
- lunar phases
- astronomy
- space myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Earth's shadow does not cause the changing phases of the Moon.
  emphasis:
  - Earth's shadow
  - changing phases
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/LRO_WAC_Nearside_Mosaic.jpg/3840px-LRO_WAC_Nearside_Mosaic.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: LRO WAC Nearside Mosaic.jpg
      credit: NASA/GSFC/Arizona State University
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:LRO_WAC_Nearside_Mosaic.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: For centuries, a persistent historical myth erroneously blamed our planet for blocking the Sun entirely from our view.
  emphasis:
  - persistent historical myth
  - blocking the Sun
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Total_Lunar_Eclipse_%26_Blood_Moon_2025_%28GRC-2025-C-01613%29.jpg/3840px-Total_Lunar_Eclipse_%26_Blood_Moon_2025_%28GRC-2025-C-01613%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Total Lunar Eclipse & Blood Moon 2025 (GRC-2025-C-01613).jpg
      credit: NASA Glenn Research Center / NASA/Jordan Cochran
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Total_Lunar_Eclipse_%26_Blood_Moon_2025_(GRC-2025-C-01613).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: In physical reality, the Sun continuously illuminates exactly half of the lunar globe at all times without fail.
  emphasis:
  - continuously illuminates
  - half of the lunar globe
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/3840px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Sun by the Atmospheric Imaging Assembly of NASA's Solar Dynamics Observatory - 20100819.jpg
      credit: NASA/SDO (AIA)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: As the Moon travels along its orbital path around our world, our observing viewpoint shifts constantly every single
    night.
  emphasis:
  - orbital path
  - viewpoint shifts constantly
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Waxing_crescent_%285836481331%29.jpg/1920px-Waxing_crescent_%285836481331%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Waxing crescent (5836481331).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Waxing_crescent_(5836481331).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: This changing perspective creates everything from a delicate crescent phase to a brilliant full moon high overhead.
  emphasis:
  - changing perspective
  - brilliant full moon
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/First_Quarter_%2815982765351%29.jpg/960px-First_Quarter_%2815982765351%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: First Quarter (15982765351).jpg
      credit: NASA Goddard Space Flight Center from Greenbelt, MD, USA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:First_Quarter_(15982765351).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Earth's actual physical shadow only touches the lunar surface during rare lunar eclipses occurring roughly twice per
    calendar year.
  emphasis:
  - actual physical shadow
  - twice per calendar year
  visual:
    source: card
    card:
      kind: fact
      big: Twice a year
      small: lunar eclipses occur
    motion: zoom_in
- text: Earth's shadow never causes the phases.
  emphasis:
  - never causes the phases
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: SHADOW MYTH BUSTED
