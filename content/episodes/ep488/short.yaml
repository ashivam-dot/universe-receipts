id: ep488
title: NASA Caught a Star Swallowing Its Planet
series: Space Got Weird
format: v3
description: Astronomers expected a swollen red giant star to have devoured a nearby world, but Webb proved an unexpanded
  sun pulled the planet in through orbital decay.
