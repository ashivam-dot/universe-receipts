id: ep081
title: The 100,000-Year Journey of a Single Sunbeam
series: Space Myths, Busted
description: Discover how sunlight takes up to 100,000 years to escape the Sun's core while ghost particles escape in seconds.
sources:
- https://en.wikipedia.org/wiki/Solar_neutrino_problem
- https://neutrinos.fnal.gov/sources/solar-neutrinos/
- https://en.wikipedia.org/wiki/Solar_neutrino
- https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3417797
hashtags:
- '#space'
- '#sun'
- '#astronomy'
tags:
- sun
- solar core
- neutrinos
- photons
- space myth
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Sunlight feels instant, but its energy spent 100,000 years escaping the core.
  emphasis:
  - 100,000 years
  - escaping the core
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/3840px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Sun by the Atmospheric Imaging Assembly of NASA's Solar Dynamics Observatory - 20100819.jpg
      credit: NASA/SDO (AIA)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 100,000 years
      small: Sunlight escape time
- text: When nuclear fusion occurs deep inside the Sun, it releases tiny light particles called photons.
  emphasis:
  - nuclear fusion
  - photons
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/Proton%E2%80%93proton_chain_reaction.png/1280px-Proton%E2%80%93proton_chain_reaction.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Proton–proton chain reaction.png
      credit: Nagendra Nath Mondal
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Proton%E2%80%93proton_chain_reaction.png
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: These photons bounce constantly between dense particles in an epic and incredibly long obstacle course.
  emphasis:
  - bounce constantly
  - obstacle course
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Revolving_flows_inside_the_Sun%2C_as_seen_by_GONG_%28noao0002c%29.tiff/lossy-page1-500px-Revolving_flows_inside_the_Sun%2C_as_seen_by_GONG_%28noao0002c%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Revolving flows inside the Sun, as seen by GONG (noao0002c).tiff
      credit: Rachel Howe, Rudi Komm, Frank Hill/NSO/AURA/NSF
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Revolving_flows_inside_the_Sun,_as_seen_by_GONG_(noao0002c).tiff
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: At the very same exact time, nuclear reactions also release nearly massless ghost particles called neutrinos.
  emphasis:
  - ghost particles
  - neutrinos
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/57/FirstNeutrinoEventAnnotated.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: FirstNeutrinoEventAnnotated.jpg
      credit: Argonne National Laboratory
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:FirstNeutrinoEventAnnotated.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Because they interact so weakly with normal matter, neutrinos escape the dense core right away.
  emphasis:
  - interact so weakly
  - right away
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Borexino_schematic.jpg/1280px-Borexino_schematic.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Borexino schematic.jpg
      credit: Marco G. Giammarchi
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Borexino_schematic.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Detecting those mysterious neutrinos today proved the Sun produces the same energy now as it did long ago.
  emphasis:
  - same energy
  - long ago
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Neutrino_detector_-_National_Museum_of_Nature_and_Science%2C_Tokyo_-_DSC07827.JPG/1920px-Neutrino_detector_-_National_Museum_of_Nature_and_Science%2C_Tokyo_-_DSC07827.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Neutrino detector - National Museum of Nature and Science, Tokyo - DSC07827.JPG
      credit: Daderot
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Neutrino_detector_-_National_Museum_of_Nature_and_Science,_Tokyo_-_DSC07827.JPG
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Sunlight hitting your face today is actually an ancient relic spent escaping the core.
  emphasis:
  - ancient relic
  - escaping the core
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: 100,000 YEARS TO ESCAPE
