id: ep150
title: The Faint Blue Star That Held 40 Billion Suns
series: Scale Breaker
description: Mistaken for a faint star in 1957, TON 618 is actually an ultramassive black hole that outshines 140 trillion
  Suns.
sources:
- https://en.wikipedia.org/wiki/TON_618
- https://grokipedia.com/page/TON_618
hashtags:
- '#space'
