- '#astronomy'
tags:
- TON 618
- black hole
- quasar
- astronomy
- space facts
- Tonantzintla
- ultramassive
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Astronomers first saw a faint violet speck, calling it an ordinary star.
  emphasis:
  - faint violet speck
  - ordinary star
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/68/Camara_schmidt_tonantzintla.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Camara schmidt tonantzintla.jpg
      credit: Gsrdzl
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Camara_schmidt_tonantzintla.jpg
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: '1957'
      small: discovery photograph
- text: In 1957, Mexican astronomers catalogued it as entry 618, unaware of the monster lurking 10.8 billion light-years away.
  emphasis:
  - entry 618
  - 10.8 billion light-years
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: '1957'
      small: Tonantzintla Observatory
    motion: zoom_in
- text: This point of light is an ultramassive black hole with an event horizon radius of 1,300 astronomical units.
  emphasis:
  - ultramassive black hole
  - 1,300 astronomical units
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/f2/Artist%E2%80%99s_impression_of_quasar_J0313-1806.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Artist’s impression of quasar J0313-1806.jpg
      credit: NOIRLab/NSF/AURA/J. da Silva
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%E2%80%99s_impression_of_quasar_J0313-1806.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1,300 AU
      small: event horizon radius
- text: That is 40 times Pluto’s distance from the Sun, all contained within one dark sphere.
  emphasis:
  - 40 times Pluto
  - dark sphere
  visual:
    source: card
    card:
      kind: fact
      big: 40X Pluto
      small: the size of the orbit
    motion: zoom_in
- text: Gas whipping around the void at 10,000 kilometers per second fuels a brilliance equal to 140 trillion Suns.
  emphasis:
  - 10,000 kilometers per second
  - 140 trillion Suns
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Supermassive_black_hole.tif/lossy-page1-3840px-Supermassive_black_hole.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Supermassive black hole.tif
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Supermassive_black_hole.tif
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 140 Trillion
      small: times brighter than the Sun
- text: Initial measurements found 66 billion solar masses, later revised to 40.7 billion Suns.
  emphasis:
  - 66 billion
  - 40.7 billion Suns
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e5/Meyers_b15_s0117a.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Meyers b15 s0117a.jpg
      credit: various
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Meyers_b15_s0117a.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 40.7 Billion
      small: solar masses
- text: Wrapped in a glowing hydrogen nebula over 300,000 light-years across, it remains one of the heaviest objects in existence.
  emphasis:
  - 300,000 light-years
  - heaviest objects
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/MUSE_spies_accreting_giant_structure_around_a_quasar.tif/lossy-page1-500px-MUSE_spies_accreting_giant_structure_around_a_quasar.tif.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: MUSE spies accreting giant structure around a quasar.tif
      credit: ESO/Arrigoni Battaia et al.
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:MUSE_spies_accreting_giant_structure_around_a_quasar.tif
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 300,000
      small: light-year wide nebula
- text: No monster in the cosmos has ever hidden behind such a quiet disguise.
  emphasis:
  - monster
  - quiet disguise
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: 40 BILLION SUNS DISGUISED
