    focus_x: 0.47
    focus_y: 0.5
    card:
      kind: fact
      big: '1957'
      small: Tonantzintla Observatory plate
- text: In reality, TON 618 was an ultramassive black hole powered by a quasar 10.8 billion light-years away.
  emphasis:
  - ultramassive black hole
  - 10.8 billion light-years
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 10.8 Billion
      small: light-years lookback distance
    motion: zoom_in
- text: Its event horizon radius spans approximately 1,300 astronomical units, swallowing the scale of our solar system.
  emphasis:
  - 1,300 astronomical units
  - solar system
  visual:
    source: card
    card:
      kind: fact
      big: 1,300 AU
      small: event horizon radius
    motion: zoom_in
- text: Gas whipping around its core exceeds orbital speeds of 10,000 kilometers per second.
  emphasis:
  - 10,000 kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Beyond_the_Brink-_Tracking_a_Simulated_Plunge_into_a_Black_Hole_%28SVS14585_-_5_BH_Viz_41rg_069c%29.jpg/3840px-Beyond_the_Brink-_Tracking_a_Simulated_Plunge_into_a_Black_Hole_%28SVS14585_-_5_BH_Viz_41rg_069c%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Beyond the Brink- Tracking a Simulated Plunge into a Black Hole (SVS14585 - 5 BH Viz 41rg 069c).jpg
      credit: NASA's Scientific Visualization Studio - null
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Beyond_the_Brink-_Tracking_a_Simulated_Plunge_into_a_Black_Hole_(SVS14585_-_5_BH_Viz_41rg_069c).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 10,000 km/s
      small: orbital gas speed
- text: That infalling material unleashes a brilliance equal to 140 trillion Suns, completely drowning out its host galaxy.
  emphasis:
  - 140 trillion Suns
  - host galaxy
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/00/NASA%E2%80%99s_Webb_Will_Use_Quasars_to_Unlock_the_Secrets_of_the_Early_Universe_%2851656393132%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
