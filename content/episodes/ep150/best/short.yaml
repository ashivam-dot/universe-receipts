id: ep150
title: The Faint Blue Star That Held 40 Billion Suns
series: Scale Breaker
description: In 1957, astronomers mistook TON 618 for an ordinary faint blue star. It turned out to be an ultramassive black
  hole tens of billions of times heavier than our Sun.
sources:
- https://en.wikipedia.org/wiki/TON_618
- https://grokipedia.com/page/TON_618
hashtags:
- '#space'
- '#blackhole'
- '#astronomy'
tags:
- TON 618
- black hole
- ultramassive black hole
- quasar
- astronomy
- space facts
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Astronomers catalogued a faint violet speck, assuming it was an ordinary star.
  emphasis:
  - faint violet speck
  - ordinary star
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/6/68/Camara_schmidt_tonantzintla.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
