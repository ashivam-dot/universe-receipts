    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Command_and_Service_Modules%2C_Apollo_-105%2C_ASTP_Mockup_-_DPLA_-_a0ec1c586f20e26eb3f3b857f4fd819b_%28page_2%29.jpg/1920px-Command_and_Service_Modules%2C_Apollo_-105%2C_ASTP_Mockup_-_DPLA_-_a0ec1c586f20e26eb3f3b857f4fd819b_%28page_2%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
