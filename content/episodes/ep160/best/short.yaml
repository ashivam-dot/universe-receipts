- text: Its relentless gravitational tides dragged and compressed the giant's disk, triggering furious stellar nurseries.
  emphasis:
  - gravitational tides
  - stellar nurseries
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/fb/NGC_772_A_Rival_to_the_Milky_Way.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
