- text: Back in 1860, astronomers at the Bonn Observatory cataloged a faint star in the constellation Scutum.
  emphasis:
  - Bonn Observatory
  - constellation Scutum
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Bad_Godesberg_P%C3%A4dagogium_Architektenzeichnung_Neubau_1899.jpg/1280px-Bad_Godesberg_P%C3%A4dagogium_Architektenzeichnung_Neubau_1899.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
