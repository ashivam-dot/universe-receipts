    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: In 2012, Very Large Telescope interferometry in Chile calculated a staggering radius of 1,708 solar radii.
  emphasis:
  - Very Large Telescope
  - 1,708 solar radii
  sfx: riser
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 1,708 Solar Radii
      small: Old radius estimate
    motion: zoom_in
- text: This massive size crowned UY Scuti the largest known star, with a volume swallowing Jupiter's orbit.
  emphasis:
  - largest known star
  - Jupiter's orbit
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/6_Hebe_orbit.jpg/1280px-6_Hebe_orbit.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: 6 Hebe orbit.jpg
      credit: NASA/JPL
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:6_Hebe_orbit.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: However, newer Gaia space telescope data revised its distance closer to Earth.
  emphasis:
  - Gaia space telescope
  - revised its distance
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Gaia_optics.jpg/3840px-Gaia_optics.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
