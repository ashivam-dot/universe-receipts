      small: Bonn Observatory
- text: Originally designated as BD-12 degrees 5055, its flickering brightness revealed a pulsating variable star.
  emphasis:
  - variable star
  - flickering brightness
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/7c/Light_curve_of_Cepheid_variable_star_V1_%28opo1115e%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
