id: ep010
title: The Faint Blue Star That Was 40 Billion Suns
series: Scale Breaker
description: In 1957, entry TON 618 was catalogued as an ordinary faint blue star. Decades later, astronomers discovered an
  ultramassive black hole shining with the light of 140 trillion Suns.
