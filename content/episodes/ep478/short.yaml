id: ep478
title: Seven Earths Huddled Around a Tiny Sun
series: Space Got Weird
format: v3
description: The TRAPPIST-1 system packs seven Earth-sized worlds into a space smaller than Mercury's orbit, creating a world
  of eternal fire and ice.
