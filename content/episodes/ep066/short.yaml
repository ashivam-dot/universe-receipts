id: ep066
title: The Extreme 18-Hour World of 55 Cancri e
series: Space Got Weird
description: Discover 55 Cancri e, an extreme super-Earth orbiting so close to its star that its year lasts only eighteen
  hours, featuring a magma ocean and a volatile atmosphere.
