id: ep490
title: The Sun is the most perfectly round object in nature
series: Scale Breaker
format: v3
description: NASA measurements from the Solar Dynamics Observatory show that the Sun holds a nearly perfect round shape despite
  violent magnetic cycles. It contains over 99 percent of all mass in our solar system.
