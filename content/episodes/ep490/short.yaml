- https://en.wikipedia.org/wiki/Solar_mass
- https://www.scientificamerican.com/article/how-do-scientists-measure/
- https://www.nature.com/articles/s41586-020-2934-0
- https://sci.esa.int/web/soho/-/36805-the-distortion-of-the-heliosphere
hashtags:
- '#space'
- '#sun'
- '#nasa'
tags:
- sun
- solar system
- nasa
- sdo
- fusion
- heliosphere
- voyager
- cavendish
