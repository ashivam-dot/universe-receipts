id: ep065
title: Why astronauts float in space
series: Space Myths, Busted
description: Discover the surprising truth about why astronauts float on the International Space Station.
sources:
- https://www.spaceunpacked.com/explainers/why-astronauts-float-real-reason-weightlessness
- https://sentinelmission.org/blog/why-do-astronauts-float-if-there-is-gravity/
- https://en.wikipedia.org/wiki/Weightlessness
- https://www.space.com/23017-weightlessness.html
- https://www.ebsco.com/research-starters/physics/understanding-weightless-flight
hashtags:
- '#space'
- '#nasa'
- '#astronomy'
tags:
- astronauts
- gravity
- International Space Station
- physics
- space
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Astronauts don't float in space because gravity is gone.
  emphasis:
  - don't float
  - gravity is gone
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/47/Iss017e011910.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Iss017e011910.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iss017e011910.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.53
    focus_y: 0.58
    box:
    - 0.44
    - 0.43
    - 0.65
    - 0.81
- text: At the altitude of the International Space Station, Earth's gravity is roughly ninety percent as strong as it is at
    the surface.
  emphasis:
  - altitude
  - ninety percent
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Earth-Slip.png/960px-Earth-Slip.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Earth-Slip.png
      credit: Email4mobile (talk)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Earth-Slip.png
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90%
      small: Gravity strength at ISS
- text: So why does the crew experience total weightlessness?
  emphasis:
  - total weightlessness
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/ISS-53_Aleksandr_Misurkin_and_Sergey_Ryazansky_inside_the_Harmony_module.jpg/3840px-ISS-53_Aleksandr_Misurkin_and_Sergey_Ryazansky_inside_the_Harmony_module.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-53 Aleksandr Misurkin and Sergey Ryazansky inside the Harmony module.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-53_Aleksandr_Misurkin_and_Sergey_Ryazansky_inside_the_Harmony_module.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.61
    focus_y: 0.38
    box:
    - 0.44
    - 0.15
    - 0.85
    - 0.95
- text: The answer is that they and their spacecraft are in a continuous state of free fall.
  emphasis:
  - continuous state of free fall
  sfx: riser
  pause_after: 0.4
  visual:
    reuse: 3
    motion: zoom_in
    focus_x: 0.61
    focus_y: 0.38
- text: The station moves sideways so fast that as it falls toward the planet, the surface curves away beneath it.
  emphasis:
  - moves sideways
  - curves away
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/da/NISAR_satellite_orbit_%28SVS5615_-_2415%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: NISAR satellite orbit (SVS5615 - 2415).jpg
      credit: NASA's Scientific Visualization Studio - Science and Technology Corporation/Kel Elkins
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NISAR_satellite_orbit_(SVS5615_-_2415).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: This means the crew completes one full orbit around Earth approximately every ninety minutes.
  emphasis:
  - full orbit
  - ninety minutes
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/ISS062-E-41544_-_View_of_Earth.jpg/3840px-ISS062-E-41544_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS062-E-41544 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, NASA Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS062-E-41544_-_View_of_Earth.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 90 minutes
      small: One full orbit
- text: Because everything falls together, there is no floor pushing back, proving astronauts don't float because gravity
    is gone.
  emphasis:
  - falls together
  - no floor pushing back
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.53
    focus_y: 0.58
hook_text: GRAVITY IS STILL THERE
