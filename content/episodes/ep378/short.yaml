- text: One day on Venus actually lasts longer than its year.
  emphasis:
  - longer
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/83/Global_view_uvi_Venus_%28Akatsuki%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
