- text: But the planet’s gravity is so intense it crushes water into exotic ice despite that heat.
  emphasis:
  - intense
  - exotic ice
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Crystal_structure_of_ice_VII.png/960px-Crystal_structure_of_ice_VII.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
