- text: This extreme proximity bakes the planet’s surface to over 800 degrees Fahrenheit.
  emphasis:
  - 800 degrees
  - bakes
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: 800 degrees
      small: Fahrenheit
