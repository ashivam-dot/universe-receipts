id: ep193
title: The Cosmic Wall That Shouldn't Exist
series: Scale Breaker
description: Discover the Hercules-Corona Borealis Great Wall, a titanic ten-billion-light-year structure that challenges
  our understanding of the universe.
sources:
- https://en.wikipedia.org/wiki/Hercules%E2%80%93Corona_Borealis_Great_Wall
