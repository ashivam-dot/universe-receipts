- https://www.spacegroup.no/between-hercules-and-corona-borealis-a-10-billion-light-year-structure-once-thought-impossible-by-cosmologists/
- https://www.scienceabc.com/nature/universe/what-is-the-biggest-thing-in-the-universe
- https://www.space.com/the-universe/gamma-ray-bursts-reveal-largest-structure-in-the-universe-is-bigger-and-closer-to-earth-than-we-knew-the-jury-is-still-out-on-what-it-all-means
- https://www.sciencealert.com/largest-structure-in-the-universe-may-be-50-larger-than-we-thought
