id: ep258
title: Why Saturn's Rings VANISHED From Galileo
series: Space Myths, Busted
format: v3
description: When Galileo first observed Saturn in 1610, his telescope was too blurry to show rings. Sourced from NASA historical
  archives and Cassini mission data.
