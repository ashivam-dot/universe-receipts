id: ep200
title: Why Astronauts Aren't Actually in Zero Gravity
series: Space Myths, Busted
description: Astronauts aboard the space station are not floating in a zero-gravity void. They are in perpetual free fall
  around Earth under nearly full planetary gravity.
sources:
- https://en.wikipedia.org/wiki/Weightlessness
- https://www.space.com/23017-weightlessness.html
- https://physicstribune.com/gravity/weightlessness/
- https://www.physicsclassroom.com/tutorial/circular-and-satellite-motion/satellite-motion/weightlessness-in-orbit
- https://www.ebsco.com/research-starters/physics/understanding-weightless-flight
hashtags:
- '#space'
- '#physics'
- '#iss'
tags:
- weightlessness
- zero gravity
- space station
- physics
- free fall
- astronomy
- microgravity
voice:
  voice: af_heart
  speed: 1.05
beats:
