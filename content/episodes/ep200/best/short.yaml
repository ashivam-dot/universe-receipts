  emphasis:
  - ninety percent
  - surface gravity
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/STS-135_final_flyaround_of_ISS_1.jpg/3840px-STS-135_final_flyaround_of_ISS_1.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
