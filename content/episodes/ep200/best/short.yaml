      title: STS-135 final flyaround of ISS 1.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS-135_final_flyaround_of_ISS_1.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.38
    focus_y: 0.4
    box:
    - 0.22
    - 0.05
    - 0.58
    - 0.73
    card:
      kind: fact
      big: 89%
      small: orbital gravity strength
- text: Most people assume astronauts float weightlessly because Earth's gravity disappears in space.
  emphasis:
  - disappears in space
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/48/Iss018e014682.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Iss018e014682.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iss018e014682.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.57
    focus_y: 0.65
    box:
    - 0.38
    - 0.44
    - 0.78
    - 0.99
- text: At a normal orbital altitude of four hundred kilometers, gravity still measures eight point seven meters per second
    squared.
  emphasis:
  - four hundred kilometers
  - eight point seven
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/ISS055-E-102134_-_View_of_Earth.jpg/3840px-ISS055-E-102134_-_View_of_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS055-E-102134 - View of Earth.jpg
      credit: Earth Science and Remote Sensing Unit, NASA Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS055-E-102134_-_View_of_Earth.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 8.7 m/s²
      small: gravitational acceleration at 400 km
- text: The sensation of weight does not come from gravity, but from contact forces like floors pushing against your body.
  emphasis:
  - contact forces
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c0/Freebodydiagram_PNBG.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Freebodydiagram PNBG.png
      credit: Penubag
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Freebodydiagram_PNBG.png
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Without a supporting force resisting you, apparent weight completely drops to zero.
  emphasis:
  - drops to zero
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/STS-135_Sandy_Magnus_in_the_Cupola.jpg/3840px-STS-135_Sandy_Magnus_in_the_Cupola.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: STS-135 Sandy Magnus in the Cupola.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:STS-135_Sandy_Magnus_in_the_Cupola.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.55
    focus_y: 0.65
    box:
    - 0.2
    - 0.35
    - 0.9
    - 0.98
- text: Astronauts appear to float because they and the station accelerate downward at the exact same rate.
  emphasis:
  - exact same rate
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Newton%27s_cannonball_cropped.png/1920px-Newton%27s_cannonball_cropped.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Newton's cannonball cropped.png
      credit: Isaac Newton
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Newton%27s_cannonball_cropped.png
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Immense horizontal speed causes Earth's curved surface to drop away as fast as the spacecraft falls.
  emphasis:
  - horizontal speed
  - drop away
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Iss071e489468_%28Aug._17%2C_2024%29_---_The_Progress_89_cargo_craft_approaches_the_International_Space_Station.jpg/3840px-Iss071e489468_%28Aug._17%2C_2024%29_---_The_Progress_89_cargo_craft_approaches_the_International_Space_Station.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Iss071e489468 (Aug. 17, 2024) --- The Progress 89 cargo craft approaches the International Space Station.jpg
      credit: NASA Johnson Space Center
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Iss071e489468_(Aug._17,_2024)_---_The_Progress_89_cargo_craft_approaches_the_International_Space_Station.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.34
    focus_y: 0.75
- text: Weightlessness is never the absence of gravity, but an unending fall around the planet.
  emphasis:
  - unending fall
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.38
    focus_y: 0.4
hook_text: FALLING, NOT FLOATING
