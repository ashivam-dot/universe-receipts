id: ep093
title: Why We Only Ever See One Side of the Moon
series: Space Myths, Busted
description: Discover the truth about tidal locking and how the Soviet Luna 3 spacecraft first photographed the hidden far
  side of the Moon in 1959.
sources:
- https://en.wikipedia.org/wiki/Tidal_locking
- https://science.nasa.gov/moon/tidal-locking/
- https://www.astronomy.com/science/why-does-the-same-side-of-the-moon-always-face-earth/
- https://www.lunarprobe.com/guides/tidal-locking/
- http://www.universetoday.com/128350/will-earth-lock-moon/
hashtags:
- '#space'
- '#moon'
- '#astronomy'
tags:
- Moon
- tidal locking
- Luna 3
- space myth
- astronomy
- Soviet Union
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Think the Moon doesn't spin? That is a total myth.
  emphasis:
  - doesn't spin
  - total myth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1920px-NASA-Apollo8-Dec24-Earthrise.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-Apollo8-Dec24-Earthrise.jpg
      credit: NASA/Bill Anders
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-Apollo8-Dec24-Earthrise.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: The Moon actually rotates on its axis at the exact same speed it orbits our home planet.
  emphasis:
  - rotates on its axis
  - same speed
  sfx: whoosh
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: This cosmic synchronization keeps the exact same side facing Earth forever.
  emphasis:
  - cosmic synchronization
  - facing Earth forever
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/71/Tidal_bulge.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Tidal bulge.png
      credit: Orion 8
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Tidal_bulge.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Earth's immense gravity constantly stretches the Moon into tidal bulges that generate gravitational torque.
  emphasis:
  - stretches the Moon
  - gravitational torque
  sfx: riser
  visual:
    source: url
    url: https://iiif.wellcomecollection.org/image/V0025022/full/!1920,1920/0/default.jpg
    credit:
      source: Wellcome Collection
      title: 'Astronomy: eclipses (top), and the Moon''s passage around the Earth. Coloured engraving by J. Emslie, 1851,
        after himself'
      credit: Wellcome Collection
      license: Public domain
      url: https://wellcomecollection.org/works/dmzeqfcb
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: In 1959, the Soviet spacecraft Luna 3 successfully transmitted the very first photographs of the far side.
  emphasis:
  - '1959'
  - Luna 3
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/86/Luna-3_%28Memorial_Museum_of_Astronautics%29.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Luna-3 (Memorial Museum of Astronautics).JPG
      credit: Armael
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Luna-3_(Memorial_Museum_of_Astronautics).JPG
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1959'
      small: Luna 3 Mission
- text: This tidal locking is precisely why humanity never caught a single glimpse of that hidden hemisphere before.
  emphasis:
  - tidal locking
  - hidden hemisphere
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2a/Moon_PIA00304.jpg/1280px-Moon_PIA00304.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon PIA00304.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Moon_PIA00304.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Because tidal locking ensures the Moon's rotation matches its orbit, you have to wonder if it ever stays still.
  emphasis:
  - rotation matches its orbit
  - stays still
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: THE MOON ACTUALLY SPINS
