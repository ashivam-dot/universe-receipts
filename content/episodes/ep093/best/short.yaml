id: ep093
title: Why We Only See One Side of the Moon
series: Space Myths, Busted
description: Discover the truth about tidal locking and how the Soviet Luna 3 spacecraft first photographed the hidden far
  side of the Moon in 1959.
sources:
- https://en.wikipedia.org/wiki/Tidal_locking
- https://science.nasa.gov/moon/tidal-locking/
- https://www.astronomy.com/science/why-does-the-same-side-of-the-moon-always-face-earth/
- https://www.lunarprobe.com/guides/tidal-locking/
- http://www.universetoday.com/128350/will-earth-lock-moon/
- https://www.planetary.org/articles/1017-rapidly-rotating-regular-satellites-and-tides
hashtags:
- '#space'
- '#moon'
- '#luna3'
tags:
- Moon
- tidal locking
- Luna 3
- astronomy
- Soviet Union
- space myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Think the Moon doesn't spin? That is a total myth.
  emphasis:
  - doesn't spin
  - total myth
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/NASA-Apollo8-Dec24-Earthrise.jpg/1920px-NASA-Apollo8-Dec24-Earthrise.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: NASA-Apollo8-Dec24-Earthrise.jpg
      credit: NASA/Bill Anders
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:NASA-Apollo8-Dec24-Earthrise.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Our Moon actually rotates on its axis at the exact same speed it orbits Earth, a perfect celestial match.
  emphasis:
  - rotates on its axis
  - exact same speed
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Solar_eclipse_taken_from_Artemis_II_-_April_2026.jpg/3840px-Solar_eclipse_taken_from_Artemis_II_-_April_2026.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Solar eclipse taken from Artemis II - April 2026.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Solar_eclipse_taken_from_Artemis_II_-_April_2026.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.41
    focus_y: 0.51
    box:
    - 0.25
    - 0.27
    - 0.56
    - 0.73
- text: This synchronous tidal locking is caused by Earth's gravity stretching the lunar body into subtle, physical bulges.
  emphasis:
  - tidal locking
  - physical bulges
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/7/71/Tidal_bulge.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Tidal bulge.png
      credit: Orion 8
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Tidal_bulge.png
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.68
    focus_y: 0.64
    box:
    - 0.51
    - 0.39
    - 0.86
    - 0.87
- text: As the Moon spins, these bulges get carried slightly out of alignment, generating a powerful gravitational braking
    torque.
  emphasis:
  - out of alignment
  - braking torque
  visual:
    source: url
    url: https://iiif.wellcomecollection.org/image/V0025022/full/!1920,1920/0/default.jpg
    credit:
      source: Wellcome Collection
      title: 'Astronomy: eclipses (top), and the Moon''s passage around the Earth. Coloured engraving by J. Emslie, 1851,
        after himself'
      credit: Wellcome Collection
      license: Public domain
      url: https://wellcomecollection.org/works/dmzeqfcb
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.77
    focus_y: 0.72
    box:
    - 0.58
    - 0.52
    - 0.96
    - 0.91
- text: This constant friction slows its rotation and pushes the Moon away from us by four centimeters every year.
  emphasis:
  - slows its rotation
  - four centimeters
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/3d/Released_to_Public_Earth_by_NASA_%28NASA%2C_GPN-2000-001437%29_%28241635550%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Released to Public Earth by NASA (NASA, GPN-2000-001437) (241635550).jpg
      credit: pingnews.com
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Released_to_Public_Earth_by_NASA_(NASA,_GPN-2000-001437)_(241635550).jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 4 centimeters
      small: annual drift from Earth
- text: Because of this locking, humanity did not see the far side until the Soviet probe Luna 3 photographed it in 1959.
  emphasis:
  - far side
  - Luna 3 photographed it
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/86/Luna-3_%28Memorial_Museum_of_Astronautics%29.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Luna-3 (Memorial Museum of Astronautics).JPG
      credit: Armael
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Luna-3_(Memorial_Museum_of_Astronautics).JPG
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.43
    focus_y: 0.45
    box:
    - 0.06
    - 0.06
    - 0.8
    - 0.82
    card:
      kind: dateline
      big: '1959'
      small: Luna 3 Mission
- text: Tidal locking hides the far side, which is why people still believe the Moon never rotates.
  emphasis:
  - hides the far side
  - never rotates
