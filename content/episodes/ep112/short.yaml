    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: In July 2019, 2019 OK screamed past us at nearly 55,000 miles per hour.
  emphasis:
  - 2019 OK
  - 55,000 miles
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: July 2019
      small: Earth's orbit
    motion: zoom_in
- text: The football-field-sized rock missed our planet by about 45,000 miles.
  emphasis:
  - football-field-sized
  - 45,000 miles
  visual:
    source: card
    card:
      kind: fact
      big: 45,000 miles
      small: miss distance
    motion: zoom_in
- text: That is less than one-fifth of the distance to the Moon.
  emphasis:
  - one-fifth
  - distance to the Moon
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Moon_Phase_and_Libration%2C_2026_%28SVS5587_-_fancy%29.jpg/1280px-Moon_Phase_and_Libration%2C_2026_%28SVS5587_-_fancy%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
