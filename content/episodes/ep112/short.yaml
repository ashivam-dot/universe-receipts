- text: A city-killer asteroid hid in plain sight until just before impact.
  emphasis:
  - city-killer asteroid
  - plain sight
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c0/Asteroidsscale.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
