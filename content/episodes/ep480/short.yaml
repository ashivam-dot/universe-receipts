    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Rho_Ophiuchi_%28NIRCam_Compass_Image%29_%282023-128%29.png/1920px-Rho_Ophiuchi_%28NIRCam_Compass_Image%29_%282023-128%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
