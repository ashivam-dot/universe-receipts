  emphasis:
  - didn't carve
  - drifted into it
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Solar_System-_EIC_Display_%28SVS5674_-_4%29.jpg/3840px-Solar_System-_EIC_Display_%28SVS5674_-_4%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
