  - radioactive iron
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/Seafloor_Crust_USGS.jpg/960px-Seafloor_Crust_USGS.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
