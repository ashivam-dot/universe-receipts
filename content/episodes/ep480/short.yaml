  - million degrees
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/NGC_7635HSTFull.jpg/1280px-NGC_7635HSTFull.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
