id: ep499
title: The quasar wall that might not be real
series: Scale Breaker
format: v3
description: Astronomers mapped 73 quasars into a wall 4 billion light-years across, but later analysis suggests it might
  just be a statistical fluke.
sources:
- https://web.archive.org/web/20130114020821/http://www.ras.org.uk/news-and-press/224-news-2013/2212-astronomers-discover-the-largest-structure-in-the-universe
- http://www.sci-news.com/astronomy/article00818.html
- https://en.wikipedia.org/wiki/Huge-LQG
- https://arxiv.org/abs/1306.1700
hashtags:
- '#space'
- '#quasars'
- '#cosmology'
tags:
- quasars
- Huge-LQG
- cosmological principle
- large scale structure
- Sloan Digital Sky Survey
- Roger Clowes
