id: ep188
title: Are the Pillars of Creation Already Gone?
series: Scale Breaker
description: The iconic Pillars of Creation span four light-years across the Eagle Nebula. But infrared observations suggest
  a supernova blast may have already wiped them out.
sources:
- https://en.wikipedia.org/wiki/Pillars_of_Creation
- https://science.nasa.gov/asset/hubble/gas-pillars-in-the-eagle-nebula-m16-pillars-of-creation-in-a-star-forming-region/
- https://www.astronomy.com/space-exploration/hubble-goes-high-def-to-revisit-the-iconic-pillars-of-creation/
- https://web.archive.org/web/20200804113855/https://www.nationalgeographic.com/science/phenomena/2015/01/05/hubble-revisits-an-icon-the-pillars-of-creation/
- https://web.archive.org/web/20150317152526/https://www.newscientist.com/article/dn10925-pillars-of-creation-destroyed-by-supernova.html#.VQhHZ_Lgpt8
- https://www.pbs.org/wgbh/nova/origins/hubb-16.html
- https://chandra.harvard.edu/blog/node/922
hashtags:
- '#space'
- '#astronomy'
- '#hubble'
tags:
- pillars of creation
- eagle nebula
- hubble
- spitzer
- supernova
- astronomy
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The four-light-year Pillars of Creation may have already been completely destroyed.
  emphasis:
  - four-light-year
  - completely destroyed
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Pillars_of_Creation_%28NIRCam_Image%29.png/1920px-Pillars_of_Creation_%28NIRCam_Image%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Pillars of Creation (NIRCam Image).png
      credit: NASA, ESA, CSA, STScI; Joseph DePasquale (STScI), Anton M. Koekemoer (STScI), Alyssa Pagan (STScI)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Pillars_of_Creation_(NIRCam_Image).png
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Hubble captured these towers in 1995, revealing embryonic stars forming inside dense hydrogen pockets called EGGs.
  emphasis:
  - '1995'
  - EGGs
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Eagle_nebula_pillars.jpg/1920px-Eagle_nebula_pillars.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Eagle nebula pillars.jpg
      credit: 'Credit: NASA, Jeff Hester, and Paul Scowen (Arizona State University)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Eagle_nebula_pillars.jpg
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.45
    focus_y: 0.5
    card:
      kind: dateline
      big: '1995'
      small: Hubble Space Telescope
- text: Nearby massive stars blast intense ultraviolet radiation and stellar winds across the gas.
  emphasis:
  - ultraviolet radiation
  - stellar winds
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Wide-Field_Image_of_the_Eagle_Nebula_%282005-12-1673%29.tiff/lossy-page1-1920px-Wide-Field_Image_of_the_Eagle_Nebula_%282005-12-1673%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Wide-Field Image of the Eagle Nebula (2005-12-1673).tiff
      credit: T.A.Rector (University of Alaska Anchorage, NRAO/AUI/NSF and NOAO//NSF) and B.A.Wolpa (NOAO//NSF)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Wide-Field_Image_of_the_Eagle_Nebula_(2005-12-1673).tiff
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: This photoevaporation slowly strips the gas away from each developing protostar.
  emphasis:
  - photoevaporation
  - strips the gas
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/3/32/Stellar_%22Eggs%22_Emerge_from_Molecular_Cloud-_Closeup_of_Evaporating_Globules_in_M16_%281995-44-352%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Stellar "Eggs" Emerge from Molecular Cloud- Closeup of Evaporating Globules in M16 (1995-44-352).jpg
      credit: 'Credit: NASA, ESA, STScI, J. Hester and P. Scowen (Arizona State University)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Stellar_%22Eggs%22_Emerge_from_Molecular_Cloud-_Closeup_of_Evaporating_Globules_in_M16_(1995-44-352).jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.45
- text: When an EGG is uncovered, its forming star abruptly stops growing.
  emphasis:
  - stops growing
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Festive_and_Free-Floating_%28potw2251a%29.jpg/3840px-Festive_and_Free-Floating_%28potw2251a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Festive and Free-Floating (potw2251a).jpg
      credit: ESA/Hubble & NASA, R. Sahai
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Festive_and_Free-Floating_(potw2251a).jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.4
    focus_y: 0.23
- text: Spitzer observations suggest a supernova shockwave wiped out the pillars 6,000 years ago.
  emphasis:
  - supernova shockwave
  - 6,000 years ago
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e7/A_Great_Observatories_Perspective_of_the_Eagle_Nebula_%28M16%29_%282007-m16-more-5%29.tiff/lossy-page1-1920px-A_Great_Observatories_Perspective_of_the_Eagle_Nebula_%28M16%29_%282007-m16-more-5%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A Great Observatories Perspective of the Eagle Nebula (M16) (2007-m16-more-5).tiff
      credit: '(Credit: X-ray: NASA/CXC/U.Colorado/Linsky et al.; Optical: NASA/ESA/STScI/ASU/J.Hester & P.Scowen; Infrared:
        NASA/JPL-Caltech/SSC/N.Flagey & A.Noriega-Crespo)'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:A_Great_Observatories_Perspective_of_the_Eagle_Nebula_(M16)_(2007-m16-more-5).tiff
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 6,000 years ago
      small: suspected supernova blast
- text: Astronomer Stephen Reynolds disputed the blast, arguing stellar winds heat the dust and erode it gradually.
  emphasis:
  - Stephen Reynolds
  - erode it gradually
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Hubble%27s_Pillars_of_Creation_2014_%2816223013872%29.png/3840px-Hubble%27s_Pillars_of_Creation_2014_%2816223013872%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble's Pillars of Creation 2014 (16223013872).png
      credit: geckzilla
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Hubble%27s_Pillars_of_Creation_2014_(16223013872).png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Because the nebula sits 7,000 light-years away, telescopes must wait 1,000 years to see if we are still watching them.
  emphasis:
  - 7,000 light-years
  - 1,000 years
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: 7,000 LIGHT-YEARS AWAY
