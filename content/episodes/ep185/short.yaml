id: ep185
title: Why Space Will NEVER Make You Explode
series: Space Myths, Busted
description: Hollywood taught us that space causes human bodies to burst and freeze instantly. Here is what actually happens
  when you decompress in the void.
sources:
- https://en.wikipedia.org/wiki/Effect_of_spaceflight_on_the_human_body
- https://imagine.gsfc.nasa.gov/ask_astro/space_travel.html
hashtags:
- '#space'
- '#nasa'
- '#science'
tags:
- space vacuum
- decompression
- human body in space
- jim leblanc
- ebullism
- space myths
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Exposing your body to space will never make you explode.
  emphasis:
  - never make you explode
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Nicole_Stott_participates_in_the_STS-128_mission%27s_first_spacewalk.jpg/3840px-Nicole_Stott_participates_in_the_STS-128_mission%27s_first_spacewalk.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Nicole Stott participates in the STS-128 mission's first spacewalk.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Nicole_Stott_participates_in_the_STS-128_mission%27s_first_spacewalk.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.53
    focus_y: 0.55
    box:
    - 0.31
    - 0.28
    - 0.88
    - 0.89
- text: Sci-fi films depict violent ruptures, but human skin easily prevents you from bursting.
  emphasis:
  - human skin
  - bursting
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: NO EXPLOSION
      small: Skin holds pressure
    motion: zoom_in
- text: Instant freezing is impossible too, since a vacuum only sheds heat slowly through radiation.
  emphasis:
  - Instant freezing
  - slowly through radiation
  visual:
    source: card
    card:
      kind: fact
      big: SLOW HEAT LOSS
      small: Radiative cooling only
    motion: zoom_in
- text: Instead, ebullism forms gas bubbles in your tissues, swelling you up to twice your size.
  emphasis:
  - ebullism
  - twice your size
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.53
    focus_y: 0.55
- text: Worse, your lungs reverse function, actively stripping oxygen right out of your blood.
  emphasis:
  - reverse function
  - stripping oxygen
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/XBio_illustration_%E2%80%93_Gas_Exchange.png/1280px-XBio_illustration_%E2%80%93_Gas_Exchange.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: XBio illustration – Gas Exchange.png
      credit: explorebiology
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:XBio_illustration_%E2%80%93_Gas_Exchange.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: REVERSED LUNGS
      small: Oxygen stripped from blood
- text: In the mid-1960s, NASA technician Jim LeBlanc accidentally depressurized inside a vacuum chamber.
  emphasis:
  - Jim LeBlanc
  - vacuum chamber
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Space_Environment_Simulation_Chamber%2C_NASA%2C_Houston_%28Harris_County%2C_Texas%29.jpg/1280px-Space_Environment_Simulation_Chamber%2C_NASA%2C_Houston_%28Harris_County%2C_Texas%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Space Environment Simulation Chamber, NASA, Houston (Harris County, Texas).jpg
      credit: NASA photographer
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Space_Environment_Simulation_Chamber,_NASA,_Houston_(Harris_County,_Texas).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: MID-1960s
      small: NASA Vacuum Chamber
- text: Conscious for about fifteen seconds, his last memory was saliva bubbling on his tongue.
  emphasis:
  - fifteen seconds
  - saliva bubbling
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 6
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: Crews repressurized the room within thirty seconds, leaving him without any permanent damage.
  emphasis:
  - thirty seconds
  - without any permanent damage
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/S98_15754.jpg/1920px-S98_15754.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: S98 15754.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:S98_15754.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.55
    focus_y: 0.45
    card:
      kind: fact
      big: 30 SECONDS
      small: Rapid repressurization
- text: You have ninety seconds before hypoxia turns fatal, but your skin keeps you entirely intact.
  emphasis:
  - ninety seconds
  - entirely intact
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.53
    focus_y: 0.55
hook_text: THE VACUUM MYTH
