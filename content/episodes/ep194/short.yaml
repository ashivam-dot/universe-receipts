id: ep194
title: The Unit Mismatch That Lost a Mars Probe
series: Mission Files
description: How a simple software mix-up between pound-force and newtons doomed the Mars Climate Orbiter in 1999.
sources:
- https://www.latimes.com/archives/la-xpm-1999-oct-01-mn-17288-story.html
- https://www.19fortyfive.com/2026/09/mars-climate-orbiter-ran-on-pound-force-seconds-while-nasas-software-expected-newtons-and-over-nine-months-that-4-45-to-one-error-put-it-35-miles-above-mars-instead-of-85-so-on-23-september-1/
- https://spacedaily.com/m-in-1999-nasa-lost-a-125-million-mars-spacecraft-because-of-a-metric-versus-imperial-mix-up-the-kind-of-conversion-mistake-most-of-us-have-made-only-this-one-ended-with-a-probe-disappearin/
- https://en.wikipedia.org/wiki/Mars_Climate_Orbiter
- https://www.jpl.nasa.gov/news/mars-climate-orbiter-team-finds-likely-cause-of-loss/
- https://web.archive.org/web/20131226075519/http://www.pbs.org/newshour/bb/science/jan-june00/nasa_4-14.html
hashtags:
- '#space'
- '#nasa'
- '#mars'
tags:
- Mars Climate Orbiter
- Lockheed Martin
- JPL
- spacecraft failure
- unit conversion
- space missions
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A 125-million-dollar orbiter vanished because of a simple unit error.
  emphasis:
  - unit error
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Mars_Climate_Orbiter_2.jpg/1920px-Mars_Climate_Orbiter_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Mars Climate Orbiter 2.jpg
      credit: NASA/JPL/Corby Waste
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Mars_Climate_Orbiter_2.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: $125 MILLION
      small: Orbiter cost
- text: Launched in 1998, the probe spent nine months traveling to Mars.
  emphasis:
  - nine months
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3f/Delta_II_7425_carrying_Mars_Climate_Orbiter_%28KSC-98PC-1837%29.jpg/1280px-Delta_II_7425_carrying_Mars_Climate_Orbiter_%28KSC-98PC-1837%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Delta II 7425 carrying Mars Climate Orbiter (KSC-98PC-1837).jpg
      credit: NASA/KSC
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Delta_II_7425_carrying_Mars_Climate_Orbiter_(KSC-98PC-1837).jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1998'
      small: Launch
- text: In September 1999, the probe reached its destination and prepared to enter orbit.
  emphasis:
  - September 1999
  visual:
    source: card
    card:
      kind: dateline
      big: SEPTEMBER 1999
      small: Mars Arrival
    motion: zoom_in
- text: But instead of sliding into a safe path, the spacecraft went silent and never called home.
  emphasis:
  - went silent
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Deep-space-op.jpg/1280px-Deep-space-op.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Deep-space-op.jpg
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Deep-space-op.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Investigators found a lethal software conflict between NASA and the builder, Lockheed Martin.
  emphasis:
  - Lockheed Martin
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Lockheed_Martin_Office%2C_Colorado_Springs_%2854557169938%29.jpg/3840px-Lockheed_Martin_Office%2C_Colorado_Springs_%2854557169938%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Lockheed Martin Office, Colorado Springs (54557169938).jpg
      credit: Lumen Wilde
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Lockheed_Martin_Office,_Colorado_Springs_(54557169938).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: One team used metric newtons while the other used imperial pounds, a four point four five times difference.
  emphasis:
  - four point four five
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 4.45x
      small: Unit difference
    motion: zoom_in
- text: This math error steered the probe into the Martian atmosphere at an altitude of just fifty-seven kilometers.
  emphasis:
  - fifty-seven kilometers
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Mars_Climate_Orbiter_-_mishap_diagram.png/960px-Mars_Climate_Orbiter_-_mishap_diagram.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Mars Climate Orbiter - mishap diagram.png
      credit: Xession
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Mars_Climate_Orbiter_-_mishap_diagram.png
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 57 KM
      small: Actual altitude
- text: Dropping below 80 kilometers destroyed the orbiter; that was the survival limit.
  emphasis:
  - survival limit
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2e/Impactor_Debris_Scattered_Within_Mars%E2%80%99_Mantle_%28Artist%E2%80%99s_Concept%29_%28PIA26636%29.tiff/lossy-page1-3840px-Impactor_Debris_Scattered_Within_Mars%E2%80%99_Mantle_%28Artist%E2%80%99s_Concept%29_%28PIA26636%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Impactor Debris Scattered Within Mars’ Mantle (Artist’s Concept) (PIA26636).tiff
      credit: NASA/JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Impactor_Debris_Scattered_Within_Mars%E2%80%99_Mantle_(Artist%E2%80%99s_Concept)_(PIA26636).tiff
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 80 KM
      small: Survival Limit
- text: A simple unit error meant a 125-million-dollar orbiter vanished.
  emphasis:
  - orbiter vanished
