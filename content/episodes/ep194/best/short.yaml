  emphasis:
  - eighty kilometers
  - destroyed
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Mars-polar-lander_front.jpg/1920px-Mars-polar-lander_front.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
