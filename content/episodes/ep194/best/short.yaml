  - nine-month journey
  - September 1999
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Mars_Polar_Lander_-_interplanetary_trajectory.png/1280px-Mars_Polar_Lander_-_interplanetary_trajectory.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
