    focus_y: 0.5
- text: An investigation revealed builder Lockheed Martin supplied impulse data in pound-force seconds.
  emphasis:
  - Lockheed Martin
  - pound-force seconds
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Lockheed_Martin_Office%2C_Colorado_Springs_%2854557169938%29.jpg/3840px-Lockheed_Martin_Office%2C_Colorado_Springs_%2854557169938%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Lockheed Martin Office, Colorado Springs (54557169938).jpg
      credit: Lumen Wilde
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Lockheed_Martin_Office,_Colorado_Springs_(54557169938).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Meanwhile, NASA's navigation software in California expected all incoming metrics in newton-seconds.
  emphasis:
  - newton-seconds
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Spacecraft_Assembly_Room_%40_JPL_%2819322114182%29.jpg/3840px-Spacecraft_Assembly_Room_%40_JPL_%2819322114182%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Spacecraft Assembly Room @ JPL (19322114182).jpg
      credit: Kevin Gill from Los Angeles, CA, United States
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Spacecraft_Assembly_Room_@_JPL_(19322114182).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: One pound-force is equal to four point four five newtons, multiplying small thruster forces into a fatal error.
  emphasis:
  - four point four five newtons
  - fatal error
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Juno_Main_Engine_Firing.jpg/1280px-Juno_Main_Engine_Firing.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Juno Main Engine Firing.jpg
      credit: 'Produced By: JPL , Image Credit: NASA/JPL-Caltech'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Juno_Main_Engine_Firing.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: '4.45'
      small: Newtons per pound-force
