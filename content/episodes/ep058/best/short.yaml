    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In 1950, Arthur Hoag found a blue smoke ring around a golden core in the [Serpens](/sˌɜɹpˈɛnts/) constellation.
  emphasis:
  - blue smoke ring
  - golden core
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Serpens_Caput_%28Annotated%29_%28serpens-caput-ann%29.jpg/3840px-Serpens_Caput_%28Annotated%29_%28serpens-caput-ann%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Serpens Caput (Annotated) (serpens-caput-ann).jpg
