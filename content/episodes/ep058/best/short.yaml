    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Nebula?
      small: Initial Theory
- text: He even guessed it was an optical illusion caused by gravity bending distant light.
  emphasis:
  - optical illusion
  - gravity bending
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/Gravitational_Lensing_Splits_Quasar_Light_into_Five_Images_%282006-23-1930%29.jpg/1280px-Gravitational_Lensing_Splits_Quasar_Light_into_Five_Images_%282006-23-1930%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
