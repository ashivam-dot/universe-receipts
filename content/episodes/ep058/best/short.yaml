    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Illusion
      small: Gravitational Lensing
- text: But Hoag's Object is a real galaxy, six hundred million light-years away and wider than the Milky Way.
  emphasis:
  - real galaxy
  - wider
  sfx: whoosh
  visual:
    source: url
    url: https://live.staticflickr.com/8202/8275040365_f453862903_b.jpg
    credit:
      source: Flickr via Openverse
      title: Galaxy - Irregular (Hoag's object)
      credit: Marc Van Norden
      license: CC BY 2.0
