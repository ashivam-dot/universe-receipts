    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1950'
      small: Serpens
- text: Hoag first thought this bizarre structure was a simple planetary nebula or a gas cloud.
  emphasis:
  - bizarre structure
  - planetary nebula
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/1a/Ring_Nebula.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
