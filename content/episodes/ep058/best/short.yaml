    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 600 Million
      small: Light-Years Away
- text: Most ring galaxies form from violent collisions, yet no crash site exists here.
  emphasis:
  - violent collisions
  - no crash site
  visual:
    source: card
    card:
      kind: fact
      big: No Trace
      small: Missing Collision
    motion: zoom_in
- text: Peering through the dark gap at the one o’clock position reveals a one-in-a-million photobomb.
  emphasis:
  - photobomb
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/9c/Hoags_Object.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
