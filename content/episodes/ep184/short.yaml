id: ep184
title: The 25-Minute Countdown That Almost Ended the World
series: Near Misses
description: In September 1983, a Soviet early-warning satellite detected incoming American nuclear missiles. Duty officer
  Stanislav Petrov had minutes to decide whether to trigger World War Three.
