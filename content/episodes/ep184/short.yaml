id: ep184
title: The Nuclear Alarm Caused by Sunlight on Clouds
series: Near Misses
description: In September 1983, a Soviet early-warning satellite detected incoming American nuclear missiles. Duty officer
  Stanislav Petrov realized the computer alert was a massive false alarm.
