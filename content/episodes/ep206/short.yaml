id: ep206
title: We Crashed a Spacecraft Into an Asteroid on Purpose
series: Mission Files
description: NASA deliberately crashed the DART spacecraft into the asteroid moonlet Dimorphos, shortening its orbit by thirty-two
  minutes.
sources:
- https://en.wikipedia.org/wiki/Double_Asteroid_Redirection_Test
