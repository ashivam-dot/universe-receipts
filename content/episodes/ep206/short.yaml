- text: Scientists originally hoped the violent collision would shorten the moonlet orbit by just 73 seconds.
  emphasis:
  - 73 seconds
  visual:
    source: card
    card:
      kind: fact
      big: 73 seconds
      small: Expected Shift
    motion: zoom_in
- text: Instead, massive debris plumes acted like a rocket engine and punched the rock so hard it shortened the orbit by 32
    minutes.
  emphasis:
  - rocket engine
  - 32 minutes
  sfx: pop
  pause_after: 0.4
  visual:
