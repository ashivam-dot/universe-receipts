- text: Mission controllers only expected the violent collision to nudge the asteroid orbit by about seventy-three seconds.
  emphasis:
  - violent collision
  - seventy-three seconds
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ee/Webb_Captures_DART_Impact_%28weic2215c%29.jpeg/1280px-Webb_Captures_DART_Impact_%28weic2215c%29.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
