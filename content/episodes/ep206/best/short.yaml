id: ep206
title: How We Steered an Asteroid
series: Mission Files
description: NASA's DART mission successfully changed the orbit of the asteroid moonlet Dimorphos by crashing a spacecraft
  into it at 14,000 miles per hour.
sources:
- https://en.wikipedia.org/wiki/Double_Asteroid_Redirection_Test
