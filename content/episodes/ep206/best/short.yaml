    - color
    motion: zoom_out
    focus_x: 0.76
    focus_y: 0.44
    card:
      kind: fact
      big: 73 seconds
      small: Expected Change
- text: But the impact blasted so much debris into space that the recoil acted like a massive rocket engine.
  emphasis:
  - recoil
  - rocket engine
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Evolution_of_the_cloud_of_debris_around_Dimorphos_and_Didymos_after_the_DART_impact_%28eso2303a%29.tiff/lossy-page1-1920px-Evolution_of_the_cloud_of_debris_around_Dimorphos_and_Didymos_after_the_DART_impact_%28eso2303a%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Evolution of the cloud of debris around Dimorphos and Didymos after the DART impact (eso2303a).tiff
