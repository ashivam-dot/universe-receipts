- http://dart.jhuapl.edu/Mission/index.php
- https://theconversation.com/nasa-successfully-shifted-an-asteroids-orbit-dart-spacecraft-crashed-into-and-moved-dimorphos-192317
- https://www.nasa.gov/news-release/nasas-dart-mission-hits-asteroid-in-first-ever-planetary-defense-test/
- https://esawebb.org/news/weic2215/
hashtags:
- '#space'
