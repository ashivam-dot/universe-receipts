- text: In September 2022, NASA slammed a box-shaped spacecraft into Dimorphos, a moonlet seven million miles from Earth.
  emphasis:
  - September 2022
  - seven million miles
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Schematic_of_the_DART_impact_geometry_on_Dimorphos.webp/960px-Schematic_of_the_DART_impact_geometry_on_Dimorphos.webp?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
