    focus_y: 0.5
    card:
      kind: fact
      big: 14,000 mph
      small: Impact Speed
- text: While telescopes like James Webb watched, an Italian CubeSat caught the moment the probe hit the surface.
  emphasis:
  - James Webb
  - Italian CubeSat
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Twin_Tail_Revealed_in_New_Hubble_Image_of_Didymos-Dimorphos_System_Following_DART_Impact_%28opo22056a%29.jpg/1280px-Twin_Tail_Revealed_in_New_Hubble_Image_of_Didymos-Dimorphos_System_Following_DART_Impact_%28opo22056a%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
