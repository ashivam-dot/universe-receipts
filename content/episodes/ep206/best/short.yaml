- text: The DART mission targeted this 530-foot-wide rock at a staggering speed of 14,000 miles per hour.
  emphasis:
  - 530-foot-wide
  - 14,000 miles per hour
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/4a/Dimorphos_North-Up_Image_Composition_reduced_bloom.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
