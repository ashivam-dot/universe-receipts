id: ep506
title: NASA's Ship Carries Water in 103 Languages
series: Mission Files
format: v3
description: Europa Clipper, NASA's largest planetary spacecraft, carries a metal plate etched with 'water' in 103 languages,
  a poem by Ada Limón, and 2.6 million names as it heads to Jupiter's ocean moon.
