id: ep061
title: The Dark Secret of the Sombrero Galaxy
series: The Universe Is Terrifying
description: The Sombrero Galaxy looks like a peaceful cosmic hat, but advanced space telescopes have unmasked a violent past
  of galactic cannibalism.
