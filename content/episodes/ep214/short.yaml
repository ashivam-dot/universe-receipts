  emphasis:
  - cosmic dust
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Views_of_the_Galactic_Center_region_from_NASA%27s_Great_Observatories_%28opo0928h%29.tiff/lossy-page1-960px-Views_of_the_Galactic_Center_region_from_NASA%27s_Great_Observatories_%28opo0928h%29.tiff.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
