    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/The_Pistol_Star-_A_Brilliant_Star_in_Milky_Way%27s_Core_%281997-33-524%29.jpg/1920px-The_Pistol_Star-_A_Brilliant_Star_in_Milky_Way%27s_Core_%281997-33-524%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
