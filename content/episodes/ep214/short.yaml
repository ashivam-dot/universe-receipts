id: ep214
title: The Star That Outshines the Sun in Seconds
series: Scale Breaker
description: Discover the Pistol Star, a blue hypergiant so powerful it emits a year's worth of solar energy in seconds. Hidden
  by cosmic dust, this monster star redefined the limits of stellar physics.
sources:
- https://en.wikipedia.org/wiki/Pistol_Star
- https://theplanets.org/stars/pistol-star/
