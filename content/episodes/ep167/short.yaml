id: ep167
title: The Alien World Buried Inside Earth
series: The Universe Is Terrifying
description: A Mars-sized planet once vaporized the infant Earth, leaving continent-sized remnants hidden thousands of miles
  beneath our feet.
sources:
- https://en.wikipedia.org/wiki/Giant-impact_hypothesis
- https://www.nasa.gov/solar-system/collision-may-have-formed-the-moon-in-mere-hours-simulations-reveal/
- https://en.wikipedia.org/wiki/Theia_(hypothetical_planet)
- https://www.nature.com/articles/s41586-023-06589-1
- https://www.theguardian.com/science/2023/nov/01/blobs-near-earths-core-are-remnants-of-collision-with-another-planet-study-says
- https://www.scientificamerican.com/article/lost-planet-theia-that-created-the-moon-came-from-the-inner-solar-system/
- https://www.bbc.com/future/article/20220510-why-are-there-continent-sized-blobs-in-the-deep-earth
hashtags:
- '#space'
- '#theia'
- '#earth'
tags:
- Theia
- Moon formation
- Earth mantle
- Large low-velocity provinces
- planetary science
- astronomy
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: The Moon formed in hours, but part of its maker never left.
  emphasis:
  - maker never left
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/e2/Artistic_representation_or_simulation_of_the_formation_of_the_moon.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Artistic representation or simulation of the formation of the moon.png
      credit: Mp152
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artistic_representation_or_simulation_of_the_formation_of_the_moon.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Many believe the Moon slowly formed from orbiting debris over millions of years.
  emphasis:
  - slowly formed
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Moon_formation_from_ring_around_early_earth_1_r_1_1_1_1.png/1920px-Moon_formation_from_ring_around_early_earth_1_r_1_1_1_1.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Moon formation from ring around early earth 1 r 1 1 1 1.png
      credit: Merikanto
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Moon_formation_from_ring_around_early_earth_1_r_1_1_1_1.png
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Millions of Years
      small: Old formation theory
- text: Four point five billion years ago, a Mars-sized world named Theia smashed into our infant Earth.
  emphasis:
  - Mars-sized world
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c0/Giant_impact.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Giant impact.jpg
      credit: H.Seldon
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Giant_impact.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.48
    focus_y: 0.52
    card:
      kind: dateline
      big: 4.5 Billion Years Ago
      small: The giant impact
- text: High-resolution simulations now show this collision could have formed the Moon in just a few hours.
  emphasis:
  - just a few hours
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: A Few Hours
      small: Lunar formation speed
    motion: zoom_in
- text: But Theia did not just break apart; our own planet swallowed the intruder whole.
  emphasis:
  - swallowed the intruder
  sfx: whoosh
  visual:
    reuse: 3
    motion: zoom_in
    focus_x: 0.48
    focus_y: 0.52
- text: Massive iron-rich structures sit eighteen hundred miles deep beneath Africa and the Pacific Ocean.
  emphasis:
  - eighteen hundred miles
  visual:
    source: card
    card:
      kind: fact
      big: 1,800 Miles
      small: Depth of anomalies
    motion: zoom_in
- text: Two continent-sized blobs inside Earth are the ancient relics of Theia.
  emphasis:
  - ancient relics
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 2
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Deep underground lies the heart of the intruder that never left.
  emphasis:
  - intruder that never left
  visual:
    reuse: 1
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
hook_text: A PLANET INSIDE US
