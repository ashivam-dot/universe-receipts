id: ep041
title: Why Astronauts Don't Explode in Space
series: Space Myths, Busted
description: Discover why the human body doesn't explode in the vacuum of space, based on a real NASA accident.
sources:
- https://en.wikipedia.org/wiki/Effect_of_spaceflight_on_the_human_body
- https://imagine.gsfc.nasa.gov/ask_astro/space_travel.html
hashtags:
- '#space'
- '#nasa'
- '#astronaut'
tags:
- space vacuum
- Jim LeBlanc
- NASA
- space myth
- decompression
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Exposed to the vacuum of space, your body does not explode.
  emphasis:
  - does not explode
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/e/ec/Vacuum_chamber-being_opened_by_engineer.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Vacuum chamber-being opened by engineer.jpeg
      credit: NASA JPL-Caltech
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Vacuum_chamber-being_opened_by_engineer.jpeg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Popular movies love to show astronauts bursting like fragile balloons when their pressurized suits fail completely.
  emphasis:
  - bursting like fragile balloons
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Extravehicular_Mobility_Unit_%28EMU%29_spacesuit_at_National_Air_and_Space_Museum.jpg/3840px-Extravehicular_Mobility_Unit_%28EMU%29_spacesuit_at_National_Air_and_Space_Museum.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Extravehicular Mobility Unit (EMU) spacesuit at National Air and Space Museum.jpg
      credit: Chrismofer
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Extravehicular_Mobility_Unit_(EMU)_spacesuit_at_National_Air_and_Space_Museum.jpg
    fallbacks:
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: In December nineteen sixty-six, NASA test subject Jim LeBlanc tested this terrifying theory.
  emphasis:
  - Jim LeBlanc
  visual:
    source: card
    card:
      kind: dateline
      big: December 1966
      small: NASA Test Facility
    motion: zoom_in
- text: His spacesuit hose accidentally detached inside a massive altitude vacuum chamber.
  emphasis:
  - hose accidentally detached
  sfx: whoosh
  visual:
    source: url
    url: https://live.staticflickr.com/2897/13759689764_3e5a652b43_b.jpg
    credit:
      source: Flickr via Openverse
      title: Vacuum chamber
      credit: AstroSamantha
      license: CC BY 2.0
      url: https://www.flickr.com/photos/65541944@N07/13759689764
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: LeBlanc remained conscious for about fourteen seconds before severe hypoxia completely set in.
  emphasis:
  - fourteen seconds
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 14 seconds
      small: Consciousness in vacuum
    motion: zoom_in
- text: His very last conscious memory was feeling the warm saliva on his tongue start to bubble.
  emphasis:
  - saliva on his tongue start to bubble
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 4
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: A quick colleague entered the chamber within twenty-five seconds to provide emergency oxygen.
  emphasis:
  - twenty-five seconds
  visual:
    reuse: 2
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Human skin is remarkably elastic enough to prove that your body does not explode.
  emphasis:
  - human skin is remarkably elastic
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: 3 ASTRONAUTS, 1 DYING SHIP
