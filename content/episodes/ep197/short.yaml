    focus_x: 0.75
    focus_y: 0.5
    box:
    - 0.5
    - 0.0
    - 1.0
    - 1.0
    card:
      kind: fact
      big: 700 K
      small: extreme surface heat
- text: In 1965, scientists bounced radar beams off Mercury to measure its actual spin rate from Earth.
  emphasis:
  - radar beams
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/cb/Arecibo_Observatory_Black_and_White.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Arecibo Observatory Black and White.jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Arecibo_Observatory_Black_and_White.jpg
    fallbacks:
    - card
    - color
    motion: pan_up
    focus_x: 0.48
    focus_y: 0.35
    box:
    - 0.1
    - 0.05
    - 0.85
    - 0.5
    card:
      kind: dateline
      big: '1965'
      small: Earth radar observations
- text: Italian celestial mechanics specialist Giuseppe Colombo proposed the planet actually rotates once every 59 Earth days.
  emphasis:
  - Giuseppe Colombo
  - 59 Earth days
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: 59 DAYS
      small: rotation period
    motion: zoom_in
- text: Mercury is not locked 1-to-1, but instead rotates three times for every two orbits around the Sun.
  emphasis:
  - three times
  - two orbits
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/92/Unmasking_the_Secrets_of_Mercury.jpg/1920px-Unmasking_the_Secrets_of_Mercury.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Unmasking the Secrets of Mercury.jpg
      credit: NASA/Johns Hopkins University Applied Physics Laboratory/Carnegie Institution of Washington
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Unmasking_the_Secrets_of_Mercury.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Because orbital motion combines with that spin, a single solar day lasts approximately 176 Earth days.
  emphasis:
  - 176 Earth days
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/be/MESSENGER_mosaic_of_the_Caloris_basin.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: MESSENGER mosaic of the Caloris basin.png
      credit: NASA/Johns Hopkins University Applied Physics Laboratory/Carnegie Institution of Washington
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:MESSENGER_mosaic_of_the_Caloris_basin.png
    fallbacks:
    - card
    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 176 DAYS
      small: sunrise to sunrise
- text: Every morning there takes two full planetary years to arrive.
  emphasis:
  - two full planetary years
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
hook_text: TWO YEARS IN ONE DAY
