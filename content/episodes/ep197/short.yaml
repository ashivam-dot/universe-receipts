    - color
    motion: pan_left
    focus_x: 0.65
    focus_y: 0.55
    card:
      kind: fact
      big: 88 DAYS
      small: orbital period
- text: Under that permanent lock, one roasted hemisphere reached extreme temperatures exceeding 700 Kelvin.
  emphasis:
  - exceeding 700 Kelvin
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/NASA%27s_MESSENGER_Finds_New_Evidence_for_Water_Ice_at_Mercury%27s_Poles_%288230852190%29.jpg/3840px-NASA%27s_MESSENGER_Finds_New_Evidence_for_Water_Ice_at_Mercury%27s_Poles_%288230852190%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
