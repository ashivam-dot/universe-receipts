id: ep197
title: The Planet Where One Day Lasts Two Years
series: Space Myths, Busted
description: For nearly a century, astronomers believed Mercury permanently kept one face to the Sun. Radar observations proved
  it actually rotates three times for every two orbits.
sources:
- https://en.wikipedia.org/wiki/Mercury_(planet)
- http://nssdc.gsfc.nasa.gov/planetary/ice/ice_mercury.html
- http://sci.esa.int/bepicolombo/56015-missions-to-mercury/
- https://www.planetary.org/blogs/emily-lakdawalla/2008/0703_MESSENGER_Scientists_Astonished_to.html
- https://news.cornell.edu/stories/2007/05/cu-astronomer-finds-mercury-has-molten-core
hashtags:
- '#space'
- '#mercury'
- '#astronomy'
tags:
- mercury
- astronomy
- planetary science
- space myths
- radar
- giuseppe colombo
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: A single day on Mercury outlasts two of its entire years.
  emphasis:
  - Mercury
  - two of its entire years
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/False_Color_View_of_Mercury_%288497942353%29.png/1280px-False_Color_View_of_Mercury_%288497942353%29.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
