      credit: NASA Hubble
      license: CC BY 2.0
      url: https://www.flickr.com/photos/144614754@N02/52675793824
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 51 km/s
      small: Travel Speed
