id: ep103
title: The Invisible Rogue Black Hole Drifting Through Space
series: The Universe Is Terrifying
description: Discover OGLE-2011-BLG-0462, the first confirmed isolated stellar-mass black hole wandering alone through our
  galaxy.
sources:
- https://en.wikipedia.org/wiki/OGLE-2011-BLG-0462
- https://en.wikipedia.org/wiki/Rogue_black_hole
- https://www.universetoday.com/154420/the-first-rogue-black-hole-has-been-discovered-and-its-only-5000-light-years-away/
- https://arxiv.org/abs/2503.07820v1
hashtags:
- '#space'
- '#blackhole'
- '#astronomy'
tags:
- black hole
- rogue black hole
- OGLE-2011-BLG-0462
- gravitational microlensing
- Hubble Space Telescope
- astronomy
- galaxy
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: An invisible rogue black hole is wandering completely alone through our galaxy.
  emphasis:
  - invisible rogue black hole
  - completely alone
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/5d/Artist%27s_impression_of_a_black_hole_system.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Artist's impression of a black hole system.jpg
      credit: NASA, ESA, Martin Kornmesser (ESA/Hubble)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Artist%27s_impression_of_a_black_hole_system.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: In the year 2011, ground-based surveys detected a sudden spike in the brightness of a background star.
  emphasis:
  - year 2011
  - sudden spike
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/LasCampanasObservatory.jpg/1920px-LasCampanasObservatory.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: LasCampanasObservatory.jpg
      credit: Cédric Foellmi
      license: CC BY 2.5
      url: https://commons.wikimedia.org/wiki/File:LasCampanasObservatory.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '2011'
      small: Ground-Based Survey
- text: This distant star is located approximately 20,000 light-years away from Earth.
  emphasis:
  - 20,000 light-years
  visual:
    source: card
    card:
      kind: fact
      big: 20,000 light-years
      small: Distance to background star
    motion: zoom_in
- text: Astronomers realized the event occurred when an unseen object bent and magnified the star's light.
  emphasis:
  - unseen object
  - bent and magnified
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Identifying_Planets.jpg/960px-Identifying_Planets.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Identifying Planets.jpg
      credit: NASA, ESA, and A. Feild (STScI)
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:Identifying_Planets.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Using the Hubble Space Telescope, scientists spent six years measuring tiny deflections in the star's position.
  emphasis:
  - Hubble Space Telescope
  - six years
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg/1920px-Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_%28s109e5705%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Hubble Space Telescope sporting new solar arrays during SM3B (s109e5705).jpg
      credit: NASA/ESA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Hubble_Space_Telescope_sporting_new_solar_arrays_during_SM3B_(s109e5705).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: By verifying the lensing object emitted no light, they confirmed it was a black hole weighing about 7.1 times the
    mass of our Sun.
  emphasis:
  - emitted no light
  - 7.1 times the mass
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Gravitational_lensing_by_a_black_hole.jpg/960px-Gravitational_lensing_by_a_black_hole.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Gravitational lensing by a black hole.jpg
      credit: NASA, ESA, STScI, Joseph Olmsted
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Gravitational_lensing_by_a_black_hole.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 7.1 Solar Masses
      small: Confirmed Black Hole
- text: Located about 5,000 light-years away, this phantom is hurtling through space at an estimated speed of 45 to 51 kilometers
    per second.
  emphasis:
  - 5,000 light-years away
  - 45 to 51 kilometers per second
  sfx: whoosh
  visual:
    source: url
    url: https://live.staticflickr.com/65535/52675793824_85fc62ec3d_b.jpg
    credit:
