    - color
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 180 YEARS
      small: width of the full Moon
- text: Located roughly six light-years away, it is our closest neighbor after the Alpha Centauri system.
  emphasis:
  - six light-years
  - closest neighbor
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Orbital_plot_of_Proxima_Centauri.jpg/960px-Orbital_plot_of_Proxima_Centauri.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
