  emphasis:
  - red dwarf
  - unaided eye
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3d/AU_MIc_M-dwarf_artist%27s_conception.jpg/1280px-AU_MIc_M-dwarf_artist%27s_conception.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
