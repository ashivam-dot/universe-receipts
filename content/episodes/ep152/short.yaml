      credit: Taavi Niittee
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:C2020F3_(NEOWISE)_from_Estonia_2.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.3
    focus_y: 0.3
    card:
      kind: fact
      big: -3 Magnitude
      small: Peak brightness rivaling Venus
- text: Observers watched in absolute amazement from February twenty-fifth to twenty-seventh as the dazzling object was clearly
    viewed under a full sun.
  emphasis:
  - full sun
  - Observers watched
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/C-west-mar1976-ps.jpg/1920px-C-west-mar1976-ps.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
