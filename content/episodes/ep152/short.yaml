  emphasis:
  - shone so brightly
  - broad daylight
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/C-west-1976-ps.jpg/3840px-C-west-1976-ps.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
