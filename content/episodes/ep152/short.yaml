- text: Discovered photographically by astronomer Richard M. West on August tenth, 1975, the magnificent sungrazer plummeted
    toward our star.
  emphasis:
  - Richard M. West
  - sungrazer
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: August 10, 1975
      small: European Southern Observatory
    motion: zoom_in
- text: By February twenty-fifth, 1976, the cosmic visitor raced within exactly thirty million kilometers of the Sun.
  emphasis:
  - thirty million kilometers
  - February twenty-fifth
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/b/bc/Guide_leaflet_%281901%29_%2814765710404%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Guide leaflet (1901) (14765710404).jpg
      credit: Internet Archive Book Images
      license: No restrictions
      url: https://commons.wikimedia.org/wiki/File:Guide_leaflet_(1901)_(14765710404).jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 30 million km
      small: Closest approach to the Sun
- text: Intense solar heating pushed its peak apparent magnitude to minus three, easily rivaling Venus.
  emphasis:
  - minus three
  - rivaling Venus
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/C2020F3_%28NEOWISE%29_from_Estonia_2.jpg/3840px-C2020F3_%28NEOWISE%29_from_Estonia_2.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
