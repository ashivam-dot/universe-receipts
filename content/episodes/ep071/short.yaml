id: ep071
title: The 50/50 Chance of a Galactic Crash
series: The Universe Is Terrifying
description: A new study using data from Hubble and Gaia reveals that the Milky Way’s collision with Andromeda is far from
  certain.
sources:
- https://en.wikipedia.org/wiki/Andromeda%E2%80%93Milky_Way_collision
- https://science.nasa.gov/missions/hubble/apocalypse-when-hubble-casts-doubt-on-certainty-of-galactic-collision/
- https://esahubble.org/news/heic2508/?lang
- https://www.nature.com/articles/s41550-025-02563-1
- https://www.space.com/astronomy/the-milky-way-may-not-collide-with-neighboring-galaxy-andromeda-after-all-from-near-certainty-to-a-coin-flip
hashtags:
- '#space'
- '#andromeda'
- '#milkyway'
tags:
- astronomy
- galaxy
- nasa
- andromeda
- milky way
- space news
