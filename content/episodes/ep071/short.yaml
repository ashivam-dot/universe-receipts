    motion: pan_right
    focus_x: 0.45
    focus_y: 0.5
- text: For over a century, astronomers warned the Milky Way would inevitably smash into the Andromeda Galaxy.
  emphasis:
  - over a century
  - inevitably smash
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/M31%2C_the_Andromeda_Galaxy%2C_Killarney_Provincial_Park_Observatory.jpg/3840px-M31%2C_the_Andromeda_Galaxy%2C_Killarney_Provincial_Park_Observatory.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: M31, the Andromeda Galaxy, Killarney Provincial Park Observatory.jpg
      credit: Brucewaters
      license: CC BY 4.0
      url: https://commons.wikimedia.org/wiki/File:M31,_the_Andromeda_Galaxy,_Killarney_Provincial_Park_Observatory.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Andromeda is currently hurtling toward us at one hundred and ten kilometers per second.
  emphasis:
  - one hundred and ten
  - kilometers per second
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Artist%E2%80%99s_impression_of_the_Milky_Way.jpg/3840px-Artist%E2%80%99s_impression_of_the_Milky_Way.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
