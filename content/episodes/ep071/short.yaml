    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 110 km/s
      small: approach speed
- text: A 2025 study led by Till Sawala used up to one hundred thousand simulations to test this fate.
  emphasis:
  - one hundred thousand
  - simulations
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 100,000
      small: simulations
    motion: zoom_in
- text: It turns out the Large Magellanic Cloud acts like a cosmic bodyguard, pulling us off the impact course.
  emphasis:
  - cosmic bodyguard
  - impact course
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/LMC_full_color_%28Large_Magellanic_Cloud%29.jpg/3840px-LMC_full_color_%28Large_Magellanic_Cloud%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
