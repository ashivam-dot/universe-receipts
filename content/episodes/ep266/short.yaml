id: ep266
title: The Night Sky's Milk Isn't a Cloud
series: Space Myths, Busted
format: v3
description: For millennia, humans saw the Milky Way as a glowing cosmic cloud. In 1610, Galileo discovered it was actually
  a swarm of hundreds of billions of stars.
