- https://en.wikipedia.org/wiki/Richat_Structure
- https://www.esa.int/Applications/Observing_the_Earth/Earth_from_Space_Eye_of_Africa
- https://theness.com/neurologicablog/no-atlantis-has-not-been-discovered-in-north-africa/
hashtags:
- '#space'
- '#sahara'
- '#geology'
tags:
- Eye of Africa
- Richat Structure
- Sahara Desert
- geology
- astronomy
- Gemini 4
