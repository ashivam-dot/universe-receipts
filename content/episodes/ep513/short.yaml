id: ep513
title: The 25-Mile Eye Hidden in the Sahara
series: Space Got Weird
format: v3
description: Astronauts from orbit spotted a massive 25-mile ring structure in the Sahara Desert. Here is how geology created
  the famous Eye of Africa.
