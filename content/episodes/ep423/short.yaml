id: ep423
title: Why Our Galaxy's Giant Black Hole Is Tiny
series: Scale Breaker
format: v3
description: Sagittarius A-star holds the mass of four million suns yet fits inside a single planet's orbit. Scientists spent
  five years processing data to capture its first image.
