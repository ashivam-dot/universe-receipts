beats:
- text: Earth spent two months of 2024 with a second moon.
  emphasis:
  - second moon
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Earthrise_over_Compton_crater_-LRO_full_res.jpg/1920px-Earthrise_over_Compton_crater_-LRO_full_res.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Earthrise over Compton crater -LRO full res.jpg
      credit: NASA / Goddard Space Flight Center / Arizona State University
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Earthrise_over_Compton_crater_-LRO_full_res.jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.25
    box:
    - 0.33
    - 0.08
    - 0.67
    - 0.41
- text: On September 29, our gravity captured a bus-sized visitor named 2024 PT5.
  emphasis:
  - bus-sized visitor
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Webb_Detects_Extremely_Small_Main_Belt_Asteroid_%2852672254127%29.jpg/1280px-Webb_Detects_Extremely_Small_Main_Belt_Asteroid_%2852672254127%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Webb Detects Extremely Small Main Belt Asteroid (52672254127).jpg
      credit: NASA's James Webb Space Telescope from Greenbelt, MD, USA
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Webb_Detects_Extremely_Small_Main_Belt_Asteroid_(52672254127).jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: September 29, 2024
      small: Earth Orbit
- text: It stayed for 57 days, but the rock never managed to complete a full orbit.
  emphasis:
  - full orbit
  visual:
    source: card
    card:
      kind: fact
      big: 57 Days
      small: Temporary Capture
    motion: zoom_in
- text: Telescopes in Hawaii analyzed the object's light to see what it was made of.
  emphasis:
  - Hawaii
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Afshin_Darian_-_NASA_Infrared_Telescope_Facility.jpg/3840px-Afshin_Darian_-_NASA_Infrared_Telescope_Facility.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Afshin Darian - NASA Infrared Telescope Facility.jpg
      credit: Afshin Darian
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Afshin_Darian_-_NASA_Infrared_Telescope_Facility.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.4
    box:
    - 0.26
    - 0.17
    - 0.74
    - 0.56
- text: 'Here is the part I can’t get past: its chemical signature perfectly matches lunar rock.'
  emphasis:
  - lunar rock
  sfx: riser
  pause_after: 0.4
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/9/96/Lunar_Sample_61016_-_Big_Muley.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Lunar Sample 61016 - Big Muley.jpg
      credit: National Aeronautics and Space Administration
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Lunar_Sample_61016_-_Big_Muley.jpg
    fallbacks:
    - card
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: Chemical Match
      small: Lunar Rock Signature
- text: The object wasn't a random asteroid, but a piece of the Moon blasted off by a massive impact.
  emphasis:
  - massive impact
  sfx: pop
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Asteroid_falling_to_Earth.jpg/1920px-Asteroid_falling_to_Earth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Asteroid falling to Earth.jpg
      credit: State Farm
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Asteroid_falling_to_Earth.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Solar radiation pressure analysis proved this was a natural object and not human-made debris.
  emphasis:
  - natural object
  visual:
    source: card
    card:
      kind: fact
      big: Confirmed Natural
      small: Not Space Junk
    motion: zoom_in
- text: This long-lost chunk of home will return to visit us again in the year 2084.
  emphasis:
  - return
  sfx: whoosh
  visual:
    reuse: 6
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: It is the reason Earth spent two months of 2024 with a second moon.
  emphasis:
  - second moon
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.25
